<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>کلمه‌باز | قلمرو جادو</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Tahoma,Arial,sans-serif;
  background:#080619;
  color:#fff;
}

body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 0%,#38206f 0%,#17102f 35%,#080619 78%);
}


/* =========================
   ستاره‌ها
========================= */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background-image:
    radial-gradient(circle,#fff 1px,transparent 1.5px),
    radial-gradient(circle,#bca8ff 1px,transparent 1.5px),
    radial-gradient(circle,#fff 1px,transparent 1.5px);

  background-size:
    73px 73px,
    121px 121px,
    181px 181px;

  background-position:
    10px 20px,
    40px 70px,
    80px 120px;

  opacity:.75;
}


/* =========================
   ماه
========================= */

.moon{
  position:fixed;
  top:25px;
  left:22px;

  width:82px;
  height:82px;

  border-radius:50%;

  background:#fff6c7;

  box-shadow:
    0 0 25px #fff1a2,
    0 0 70px rgba(255,230,120,.35);

  z-index:0;
}

.moon::after{
  content:"";

  position:absolute;

  width:82px;
  height:82px;

  border-radius:50%;

  background:#17102f;

  left:26px;
  top:-8px;
}


/* =========================
   اپ
========================= */

.app{
  position:relative;
  z-index:2;

  width:100%;
  max-width:600px;

  margin:auto;

  padding:
    18px
    13px
    40px;
}


/* =========================
   عنوان
========================= */

.logo{
  text-align:center;

  padding-top:8px;
  margin-bottom:18px;
}

.logoIcon{
  font-size:42px;

  filter:
    drop-shadow(0 0 15px rgba(255,214,100,.45));
}

.logoTitle{
  margin-top:3px;

  font-size:29px;
  font-weight:900;

  color:#f7d66c;

  text-shadow:
    0 0 12px rgba(255,215,100,.4);
}

.logoSub{
  margin-top:5px;

  color:#a99fc7;

  font-size:12px;
}


/* =========================
   کارت آمار
========================= */

.stats{
  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:8px;

  margin-bottom:13px;
}

.stat{
  padding:11px 6px;

  text-align:center;

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      rgba(43,27,77,.94),
      rgba(15,11,35,.94)
    );

  border:
    1px solid rgba(255,255,255,.12);

  box-shadow:
    0 8px 25px rgba(0,0,0,.25);
}

.statIcon{
  font-size:19px;
}

.statTitle{
  margin-top:4px;

  color:#9187aa;

  font-size:9px;
}

.statValue{
  margin-top:3px;

  font-size:13px;
  font-weight:bold;

  color:#fff;
}


/* =========================
   کارت قهرمان
========================= */

.hero{
  position:relative;

  overflow:hidden;

  padding:20px 16px;

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      rgba(57,32,100,.96),
      rgba(18,12,40,.96)
    );

  border:
    1px solid rgba(255,214,105,.25);

  box-shadow:
    0 18px 45px rgba(0,0,0,.35),
    inset 0 0 35px rgba(126,77,222,.08);

  margin-bottom:14px;
}

.hero::before{
  content:"";

  position:absolute;

  width:180px;
  height:180px;

  border-radius:50%;

  background:
    rgba(157,102,255,.12);

  right:-100px;
  top:-100px;
}

.heroTitle{
  text-align:center;

  font-size:12px;

  color:#aaa0c8;
}

.currentLevel{
  text-align:center;

  margin-top:5px;

  font-size:39px;

  font-weight:900;

  color:#ffd96a;

  text-shadow:
    0 0 18px rgba(255,214,100,.3);
}

.levelText{
  text-align:center;

  color:#b9afd2;

  font-size:11px;

  margin-top:2px;
}


/* =========================
   XP
========================= */

.xpBox{
  margin-top:16px;
}

.xpTop{
  display:flex;

  justify-content:space-between;

  color:#aaa0c5;

  font-size:10px;

  margin-bottom:6px;
}

.xpBar{
  height:9px;

  border-radius:20px;

  overflow:hidden;

  background:#090717;

  border:
    1px solid rgba(255,255,255,.08);
}

.xpFill{
  height:100%;

  width:0%;

  background:
    linear-gradient(
      90deg,
      #7848df,
      #e3ba5c
    );

  box-shadow:
    0 0 14px rgba(141,88,255,.65);

  transition:.4s;
}


/* =========================
   دکمه ادامه
========================= */

.playButton{
  width:100%;

  min-height:57px;

  border:0;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      #8b56e8,
      #4b2992
    );

  color:#fff;

  font-size:16px;

  font-weight:900;

  box-shadow:
    0 8px 25px rgba(91,49,171,.3);

  margin-top:15px;
}

.playButton:active{
  transform:scale(.97);
}


/* =========================
   منوی اصلی
========================= */

.menu{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin-top:13px;
}

.menuButton{
  min-height:65px;

  border-radius:18px;

  border:
    1px solid rgba(255,255,255,.1);

  background:
    linear-gradient(
      145deg,
      rgba(39,26,70,.95),
      rgba(14,10,31,.95)
    );

  color:#fff;

  font-weight:bold;

  font-size:12px;
}

.menuIcon{
  display:block;

  font-size:23px;

  margin-bottom:5px;
}

.menuButton:active{
  transform:scale(.96);
}


/* =========================
   عنوان مراحل
========================= */

.sectionTitle{
  margin-top:20px;
  margin-bottom:9px;

  display:flex;

  justify-content:space-between;
  align-items:center;
}

.sectionTitle strong{
  font-size:14px;
  color:#f3d36c;
}

.sectionTitle span{
  font-size:10px;
  color:#817895;
}


/* =========================
   مراحل
========================= */

.levels{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:7px;
}

.level{
  aspect-ratio:1;

  border-radius:14px;

  border:
    1px solid rgba(255,255,255,.1);

  background:
    linear-gradient(
      145deg,
      #2b1d50,
      #130d2b
    );

  color:#fff;

  font-size:12px;

  font-weight:bold;
}

.level.current{
  border-color:#f1cb60;

  color:#ffd96a;

  box-shadow:
    0 0 15px rgba(255,210,90,.2);
}

.level.completed{
  background:
    linear-gradient(
      145deg,
      #214e42,
      #10251f
    );

  color:#74ffb3;

  border-color:
    rgba(88,255,174,.25);
}

.level.locked{
  opacity:.42;

  color:#756d87;
}

.level:active{
  transform:scale(.93);
}


/* =========================
   فوتر
========================= */

.footer{
  text-align:center;

  margin-top:25px;

  color:#5e5674;

  font-size:9px;
}

</style>
</head>


<body>

<div class="moon"></div>


<div class="app">


  <!-- لوگو -->

  <div class="logo">

    <div class="logoIcon">
      🔮
    </div>

    <div class="logoTitle">
      کلمه‌باز
    </div>

    <div class="logoSub">
      قلمرو جادویی کلمات
    </div>

  </div>


  <!-- آمار -->

  <div class="stats">

    <div class="stat">

      <div class="statIcon">
        🪙
      </div>

      <div class="statTitle">
        سکه
      </div>

      <div class="statValue" id="coins">
        100
      </div>

    </div>


    <div class="stat">

      <div class="statIcon">
        ⭐
      </div>

      <div class="statTitle">
        تجربه
      </div>

      <div class="statValue" id="xp">
        0 XP
      </div>

    </div>


    <div class="stat">

      <div class="statIcon">
        🏆
      </div>

      <div class="statTitle">
        کامل‌شده
      </div>

      <div class="statValue" id="completed">
        0
      </div>

    </div>

  </div>


  <!-- کارت مرحله -->

  <section class="hero">

    <div class="heroTitle">
      مرحله فعلی
    </div>

    <div class="currentLevel"
         id="currentLevel">
      1
    </div>

    <div class="levelText">
      قلمرو جادویی در انتظار توست ✨
    </div>


    <div class="xpBox">

      <div class="xpTop">

        <span>
          تجربه جادوگر
        </span>

        <span id="xpText">
          0 / 100
        </span>

      </div>

      <div class="xpBar">

        <div
          class="xpFill"
          id="xpFill">
        </div>

      </div>

    </div>


    <button
      class="playButton"
      onclick="continueGame()">

      ✨ ادامه ماجراجویی

    </button>

  </section>


  <!-- منو -->

  <div class="menu">

    <button
      class="menuButton"
      onclick="openShop()">

      <span class="menuIcon">
        🛒
      </span>

      فروشگاه

    </button>


    <button
      class="menuButton"
      onclick="showComingSoon('گردونه شانس')">

      <span class="menuIcon">
        🎡
      </span>

      گردونه شانس

    </button>


    <button
      class="menuButton"
      onclick="showComingSoon('راهنماها')">

      <span class="menuIcon">
        🔮
      </span>

      راهنماها

    </button>


    <button
      class="menuButton"
      onclick="showComingSoon('دستاوردها')">

      <span class="menuIcon">
        🏆
      </span>

      دستاوردها

    </button>

  </div>


  <!-- عنوان مراحل -->

  <div class="sectionTitle">

    <strong>
      🗺️ نقشه قلمرو
    </strong>

    <span id="progressText">
      0 / 500
    </span>

  </div>


  <!-- مراحل -->

  <div
    class="levels"
    id="levels">
  </div>


  <div class="footer">
    KALAMEBAZ • Ghost Studio
  </div>

</div>


<script>

/* =========================
   تنظیمات
========================= */

const TOTAL_LEVELS = 500;

const CURRENT_KEY =
  "kalemebaz_currentLevel";

const COMPLETED_KEY =
  "kalemebaz_completedLevels";

const COINS_KEY =
  "kalemebaz_coins";

const XP_KEY =
  "kalemebaz_xp";


/* =========================
   اطلاعات بازیکن
========================= */

let currentLevel =
  parseInt(
    localStorage.getItem(CURRENT_KEY) || "1"
  );

let coins =
  parseInt(
    localStorage.getItem(COINS_KEY) || "100"
  );

let xp =
  parseInt(
    localStorage.getItem(XP_KEY) || "0"
  );

let completed =
  JSON.parse(
    localStorage.getItem(COMPLETED_KEY) || "[]"
  );


/* =========================
   ذخیره
========================= */

function save(){

  localStorage.setItem(
    CURRENT_KEY,
    currentLevel
  );

  localStorage.setItem(
    COINS_KEY,
    coins
  );

  localStorage.setItem(
    XP_KEY,
    xp
  );

  localStorage.setItem(
    COMPLETED_KEY,
    JSON.stringify(completed)
  );

}


/* =========================
   ادامه بازی
========================= */

function continueGame(){

  window.location.href =
    "game.html?level=" + currentLevel;

}


/* =========================
   باز کردن مرحله
========================= */

function openLevel(level){

  if(level > currentLevel){

    alert(
      "🔒 این مرحله هنوز قفل است!\n\n" +
      "ابتدا مرحله‌های قبلی را کامل کن."
    );

    return;
  }


  window.location.href =
    "game.html?level=" + level;

}


/* =========================
   نمایش مراحل
========================= */

function renderLevels(){

  const container =
    document.getElementById("levels");

  container.innerHTML = "";


  /*
    فعلاً ۱۰۰ مرحله اول را
    در نقشه نمایش می‌دهیم.
    با اسکرول می‌توانیم بعداً
    همه ۵۰۰ مرحله را نمایش دهیم.
  */

  for(
    let level = 1;
    level <= TOTAL_LEVELS;
    level++
  ){

    const button =
      document.createElement("button");

    button.className = "level";


    if(
      completed.includes(level)
    ){

      button.classList.add(
        "completed"
      );

      button.textContent =
        "✓ " + level;

    }
    else if(
      level === currentLevel
    ){

      button.classList.add(
        "current"
      );

      button.textContent =
        level;

    }
    else if(
      level > currentLevel
    ){

      button.classList.add(
        "locked"
      );

      button.textContent =
        "🔒";

    }
    else{

      button.textContent =
        level;

    }


    button.onclick =
      () => openLevel(level);


    container.appendChild(button);

  }


  document.getElementById(
    "progressText"
  ).textContent =
    completed.length +
    " / " +
    TOTAL_LEVELS;

}


/* =========================
   آمار
========================= */

function renderStats(){

  document.getElementById(
    "coins"
  ).textContent = coins;


  document.getElementById(
    "xp"
  ).textContent =
    xp + " XP";


  document.getElementById(
    "completed"
  ).textContent =
    completed.length;


  document.getElementById(
    "currentLevel"
  ).textContent =
    currentLevel;


  const currentXP =
    xp % 100;


  document.getElementById(
    "xpText"
  ).textContent =
    currentXP + " / 100";


  document.getElementById(
    "xpFill"
  ).style.width =
    currentXP + "%";

}


/* =========================
   فروشگاه
========================= */

function openShop(){

  alert(
    "🛒 فروشگاه کلمه‌باز\n\n" +
    "به‌زودی سیستم خرید سکه و آیتم‌های جادویی فعال می‌شود! 🔮"
  );

}


/* =========================
   بخش‌های آینده
========================= */

function showComingSoon(name){

  alert(
    "✨ " +
    name +
    "\n\n" +
    "این بخش در نسخه بعدی فعال می‌شود."
  );

}


/* =========================
   شروع
========================= */

save();

renderStats();

renderLevels();

</script>

</body>
</html>

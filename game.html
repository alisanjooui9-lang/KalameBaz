<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08051b">
<title>کلمه‌باز | بازی کلمات جادویی</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 50% 10%,#30206d 0%,#110a32 38%,#05030f 100%);
    color:#fff;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

body{
    position:relative;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 15% 20%,rgba(126,91,255,.18),transparent 24%),
        radial-gradient(circle at 85% 70%,rgba(0,209,255,.12),transparent 24%);
}

button{
    font-family:inherit;
    touch-action:manipulation;
}

/* =========================
   ستاره‌ها
========================= */

#stars{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    opacity:.5;
    animation:starGlow 2.5s infinite alternate;
}

@keyframes starGlow{
    from{
        opacity:.15;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1.5);
    }
}

/* =========================
   بالای صفحه
========================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:64px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 10px;
    z-index:50;
}

.topGroup{
    display:flex;
    align-items:center;
    gap:7px;
}

.iconBtn{
    width:43px;
    height:43px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:14px;
    background:rgba(255,255,255,.075);
    color:#fff;
    font-size:20px;
}

.iconBtn:active{
    transform:scale(.92);
}

.stat{
    min-width:70px;
    height:43px;
    padding:5px 9px;
    border-radius:14px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.11);
    text-align:center;
    backdrop-filter:blur(10px);
}

.stat small{
    display:block;
    color:#a9a3c7;
    font-size:9px;
}

.stat strong{
    display:block;
    margin-top:2px;
    font-size:13px;
}

/* =========================
   عنوان مرحله
========================= */

.levelHeader{
    position:fixed;
    top:70px;
    left:0;
    right:0;
    text-align:center;
    z-index:30;
}

.levelHeader h1{
    margin:0;
    font-size:23px;
    text-shadow:0 0 22px rgba(155,116,255,.7);
}

.levelHeader p{
    margin:5px 0 0;
    color:#aaa5c5;
    font-size:11px;
}

/* =========================
   کلمات
========================= */

#wordPanel{
    position:fixed;
    top:112px;
    left:10px;
    right:10px;
    height:150px;
    padding:5px 4px;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-auto-rows:minmax(42px,auto);
    align-content:start;
    gap:8px;
    overflow-y:auto;
    z-index:25;
    scrollbar-width:none;
}

#wordPanel::-webkit-scrollbar{
    display:none;
}

.wordItem{
    min-width:0;
    min-height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:7px 8px;
    border-radius:14px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.035)
        );
    border:1px solid rgba(255,255,255,.11);
    color:#77718f;
    font-size:13px;
    letter-spacing:.5px;
    box-shadow:
        inset 0 1px rgba(255,255,255,.04),
        0 5px 16px rgba(0,0,0,.12);
}

.wordItem.solved{
    color:#fff;
    background:
        linear-gradient(
            145deg,
            rgba(73,211,174,.22),
            rgba(37,137,120,.10)
        );
    border-color:rgba(86,239,198,.5);
    box-shadow:
        0 0 20px rgba(65,224,185,.1);
}

/* =========================
   کلمه در حال ساخت
========================= */

#currentWord{
    position:fixed;
    top:270px;
    left:15px;
    right:15px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:30;
    font-size:25px;
    font-weight:bold;
    color:#fff;
    text-shadow:
        0 0 12px #67d8ff,
        0 0 28px rgba(80,150,255,.7);
}

#currentWord.empty{
    color:#716c88;
    font-size:12px;
    font-weight:normal;
    text-shadow:none;
}

/* =========================
   خط اتصال
========================= */

#connectionCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:31;
    pointer-events:none;
}

/* =========================
   چرخ حروف
========================= */

#wheel{
    position:fixed;
    left:50%;
    top:59%;
    width:min(88vw,370px);
    height:min(88vw,370px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    z-index:20;
    background:
        radial-gradient(
            circle,
            rgba(95,67,190,.25) 0%,
            rgba(34,22,85,.35) 40%,
            rgba(9,6,29,.65) 70%,
            transparent 71%
        );
    border:1px solid rgba(159,133,255,.16);
    box-shadow:
        0 0 70px rgba(89,52,220,.13),
        inset 0 0 50px rgba(115,82,255,.08);
}

#wheel:before{
    content:"✦";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:rgba(174,153,255,.28);
    font-size:34px;
    pointer-events:none;
}

/* =========================
   حروف
========================= */

.letter{
    position:absolute;
    width:61px;
    height:61px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 35% 25%,
            #604db3,
            #24195f 70%
        );

    border:2px solid rgba(187,168,255,.27);

    color:#fff;
    font-size:24px;
    font-weight:bold;

    box-shadow:
        0 8px 25px rgba(0,0,0,.45),
        inset 0 0 16px rgba(255,255,255,.06);

    z-index:40;

    transition:
        transform .12s ease,
        background .12s ease,
        box-shadow .12s ease,
        border-color .12s ease;

    touch-action:none;
    pointer-events:auto;
}

.letter.selected{
    transform:
        translate(-50%,-50%)
        scale(1.12);

    background:
        radial-gradient(
            circle at 35% 25%,
            #5edcff,
            #2456c5 72%
        );

    border-color:#c5f4ff;

    box-shadow:
        0 0 25px rgba(67,202,255,.65),
        0 8px 28px rgba(0,0,0,.5);
}

.letter.last{
    animation:letterPulse .35s ease;
}

@keyframes letterPulse{
    0%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.25)}
    100%{transform:translate(-50%,-50%) scale(1.12)}
}

/* =========================
   ابزارها
========================= */

.bottomTools{
    position:fixed;
    left:0;
    right:0;
    bottom:13px;
    display:flex;
    justify-content:center;
    gap:7px;
    z-index:70;
}

.tool{
    width:61px;
    height:55px;
    padding:0;
    border:1px solid rgba(255,255,255,.12);
    border-radius:17px;
    background:rgba(255,255,255,.075);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    backdrop-filter:blur(12px);
}

.tool span{
    font-size:20px;
}

.tool small{
    color:#aaa6c1;
    font-size:8px;
}

.tool:active{
    transform:scale(.92);
}

/* =========================
   Loading
========================= */

#loading{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at center,
            #241750,
            #08051b 65%,
            #03020a
        );
    z-index:999;
    transition:opacity .25s ease;
}

.loadingLogo{
    font-size:44px;
    animation:magicPulse 1.5s infinite alternate;
}

@keyframes magicPulse{
    from{
        transform:scale(.94);
        opacity:.65;
    }
    to{
        transform:scale(1.08);
        opacity:1;
    }
}

.loadingTitle{
    margin-top:10px;
    font-size:27px;
    font-weight:bold;
}

.loadingText{
    margin-top:9px;
    color:#aaa5c4;
    font-size:12px;
}

.loader{
    width:170px;
    height:5px;
    margin-top:22px;
    overflow:hidden;
    border-radius:10px;
    background:rgba(255,255,255,.1);
}

.loader:after{
    content:"";
    display:block;
    width:45%;
    height:100%;
    border-radius:10px;
    background:#8d6cff;
    animation:loadingMove 1s infinite;
}

@keyframes loadingMove{
    0%{transform:translateX(240%)}
    100%{transform:translateX(-240%)}
}

/* =========================
   Toast
========================= */

#toast{
    position:fixed;
    left:50%;
    bottom:83px;
    transform:translate(-50%,20px);
    max-width:90vw;
    padding:11px 17px;
    border-radius:15px;
    background:rgba(12,8,31,.96);
    border:1px solid rgba(255,255,255,.13);
    color:#fff;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    z-index:1000;
    transition:.22s;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   Modal
========================= */

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    z-index:500;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(350px,100%);
    padding:27px 20px;
    text-align:center;
    border-radius:27px;
    background:
        linear-gradient(
            145deg,
            #241853,
            #0b071f
        );
    border:1px solid rgba(169,143,255,.25);
    box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.modalBox .emoji{
    font-size:48px;
}

.modalBox h2{
    margin:10px 0;
}

.modalBox p{
    color:#aaa6c2;
    font-size:12px;
}

.modalBtns{
    display:flex;
    gap:9px;
    margin-top:20px;
}

.modalBtns button{
    flex:1;
    height:47px;
    border:0;
    border-radius:14px;
    background:#33236f;
    color:#fff;
}

.modalBtns .primary{
    background:
        linear-gradient(
            135deg,
            #704eff,
            #328fff
        );
}

/* =========================
   نمایشگرهای کوچک
========================= */

@media(max-height:680px){

    .topbar{
        height:57px;
    }

    .levelHeader{
        top:61px;
    }

    #wordPanel{
        top:101px;
        height:125px;
    }

    #currentWord{
        top:226px;
    }

    #wheel{
        top:59%;
    }

    .bottomTools{
        bottom:8px;
    }
}

@media(max-width:360px){

    .stat{
        min-width:62px;
    }

    .letter{
        width:55px;
        height:55px;
        font-size:22px;
    }

    .tool{
        width:54px;
    }
}

@media(min-width:700px){

    #wheel{
        width:430px;
        height:430px;
    }

    .letter{
        width:68px;
        height:68px;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<canvas id="connectionCanvas"></canvas>

     Loading
========================= -->

    <div class="loadingLogo">✨</div>

        کلمه‌باز
    </div>

========================= -->

</div>

<!-- =========================
     Words
========================= -->

<div id="wordPanel"></div>

<!-- =========================
     Current word
========================= -->

<div
    id="currentWord"
    class="empty"
>
    انگشتت را روی حروف بکش

     Letter Wheel

<div class="bottomTools">

    <button
        class="tool"
        onclick="normalHint()"
    >
        <span>💡</span>
        <small>راهنما</small>
    </button>

    <button
        class="tool"
        onclick="useLetterItem()"
    >
        <span>🔤</span>
        <small>حرف</small>
    </button>

    <button
        class="tool"
        onclick="useRemoveItem()"
    >
        <span>🧹</span>

    >
        <span>✨</span>

    >
        <span>🧪</span>

<div id="toast"></div>

<!-- =========================

========================= -->

<div
    id="levelModal"

>

    <div class="modalBox">

        <div class="emoji">

        </div>

        <h2>
            مرحله کامل شد!
        </h2>

        </p>

        <div class="modalBtns">

            <button onclick="goHome()">
                خانه
            </button>

            <button
                class="primary"
                onclick="nextLevel()"

                مرحله بعد
            </button>

</div>

<!-- =====================================================
     LEVEL DATA
===================================================== -->

<script src="levels.js"></script>

<script>
"use strict";

/* =====================================================
   دریافت Level
===================================================== */

const LEVELS =
    window.KALAMEBAZ_LEVELS ||
    window.KalameBazLevels ||
    window.levels ||
    {};

let level =
    parseInt(
        new URLSearchParams(location.search)
            .get("level") || "1",
        10
    );

if(
    !Number.isFinite(level) ||
    level < 1
){
    level = 1;
}

/*
   مهم:
   اینجا TOTAL_LEVELS دوباره تعریف نمی‌شود.
*/

const MAX_LEVEL =
    Number(
        window.KALAMEBAZ_TOTAL_LEVELS ||
        window.TOTAL_LEVELS ||
        1200
    );

/* =====================================================
   State
===================================================== */

let words = [];

let state = {
    solvedWords: [],
    revealed: {},
    wrongAttempts: 0
};

let letterData = [];

let selectedIndices = [];

let selectedLetters = [];

let dragging = false;

let activePointerId = null;

let toastTimer = null;

/* =====================================================
   Elements
===================================================== */

const loading =
    document.getElementById("loading");

const wheel =
    document.getElementById("wheel");

const wordPanel =
    document.getElementById("wordPanel");

const currentWord =
    document.getElementById("currentWord");

const canvas =
    document.getElementById(
        "connectionCanvas"
    );

const ctx =
    canvas.getContext("2d");

/* =====================================================
   Normalize Persian
===================================================== */

function normalizeWord(word){

    return String(word || "")
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ۀ/g,"ه")
        .replace(/ة/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/إ/g,"ا")
        .replace(/أ/g,"ا")
        .replace(/ٱ/g,"ا")
        .replace(/‌/g,"")
        .replace(/\u200c/g,"")
        .replace(/\u200d/g,"")
        .replace(/\s+/g,"")
        .trim();
}

/* =====================================================
   Load level
===================================================== */

function loadLevel(){

    let raw = null;

    try{

        raw = LEVELS[level];

    }catch(error){

        console.error(
            "KALAMEBAZ LEVEL ERROR:",
            error
        );
    }

    if(Array.isArray(raw)){

        words =
            raw
                .map(normalizeWord)
                .filter(Boolean);

    }else{

        words = [];
    }

    console.log(
        "مرحله:",
        level,
        "کلمات:",
        words
    );
}

/* =====================================================
   State
===================================================== */

function loadState(){

    const key =
        "kalemebaz_levelState_" +
        level;

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(key)
                || "null"
            );

        if(saved){
            state = saved;
        }

    }catch(error){

        state = {
            solvedWords: [],
            revealed: {},
            wrongAttempts: 0
        };
    }

    if(
        !Array.isArray(
            state.solvedWords
        )
    ){
        state.solvedWords = [];
    }

    if(!state.revealed){
        state.revealed = {};
    }

    if(
        typeof state.wrongAttempts
        !== "number"
    ){
        state.wrongAttempts = 0;
    }
}

function saveState(){

    const key =
        "kalemebaz_levelState_" +
        level;

    try{

        localStorage.setItem(
            key,
            JSON.stringify(state)
        );

    }catch(error){

        console.warn(
            "خطا در ذخیره بازی",
            error
        );
    }
}

/* =====================================================
   Stars
===================================================== */

function createStars(){

    const container =
        document.getElementById(
            "stars"
        );

    for(
        let i = 0;
        i < 75;
        i++
    ){

        const star =
            document.createElement(
                "div"
            );

        star.className =
            "star";

        star.style.left =
            Math.random()*100 +
            "%";

        star.style.top =
            Math.random()*100 +
            "%";

        star.style.animationDelay =
            Math.random()*2 +
            "s";

        container.appendChild(star);
    }
}

/* =====================================================
   Coins / XP
===================================================== */

function getCoins(){

    return parseInt(
        localStorage.getItem(
            "kalemebaz_coins"
        ) || "0",
        10
    );
}

function getXP(){

    return parseInt(
        localStorage.getItem(
            "kalemebaz_xp"
        ) || "0",
        10
    );
}

function setCoins(value){

    localStorage.setItem(
        "kalemebaz_coins",
        String(
            Math.max(
                0,
                Math.floor(value)
            )
        )
    );
}

function setXP(value){

    localStorage.setItem(
        "kalemebaz_xp",
        String(
            Math.max(
                0,
                Math.floor(value)
            )
        )
    );
}

function addCoins(value){
    setCoins(getCoins()+value);
}

function addXP(value){
    setXP(getXP()+value);
}

/* =====================================================
   Items
===================================================== */

function getItem(key){

    return parseInt(
        localStorage.getItem(key)
        || "0",
        10
    );
}

function setItem(
    key,
    value
){

    localStorage.setItem(
        key,
        String(
            Math.max(
                0,
                Math.floor(value)
            )
        )
    );
}

/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById(
        "coins"
    ).textContent =
        getCoins();

    document.getElementById(
        "xp"
    ).textContent =
        getXP();
}

/* =====================================================
   Toast
===================================================== */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            1800
        );
}

/* =====================================================
   Word panel
===================================================== */

function renderWords(){

    wordPanel.innerHTML = "";

    words.forEach(
        word => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "wordItem";

            const solved =
                state.solvedWords
                    .includes(word);

            if(solved){

                item.textContent =
                    word;

                item.classList.add(
                    "solved"
                );

            }else{

                item.textContent =
                    Array(
                        word.length
                    )
                    .fill("•")
                    .join(" ");
            }

            wordPanel.appendChild(
                item
            );
        }
    );
}

/* =====================================================
   Unique letters
===================================================== */

function getUniqueLetters(){

    const result = [];

    for(
        const word of words
    ){

        for(
            const char of word
        ){

            if(
                char &&
                !result.includes(char)
            ){

                result.push(char);
            }
        }
    }

    return result;
}

/* =====================================================
   Build wheel
===================================================== */

function buildWheel(){

    wheel
        .querySelectorAll(
            ".letter"
        )
        .forEach(
            el => el.remove()
        );

    letterData = [];

    const letters =
        getUniqueLetters();

    if(!letters.length){

        showError(
            "حروف مرحله پیدا نشد."
        );

        return;
    }

    const rect =
        wheel.getBoundingClientRect();

    const centerX =
        rect.width / 2;

    const centerY =
        rect.height / 2;

    const radius =
        Math.min(
            rect.width,
            rect.height
        ) * .35;

    letters.forEach(
        (letter,index)=>{

            const angle =
                -Math.PI/2 +
                index *
                (Math.PI*2 /
                letters.length);

            const x =
                centerX +
                Math.cos(angle) *
                radius;

            const y =
                centerY +
                Math.sin(angle) *
                radius;

            const el =
                document.createElement(
                    "div"
                );

            el.className =
                "letter";

            el.textContent =
                letter;

            el.dataset.index =
                index;

            el.style.left =
                x + "px";

            el.style.top =
                y + "px";

            /*
               Pointer Events واقعی
               برای موبایل
            */

            el.addEventListener(
                "pointerdown",
                handlePointerDown
            );

            wheel.appendChild(el);

            letterData.push({
                element:el,
                letter:letter,
                x:x,
                y:y
            });
        }
    );

    /*
       pointermove روی خود wheel
       قرار گرفته تا حتی اگر انگشت
       سریع حرکت کند، انتخاب ادامه داشته باشد.
    */

    wheel.addEventListener(
        "pointermove",
        handleWheelMove,
        {
            passive:false
        }
    );

    drawLines();
}

/* =====================================================
   Pointer Down
===================================================== */

function handlePointerDown(event){

    event.preventDefault();

    dragging = true;

    activePointerId =
        event.pointerId;

    selectedIndices = [];

    selectedLetters = [];

    const index =
        Number(
            event.currentTarget
                .dataset.index
        );

    selectLetter(index);

    try{
        event.currentTarget
            .setPointerCapture(
                event.pointerId
            );
    }catch(e){}
}

/* =====================================================
   Pointer Move
===================================================== */

function handleWheelMove(event){

    if(!dragging){
        return;
    }

    if(
        activePointerId !== null &&
        event.pointerId !==
        activePointerId
    ){
        return;
    }

    event.preventDefault();

    /*
       مهم‌ترین بخش Drag موبایل:
       موقعیت انگشت را پیدا می‌کنیم
       و نزدیک‌ترین حرف را انتخاب می‌کنیم.
    */

    const rect =
        wheel.getBoundingClientRect();

    const x =
        event.clientX -
        rect.left;

    const y =
        event.clientY -
        rect.top;

    let closest = -1;

    let minDistance = Infinity;

    for(
        let i=0;
        i<letterData.length;
        i++
    ){

        const data =
            letterData[i];

        const dx =
            x - data.x;

        const dy =
            y - data.y;

        const distance =
            Math.sqrt(
                dx*dx +
                dy*dy
            );

        /*
           محدوده برخورد
           کمی بزرگ‌تر از خود دایره
        */

        if(
            distance < 43 &&
            distance < minDistance
        ){

            closest = i;

            minDistance =
                distance;
        }
    }

    if(
        closest !== -1
    ){

        selectLetter(
            closest
        );
    }

    drawLines();
}

/* =====================================================
   Select letter
===================================================== */

function selectLetter(index){

    if(
        !letterData[index]
    ){
        return;
    }

    /*
       اگر دوباره به همان حرف برگشت
       انتخاب را تکرار نکن.
    */

    if(
        selectedIndices.includes(
            index
        )
    ){
        return;
    }

    selectedIndices.push(
        index
    );

    selectedLetters.push(
        letterData[index].letter
    );

    letterData[index]
        .element
        .classList.add(
            "selected",
            "last"
        );

    setTimeout(
        ()=>{
            if(
                letterData[index]
            ){
                letterData[index]
                    .element
                    .classList.remove(
                        "last"
                    );
            }
        },
        350
    );

    updateCurrentWord();

    drawLines();
}

/* =====================================================
   Pointer Up
===================================================== */

function finishDrag(event){

    if(!dragging){
        return;
    }

    if(
        activePointerId !== null &&
        event.pointerId !==
        activePointerId
    ){
        return;
    }

    event.preventDefault();

    dragging = false;

    activePointerId = null;

    submitWord();
}

window.addEventListener(
    "pointerup",
    finishDrag,
    {
        passive:false
    }
);

window.addEventListener(
    "pointercancel",
    finishDrag,
    {
        passive:false
    }
);

/* =====================================================
   Current word
===================================================== */

function updateCurrentWord(){

    const text =
        selectedLetters.join("");

    if(text){

        currentWord.textContent =
            text;

        currentWord.classList.remove(
            "empty"
        );

    }else{

        currentWord.textContent =
            "انگشتت را روی حروف بکش";

        currentWord.classList.add(
            "empty"
        );
    }
}

/* =====================================================
   Clear
===================================================== */

function clearSelection(){

    selectedIndices.forEach(
        index => {

            if(
                letterData[index]
            ){

                letterData[index]
                    .element
                    .classList.remove(
                        "selected",
                        "last"
                    );
            }
        }
    );

    selectedIndices = [];

    selectedLetters = [];

    updateCurrentWord();

    drawLines();
}

/* =====================================================
   Canvas
===================================================== */

function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

    drawLines();
}

function drawLines(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(
        selectedIndices.length < 2
    ){
        return;
    }

    const rect =
        wheel.getBoundingClientRect();

    ctx.beginPath();

    selectedIndices.forEach(
        (index,pos)=>{

            const data =
                letterData[index];

            if(!data){
                return;
            }

            const x =
                rect.left +
                data.x;

            const y =
                rect.top +
                data.y;

            if(pos===0){

                ctx.moveTo(
                    x,
                    y
                );

            }else{

                ctx.lineTo(
                    x,
                    y
                );
            }
        }
    );

    ctx.lineWidth = 8;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.strokeStyle =
        "rgba(88,214,255,.92)";

    ctx.shadowColor =
        "rgba(80,190,255,.8)";

    ctx.shadowBlur = 13;

    ctx.stroke();

    ctx.shadowBlur = 0;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

/* =====================================================
   Submit
===================================================== */

function submitWord(){

    const word =
        normalizeWord(
            selectedLetters.join("")
        );

    if(!word){

        clearSelection();

        return;
    }

    if(
        words.includes(word)
    ){

        if(
            !state.solvedWords
                .includes(word)
        ){

            state.solvedWords.push(
                word
            );

            saveState();

            addCoins(10);

            addXP(20);

            showToast(
                "✨ کلمه درست بود!"
            );

            renderWords();

            updateHUD();

            if(
                state.solvedWords.length >=
                words.length
            ){

                completeLevel();
            }

        }else{

            showToast(
                "این کلمه قبلاً پیدا شده"
            );
        }

    }else{

        state.wrongAttempts++;

        saveState();

        showToast(
            "❌ کلمه اشتباه است"
        );
    }

    clearSelection();
}

/* =====================================================
   Complete
===================================================== */

function completeLevel(){

    let completed = [];

    try{

        completed =
            JSON.parse(
                localStorage.getItem(
                    "kalemebaz_completedLevels"
                ) || "[]"
            );

    }catch(e){

        completed = [];
    }

    if(
        !completed.includes(level)
    ){

        completed.push(level);

        localStorage.setItem(
            "kalemebaz_completedLevels",
            JSON.stringify(completed)
        );

        addCoins(30);

        addXP(50);
    }

    updateHUD();

    const modal =
        document.getElementById(
            "levelModal"
        );

    if(modal){

        modal.classList.add(
            "show"
        );
    }
}

/* =====================================================
   Navigation
===================================================== */

function goHome(){

    location.href =
        "index.html";
}

function goShop(){

    location.href =
        "shop.html";
}

function nextLevel(){

    const next =
        level + 1;

    if(
        next > MAX_LEVEL
    ){

        showToast(
            "🏆 همه مراحل تمام شدند!"
        );

        return;
    }

    location.href =
        "game.html?level=" +
        next;
}

/* =====================================================
   Hint
===================================================== */

function normalHint(){

    const cost = 20;

    if(
        getCoins() < cost
    ){

        showToast(
            "🪙 سکه کافی نداری"
        );

        return;
    }

    const unsolved =
        words.filter(
            word =>
                !state.solvedWords
                    .includes(word)
        );

    if(!unsolved.length){
        return;
    }

    const target =
        unsolved[0];

    addCoins(-cost);

    state.revealed[target] =
        target[0];

    saveState();

    updateHUD();

    showToast(
        "💡 حرف اول: " +
        target[0]
    );
}

/* =====================================================
   Letter item
===================================================== */

function useLetterItem(){

    const key =
        "kalemebaz_hintLetters";

    const count =
        getItem(key);

    if(count<=0){

        showToast(
            "🔤 آیتم حرف نداری"
        );

        return;
    }

    const unsolved =
        words.filter(
            word =>
                !state.solvedWords
                    .includes(word)
        );

    if(!unsolved.length){
        return;
    }

    setItem(
        key,
        count-1
    );

    showToast(
        "🔤 حرف اول: " +
        unsolved[0][0]
    );
}

/* =====================================================
   Remove item
===================================================== */

function useRemoveItem(){

    const key =
        "kalemebaz_removeLetters";

    const count =
        getItem(key);

    if(count<=0){

        showToast(
            "🧹 پاک‌کن نداری"
        );

        return;
    }

    setItem(
        key,
        count-1
    );

    showToast(
        "🧹 پاک‌کن استفاده شد"
    );
}

/* =====================================================
   Solve item
===================================================== */

function useSolveItem(){

    const key =
        "kalemebaz_solveWords";

    const count =
        getItem(key);

    if(count<=0){

        showToast(
            "✨ آیتم جواب نداری"
        );

        return;
    }

    const unsolved =
        words.filter(
            word =>
                !state.solvedWords
                    .includes(word)
        );

    if(!unsolved.length){
        return;
    }

    const target =
        unsolved[0];

    setItem(
        key,
        count-1
    );

    state.solvedWords.push(
        target
    );

    saveState();

    addCoins(10);

    addXP(20);

    renderWords();

    updateHUD();

    showToast(
        "✨ جواب: " +
        target
    );

    if(
        state.solvedWords.length >=
        words.length
    ){

        completeLevel();
    }
}

   Potion
===================================================== */

function usePotion(){

    const key =

    const count =
        getItem(key);

    if(count<=0){

        showToast(

        );

/* =====================================================
   Error
===================================================== */

function showError(message){

    loading.innerHTML = `
        <div class="loadingLogo">
            ⚠️
        </div>

        <div class="loadingTitle">
            خطا
        </div>

        <div class="loadingText">
            ${message}
        </div>

        <button
            onclick="location.reload()"
            style="
                margin-top:22px;
                padding:12px 26px;
                border:0;
                border-radius:14px;
                background:#684dff;
                color:#fff;
                font-family:inherit;
            "
        >
            تلاش دوباره
        </button>
    `;
}

/* =====================================================
   Init
===================================================== */

function initGame(){

    try{

        loadLevel();

        if(
            words.length === 0
        ){

            showError(
                "کلمات این مرحله پیدا نشدند."
            );

            return;
        }

        loadState();

        document
            .getElementById(
                "levelTitle"
            )
            .textContent =
            "مرحله " + level;

        renderWords();

        updateHUD();

        buildWheel();

        resizeCanvas();

        requestAnimationFrame(
            ()=>{
                loading.style.opacity =
                    "0";

                setTimeout(
                    ()=>{
                        loading.style.display =
                            "none";
                    },
                    260
                );
            }
        );

    }catch(error){

        console.error(
            "KALAMEBAZ ERROR:",
            error
        );

        showError(
            "اجرای بازی با خطا مواجه شد."
        );
    }
}

/* =====================================================
   Start
===================================================== */

createStars();

resizeCanvas();

requestAnimationFrame(
    initGame
);

</script>

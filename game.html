<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>کلمه‌باز | مرحله</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Tahoma,Arial,sans-serif;
  background:#090617;
  color:#fff;
}

body{
  touch-action:none;
}

:root{
  --main:#a855f7;
  --main2:#7c3aed;
  --cyan:#22d3ee;
  --gold:#facc15;
  --green:#22c55e;
  --red:#ef4444;
  --panel:rgba(20,13,43,.88);
}

#app{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 8%,rgba(124,58,237,.35),transparent 32%),
    radial-gradient(circle at 10% 85%,rgba(34,211,238,.12),transparent 28%),
    linear-gradient(180deg,#0b0620 0%,#12082b 48%,#080512 100%);
}

#stars{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:white;
  opacity:.7;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.15;transform:scale(.7)}
  to{opacity:1;transform:scale(1.5)}
}

.moon{
  position:absolute;
  width:125px;
  height:125px;
  border-radius:50%;
  top:-35px;
  left:50%;
  transform:translateX(-50%);
  background:radial-gradient(circle at 35% 30%,#fff,#d9c8ff 48%,#8c6bd1 100%);
  box-shadow:0 0 45px rgba(190,170,255,.55);
  opacity:.8;
}

.topbar{
  position:relative;
  z-index:10;
  height:72px;
  padding:10px 12px;
  padding-top:max(10px,env(safe-area-inset-top));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.topBtn{
  width:45px;
  height:45px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:15px;
  background:rgba(15,9,35,.8);
  color:#fff;
  font-size:21px;
  box-shadow:0 5px 18px rgba(0,0,0,.25);
}

.stats{
  display:flex;
  gap:6px;
  flex:1;
  justify-content:center;
}

.stat{
  min-width:72px;
  height:42px;
  padding:0 9px;
  border-radius:14px;
  background:rgba(21,13,48,.82);
  border:1px solid rgba(255,255,255,.1);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:12px;
  font-weight:bold;
}

.levelTitle{
  position:relative;
  z-index:3;
  text-align:center;
  margin-top:2px;
  font-size:20px;
  font-weight:900;
  text-shadow:0 0 18px rgba(168,85,247,.8);
}

.levelSub{
  position:relative;
  z-index:3;
  text-align:center;
  margin-top:4px;
  color:#b9acd7;
  font-size:11px;
}

.progress{
  position:relative;
  z-index:3;
  width:calc(100% - 45px);
  max-width:500px;
  height:8px;
  margin:9px auto 8px;
  border-radius:20px;
  overflow:hidden;
  background:rgba(255,255,255,.1);
}

.progressFill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--main2),var(--cyan));
  box-shadow:0 0 12px var(--main);
  transition:.35s;
}

#gameArea{
  position:absolute;
  left:0;
  right:0;
  top:160px;
  bottom:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
}

.words{
  position:relative;
  z-index:5;
  width:calc(100% - 28px);
  max-width:520px;
  min-height:105px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.wordCard{
  min-height:45px;
  border-radius:14px;
  background:rgba(25,16,53,.78);
  border:1px solid rgba(255,255,255,.09);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:5px;
  box-shadow:inset 0 0 20px rgba(168,85,247,.04);
}

.wordCard.solved{
  border-color:rgba(34,197,94,.45);
  background:rgba(20,75,49,.3);
}

.wordLetters{
  display:flex;
  direction:rtl;
  gap:3px;
}

.slot{
  width:18px;
  height:26px;
  border-bottom:2px solid #8b78aa;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:15px;
  font-weight:900;
}

.slot.revealed{
  color:#facc15;
  border-color:#facc15;
}

.cardCheck{
  font-size:16px;
  color:#4ade80;
}

.currentBox{
  position:relative;
  z-index:5;
  margin-top:6px;
  width:calc(100% - 50px);
  max-width:420px;
  min-height:40px;
  border-radius:16px;
  border:1px solid rgba(168,85,247,.35);
  background:rgba(10,6,25,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:5px 10px;
  box-shadow:0 0 20px rgba(124,58,237,.1);
}

#currentWord{
  min-height:27px;
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
  color:#fff;
}

#connectionCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  pointer-events:none;
}

.wheel{
  position:relative;
  z-index:4;
  width:min(72vw,320px);
  height:min(72vw,320px);
  max-width:320px;
  max-height:320px;
  min-width:230px;
  min-height:230px;
  margin-top:8px;
  border-radius:50%;
  background:
    radial-gradient(circle,rgba(35,20,70,.9) 0 33%,rgba(19,11,43,.75) 34% 57%,rgba(124,58,237,.08) 58% 100%);
  box-shadow:
    0 0 0 1px rgba(168,85,247,.15),
    0 0 40px rgba(124,58,237,.16),
    inset 0 0 45px rgba(0,0,0,.35);
}

.wheelCenter{
  position:absolute;
  width:72px;
  height:72px;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.1);
  background:radial-gradient(circle,#24144d,#100821);
  box-shadow:0 0 25px rgba(168,85,247,.22);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:10px;
  color:#a99ac6;
  pointer-events:none;
}

.letterBtn{
  position:absolute;
  width:54px;
  height:54px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid rgba(255,255,255,.12);
  background:linear-gradient(145deg,#3a2172,#1c103b);
  color:#fff;
  font-size:20px;
  font-weight:900;
  box-shadow:
    0 7px 16px rgba(0,0,0,.35),
    0 0 13px rgba(124,58,237,.16);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .12s,background .12s,box-shadow .12s,opacity .12s;
}

.letterBtn:active{
  transform:translate(-50%,-50%) scale(.94);
}

.letterBtn.selected{
  background:linear-gradient(145deg,#8b5cf6,#4c1d95);
  border-color:#c4b5fd;
  box-shadow:
    0 0 20px rgba(168,85,247,.7),
    inset 0 0 15px rgba(255,255,255,.1);
  transform:translate(-50%,-50%) scale(1.1);
}

.letterBtn.disabled{
  opacity:.18;
  filter:grayscale(1);
  pointer-events:none;
}

.tools{
  position:relative;
  z-index:6;
  width:calc(100% - 22px);
  max-width:500px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:6px;
}

.tool{
  min-height:48px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(22,13,46,.82);
  color:#fff;
  font-size:10px;
  font-weight:bold;
}

.tool span{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

.bottom{
  position:relative;
  z-index:7;
  width:calc(100% - 22px);
  max-width:500px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:6px;
  padding-bottom:max(8px,env(safe-area-inset-bottom));
}

.mainBtn{
  min-height:43px;
  border:0;
  border-radius:15px;
  color:#fff;
  font-weight:900;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  box-shadow:0 7px 20px rgba(124,58,237,.28);
}

.mainBtn.secondary{
  background:rgba(31,19,59,.9);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:none;
}

button{
  font-family:inherit;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
}

.toast{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:25px;
  transform:translate(-50%,30px);
  opacity:0;
  pointer-events:none;
  padding:11px 18px;
  border-radius:15px;
  background:rgba(15,9,30,.96);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 10px 35px rgba(0,0,0,.4);
  font-size:13px;
  font-weight:bold;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.toast.good{
  border-color:rgba(34,197,94,.55);
}

.toast.bad{
  border-color:rgba(239,68,68,.55);
}

.modal{
  position:fixed;
  z-index:200;
  inset:0;
  background:rgba(4,2,12,.76);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(92vw,390px);
  border-radius:25px;
  padding:25px 18px;
  text-align:center;
  background:
    radial-gradient(circle at top,rgba(168,85,247,.2),transparent 45%),
    #17102d;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.modalIcon{
  font-size:48px;
  margin-bottom:7px;
}

.modalTitle{
  font-size:23px;
  font-weight:900;
  margin-bottom:8px;
}

.modalText{
  color:#c4b9d9;
  font-size:13px;
  line-height:1.9;
}

.modalReward{
  margin:15px 0;
  padding:12px;
  border-radius:16px;
  background:rgba(255,255,255,.05);
  color:#facc15;
  font-weight:900;
}

.modal button{
  width:100%;
  height:48px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;
  font-weight:900;
  font-size:14px;
}

.shake{
  animation:shake .35s;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}

.correctFlash{
  animation:correctFlash .5s;
}

@keyframes correctFlash{
  50%{
    box-shadow:0 0 45px rgba(34,197,94,.8);
  }
}

.confetti{
  position:fixed;
  z-index:150;
  width:7px;
  height:13px;
  pointer-events:none;
  animation:fall 900ms linear forwards;
}

@keyframes fall{
  0%{
    transform:translate(0,0) rotate(0);
    opacity:1;
  }
  100%{
    transform:translate(var(--x),var(--y)) rotate(500deg);
    opacity:0;
  }
}

#loading{
  position:fixed;
  z-index:500;
  inset:0;
  background:#090617;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
}

.loader{
  width:48px;
  height:48px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.1);
  border-top-color:#a855f7;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.loadingText{
  color:#b8a9d5;
  font-size:12px;
}
</style>
</head>

<body>

<div id="loading">
  <div class="loader"></div>
  <div class="loadingText">در حال آماده‌سازی مرحله...</div>
</div>

<div id="app">

  <div id="stars"></div>
  <div class="moon"></div>

  <header class="topbar">
    <button class="topBtn" onclick="goHome()">⌂</button>

    <div class="stats">
      <div class="stat">🪙 <b id="coins">0</b></div>
      <div class="stat">⭐ <b id="xp">0</b></div>
      <div class="stat">❤️ <b id="hearts">∞</b></div>
    </div>

    <button class="topBtn" onclick="goShop()">🛒</button>
  </header>

  <div class="levelTitle" id="levelTitle">مرحله ۱</div>
  <div class="levelSub" id="levelSub">جنگل جادویی</div>

  <div class="progress">
    <div class="progressFill" id="progressFill"></div>
  </div>

  <main id="gameArea">

    <div class="words" id="words"></div>

    <div class="currentBox" id="currentBox">
      <div id="currentWord">حروف را بکش...</div>
    </div>

    <canvas id="connectionCanvas"></canvas>

    <div class="wheel" id="wheel">
      <div class="wheelCenter">کلمه<br>جادویی</div>
    </div>

    <div class="tools">
      <button class="tool" onclick="useLetterItem()">
        <span>🔤</span>
        یک حرف
        <small id="letterCount">۰</small>
      </button>

      <button class="tool" onclick="useRemoveItem()">
        <span>🧹</span>
        حذف حروف
        <small id="removeCount">۰</small>
      </button>

      <button class="tool" onclick="useSolveItem()">
        <span>💡</span>
        جواب
        <small id="solveCount">۰</small>
      </button>

      <button class="tool" onclick="usePotion()">
        <span>🧪</span>
        معجون
        <small id="potionCount">۰</small>
      </button>
    </div>

    <div class="bottom">
      <button class="mainBtn secondary" onclick="clearSelection()">پاک کردن</button>
      <button class="mainBtn" onclick="normalHint()">✨ راهنمایی ۲۰🪙</button>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="levelModal">
  <div class="modalBox">
    <div class="modalIcon">🏆</div>
    <div class="modalTitle">مرحله کامل شد!</div>
    <div class="modalText">
      تمام کلمات این مرحله را پیدا کردی.
    </div>
    <div class="modalReward" id="modalReward">
      🪙 +۲۰ سکه &nbsp; ⭐ +۲۵ XP
    </div>
    <button onclick="nextLevel()">مرحله بعدی ➜</button>
  </div>
</div>

<script src="levels.js"></script>

<script>
"use strict";

/* =========================
   تنظیمات اصلی
========================= */

const params = new URLSearchParams(location.search);

let level = Number(params.get("level")) || Number(localStorage.getItem("kalemebaz_currentLevel")) || 1;

if(level < 1) level = 1;

let levelWords = [];
let solvedWords = [];
let revealed = {};
let selectedNodes = [];
let selectedLetters = [];
let isDragging = false;
let pointerX = 0;
let pointerY = 0;
let potionActive = false;
let wheelLetters = [];
let bonusWordsUsed = [];
let completedBefore = false;

const stateKey = `kalemebaz_levelState_${level}`;

const $ = id => document.getElementById(id);

/* =========================
   داده‌ها
========================= */

function getLevels(){
  if(window.KalameBazLevels) return window.KalameBazLevels;

  if(typeof levels !== "undefined") return levels;

  return {};
}

function loadLevel(){

  const allLevels = getLevels();

  let data = allLevels[level];

  if(!Array.isArray(data) || !data.length){

    data = [
      "کتاب",
      "مداد",
      "ماه",
      "درخت"
    ];
  }

  levelWords = [...new Set(
    data
      .map(x => String(x).trim())
      .filter(Boolean)
  )];

  const saved = JSON.parse(localStorage.getItem(stateKey) || "{}");

  solvedWords = Array.isArray(saved.solvedWords)
    ? saved.solvedWords.filter(w => levelWords.includes(w))
    : [];

  revealed = saved.revealed || {};

  bonusWordsUsed = Array.isArray(saved.bonusWordsUsed)
    ? saved.bonusWordsUsed
    : [];

  completedBefore = localStorage.getItem(`kalemebaz_completed_${level}`) === "1";
}

/* =========================
   ذخیره
========================= */

function saveState(){

  localStorage.setItem(stateKey,JSON.stringify({
    solvedWords,
    revealed,
    bonusWordsUsed
  }));

  localStorage.setItem(
    "kalemebaz_currentLevel",
    String(Math.max(
      Number(localStorage.getItem("kalemebaz_currentLevel")) || 1,
      level
    ))
  );
}

/* =========================
   اعداد فارسی
========================= */

function faNumber(n){
  return String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
}

/* =========================
   سکه و XP
========================= */

function getCoins(){
  return Number(localStorage.getItem("kalemebaz_coins")) || 0;
}

function setCoins(value){
  localStorage.setItem("kalemebaz_coins",String(Math.max(0,value)));
  updateStats();
}

function addCoins(value){
  setCoins(getCoins()+value);
}

function getXP(){
  return Number(localStorage.getItem("kalemebaz_xp")) || 0;
}

function addXP(value){
  localStorage.setItem("kalemebaz_xp",String(getXP()+value));
  updateStats();
}

function updateStats(){

  $("coins").textContent = faNumber(getCoins());
  $("xp").textContent = faNumber(getXP());

  $("letterCount").textContent =
    faNumber(Number(localStorage.getItem("kalemebaz_hintLetters")) || 0);

  $("removeCount").textContent =
    faNumber(Number(localStorage.getItem("kalemebaz_removeLetters")) || 0);

  $("solveCount").textContent =
    faNumber(Number(localStorage.getItem("kalemebaz_solveWords")) || 0);

  $("potionCount").textContent =
    faNumber(Number(localStorage.getItem("kalemebaz_magicPotions")) || 0);
}

/* =========================
   ستاره‌ها
========================= */

function createStars(){

  const box = $("stars");

  box.innerHTML = "";

  for(let i=0;i<85;i++){

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random()*100 + "%";
    star.style.top = Math.random()*100 + "%";

    const size = Math.random()*2+1;

    star.style.width = size+"px";
    star.style.height = size+"px";

    star.style.animationDelay =
      (Math.random()*2)+"s";

    box.appendChild(star);
  }
}

/* =========================
   تم
========================= */

function applySettings(){

  let settings;

  try{
    settings = JSON.parse(
      localStorage.getItem("kalemebaz_settings") || "{}"
    );
  }catch(e){
    settings = {};
  }

  const brightness =
    Number(settings.brightness) || 100;

  document.body.style.filter =
    `brightness(${brightness}%)`;

  if(settings.stars === false){
    $("stars").style.display = "none";
  }

  if(settings.theme === "blue"){
    document.documentElement.style.setProperty(
      "--main","#2563eb"
    );
    document.documentElement.style.setProperty(
      "--main2","#1d4ed8"
    );
  }

  if(settings.theme === "forest"){
    document.documentElement.style.setProperty(
      "--main","#16a34a"
    );
    document.documentElement.style.setProperty(
      "--main2","#15803d"
    );
  }
}

/* =========================
   عنوان مرحله
========================= */

function updateLevelTitle(){

  $("levelTitle").textContent =
    "مرحله " + faNumber(level);

  let region = "جنگل جادویی";

  if(level > 100 && level <= 250)
    region = "دره اسرار";

  if(level > 250 && level <= 400)
    region = "قلعه افسون‌شده";

  if(level > 400 && level <= 700)
    region = "سرزمین ستاره‌ها";

  if(level > 700 && level <= 1000)
    region = "قلمرو سایه‌ها";

  if(level > 1000)
    region = "قصر نهایی";

  $("levelSub").textContent =
    region + " • " + faNumber(levelWords.length) + " کلمه";
}

/* =========================
   نمایش کلمات
========================= */

function renderWords(){

  const box = $("words");

  box.innerHTML = "";

  levelWords.forEach(word => {

    const card = document.createElement("div");

    card.className =
      "wordCard" +
      (solvedWords.includes(word) ? " solved" : "");

    const letters = document.createElement("div");

    letters.className = "wordLetters";

    const chars = [...word];

    chars.forEach((char,index)=>{

      const slot = document.createElement("div");

      slot.className = "slot";

      if(solvedWords.includes(word)){

        slot.textContent = char;

      }else if(revealed[word] &&
               revealed[word][index]){

        slot.textContent = char;
        slot.classList.add("revealed");

      }else{

        slot.textContent = "";
      }

      letters.appendChild(slot);
    });

    card.appendChild(letters);

    if(solvedWords.includes(word)){

      const check = document.createElement("span");

      check.className = "cardCheck";
      check.textContent = "✓";

      card.appendChild(check);
    }

    box.appendChild(card);
  });

  const percent =
    (solvedWords.length / levelWords.length) * 100;

  $("progressFill").style.width =
    percent + "%";
}

/* =========================
   ساخت حروف چرخ
   مهم:
   حروف تکراری هم ساخته می‌شوند.
========================= */

function buildWheelLetters(){

  const countsNeeded = {};

  levelWords
    .filter(w => !solvedWords.includes(w))
    .forEach(word => {

      const count = {};

      [...word].forEach(ch=>{
        count[ch] = (count[ch] || 0) + 1;
      });

      Object.keys(count).forEach(ch=>{
        countsNeeded[ch] =
          Math.max(
            countsNeeded[ch] || 0,
            count[ch]
          );
      });
    });

  /*
    ابتدا بیشترین تعداد موردنیاز هر حرف را
    اضافه می‌کنیم تا کلماتی مثل:
    توت، بابا، مدرسه و...
    قابل ساخت باشند.
  */

  let letters = [];

  Object.keys(countsNeeded).forEach(ch=>{

    for(let i=0;i<countsNeeded[ch];i++){
      letters.push(ch);
    }
  });

  /*
    برای ظاهر بهتر اگر تعداد خیلی زیاد شد،
    از حروف پرتکرار استفاده می‌کنیم.
    حد مناسب موبایل: 16 خانه
  */

  if(letters.length > 16){

    const priority = {};

    levelWords
      .filter(w => !solvedWords.includes(w))
      .forEach(word=>{
        [...word].forEach(ch=>{
          priority[ch] = (priority[ch] || 0) + 1;
        });
      });

    const sortedChars =
      Object.keys(countsNeeded)
      .sort((a,b)=>
        (priority[b]||0)-(priority[a]||0)
      );

    letters = [];

    for(const ch of sortedChars){

      const needed = countsNeeded[ch];

      for(let i=0;i<needed;i++){

        if(letters.length < 16){
          letters.push(ch);
        }
      }

      if(letters.length >= 16) break;
    }

    /*
      اگر هنوز یک کلمه قابل ساخت نبود،
      مرحله با مجموعه حروف بیشتری ساخته می‌شود.
    */
  }

  wheelLetters = letters;

  return letters;
}

/* =========================
   ساخت چرخ
========================= */

function createLetterWheel(){

  const wheel = $("wheel");

  wheel.querySelectorAll(".letterBtn").forEach(
    e=>e.remove()
  );

  const letters = buildWheelLetters();

  const count = letters.length;

  const radius =
    count <= 8
      ? 36
      : count <= 12
        ? 40
        : 43;

  letters.forEach((char,index)=>{

    const btn = document.createElement("button");

    btn.className = "letterBtn";

    btn.textContent = char;

    btn.dataset.char = char;

    btn.dataset.index = index;

    const angle =
      (-90 + (360/count)*index)
      * Math.PI / 180;

    btn.style.left =
      (50 + Math.cos(angle)*radius) + "%";

    btn.style.top =
      (50 + Math.sin(angle)*radius) + "%";

    /*
      Pointer Events
    */

    btn.addEventListener("pointerdown",e=>{
      e.preventDefault();
      startDrag(btn,e);
    });

    wheel.appendChild(btn);
  });
}

/* =========================
   شروع کشیدن
========================= */

function startDrag(btn,e){

  if(btn.classList.contains("disabled"))
    return;

  isDragging = true;

  selectedNodes = [];
  selectedLetters = [];

  selectLetter(btn);

  updatePointer(e);

  document.body.setPointerCapture?.(e.pointerId);
}

/* =========================
   انتخاب حرف
========================= */

function selectLetter(btn){

  if(!btn || btn.classList.contains("disabled"))
    return;

  if(selectedNodes.includes(btn))
    return;

  selectedNodes.push(btn);
  selectedLetters.push(btn.dataset.char);

  btn.classList.add("selected");

  $("currentWord").textContent =
    selectedLetters.join("");

  drawConnection();
}

/* =========================
   تشخیص حرف زیر انگشت
========================= */

function detectLetterAt(x,y){

  const element =
    document.elementFromPoint(x,y);

  if(!element) return;

  const btn =
    element.closest?.(".letterBtn");

  if(btn){
    selectLetter(btn);
  }
}

/* =========================
   حرکت انگشت
========================= */

document.addEventListener("pointermove",e=>{

  if(!isDragging) return;

  e.preventDefault();

  updatePointer(e);

  detectLetterAt(
    e.clientX,
    e.clientY
  );

  drawConnection();

},{passive:false});

/* =========================
   پایان کشیدن
========================= */

document.addEventListener("pointerup",e=>{

  if(!isDragging) return;

  isDragging = false;

  updatePointer(e);

  submitSelection();
});

document.addEventListener("pointercancel",()=>{
  if(isDragging){
    isDragging = false;
    clearSelection();
  }
});

/* =========================
   مختصات اشاره‌گر
========================= */

function updatePointer(e){

  const rect =
    $("gameArea").getBoundingClientRect();

  pointerX =
    e.clientX - rect.left;

  pointerY =
    e.clientY - rect.top;
}

/* =========================
   خط اتصال
========================= */

function drawConnection(){

  const canvas = $("connectionCanvas");

  const rect =
    $("gameArea").getBoundingClientRect();

  const dpr =
    Math.min(window.devicePixelRatio || 1,2);

  canvas.width =
    rect.width*dpr;

  canvas.height =
    rect.height*dpr;

  canvas.style.width =
    rect.width+"px";

  canvas.style.height =
    rect.height+"px";

  const ctx =
    canvas.getContext("2d");

  ctx.setTransform(dpr,0,0,dpr,0,0);

  ctx.clearRect(
    0,0,
    rect.width,
    rect.height
  );

  if(selectedNodes.length === 0)
    return;

  const points =
    selectedNodes.map(btn=>{

      const r =
        btn.getBoundingClientRect();

      return {
        x:r.left+r.width/2-rect.left,
        y:r.top+r.height/2-rect.top
      };
    });

  ctx.beginPath();

  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.shadowBlur = 18;
  ctx.shadowColor = "#a855f7";
  ctx.strokeStyle = "#c084fc";

  ctx.moveTo(
    points[0].x,
    points[0].y
  );

  for(let i=1;i<points.length;i++){

    ctx.lineTo(
      points[i].x,
      points[i].y
    );
  }

  if(isDragging){

    ctx.lineTo(
      pointerX,
      pointerY
    );
  }

  ctx.stroke();

  /*
    نقطه‌های اتصال
  */

  points.forEach(p=>{

    ctx.beginPath();

    ctx.fillStyle = "#ffffff";
    ctx.shadowBlur = 12;
    ctx.shadowColor = "#a855f7";

    ctx.arc(
      p.x,
      p.y,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();
  });
}

/* =========================
   پاک کردن انتخاب
========================= */

function clearSelection(){

  selectedNodes.forEach(
    btn=>btn.classList.remove("selected")
  );

  selectedNodes = [];
  selectedLetters = [];

  $("currentWord").textContent =
    "حروف را بکش...";

  const canvas = $("connectionCanvas");

  const ctx = canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
}

/* =========================
   بررسی کلمه
========================= */

function submitSelection(){

  const word =
    selectedLetters.join("");

  if(!word){
    clearSelection();
    return;
  }

  if(levelWords.includes(word)){

    if(solvedWords.includes(word)){

      showToast(
        "این کلمه قبلاً پیدا شده!",
        "bad"
      );

      clearSelection();
      return;
    }

    solveWord(word);

  }else{

    checkBonusWord(word);
  }

  clearSelection();
}

/* =========================
   حل کلمه
========================= */

function solveWord(word){

  solvedWords.push(word);

  saveState();

  let reward =
    Math.max(
      4,
      Math.min(
        14,
        word.length * 2
      )
    );

  let xp =
    Math.max(
      5,
      word.length * 2
    );

  if(potionActive){

    reward *= 2;
    xp *= 2;

    potionActive = false;

    showToast(
      `🧪 معجون فعال بود! +${faNumber(reward)} سکه`,
      "good"
    );

  }else{

    showToast(
      `✨ کلمه درست! +${faNumber(reward)} سکه`,
      "good"
    );
  }

  addCoins(reward);
  addXP(xp);

  renderWords();

  flashCorrect();
  createConfetti(10);

  setTimeout(()=>{

    if(solvedWords.length >= levelWords.length){

      completeLevel();

    }else{

      createLetterWheel();
    }

  },450);
}

/* =========================
   کلمات اضافه
========================= */

function getAllKnownWords(){

  const all = getLevels();

  const set = new Set();

  Object.values(all).forEach(arr=>{

    if(Array.isArray(arr)){

      arr.forEach(word=>{
        if(word) set.add(String(word));
      });
    }
  });

  return set;
}

function checkBonusWord(word){

  if(word.length < 2){
    wrongEffect();
    return;
  }

  const known =
    getAllKnownWords();

  if(
    known.has(word) &&
    !bonusWordsUsed.includes(word)
  ){

    bonusWordsUsed.push(word);

    saveState();

    addCoins(2);
    addXP(3);

    showToast(
      "🌟 کلمه اضافه! +۲ سکه",
      "good"
    );

    createConfetti(5);

    return;
  }

  wrongEffect();
}

/* =========================
   افکت اشتباه
========================= */

function wrongEffect(){

  $("currentBox").classList.remove("shake");

  void $("currentBox").offsetWidth;

  $("currentBox").classList.add("shake");

  showToast(
    "❌ این کلمه در این مرحله نیست",
    "bad"
  );
}

/* =========================
   افکت درست
========================= */

function flashCorrect(){

  $("currentBox").classList.remove(
    "correctFlash"
  );

  void $("currentBox").offsetWidth;

  $("currentBox").classList.add(
    "correctFlash"
  );
}

/* =========================
   Toast
========================= */

let toastTimer;

function showToast(text,type=""){

  const toast = $("toast");

  toast.textContent = text;

  toast.className =
    "toast show " + type;

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      toast.className = "toast";
    },1800);
}

/* =========================
   راهنمایی معمولی
========================= */

function normalHint(){

  const cost = 20;

  if(getCoins() < cost){

    showToast(
      "🪙 سکه کافی نداری!",
      "bad"
    );

    return;
  }

  const target =
    levelWords.find(
      w=>!solvedWords.includes(w)
    );

  if(!target) return;

  const current =
    revealed[target] || {};

  let indexes =
    [...target]
    .map((_,i)=>i)
    .filter(i=>!current[i]);

  if(!indexes.length){

    showToast(
      "همه حروف این کلمه نمایان شده‌اند.",
      "bad"
    );

    return;
  }

  const index =
    indexes[Math.floor(
      Math.random()*indexes.length
    )];

  if(!revealed[target])
    revealed[target] = {};

  revealed[target][index] = true;

  setCoins(getCoins()-cost);

  saveState();
  renderWords();

  showToast(
    "✨ یک حرف آشکار شد!",
    "good"
  );
}

/* =========================
   آیتم یک حرف
========================= */

function useLetterItem(){

  const key =
    "kalemebaz_hintLetters";

  const count =
    Number(localStorage.getItem(key)) || 0;

  if(count <= 0){

    showToast(
      "🔤 این آیتم را نداری!",
      "bad"
    );

    return;
  }

  const target =
    levelWords.find(
      w=>!solvedWords.includes(w)
    );

  if(!target) return;

  const current =
    revealed[target] || {};

  const indexes =
    [...target]
    .map((_,i)=>i)
    .filter(i=>!current[i]);

  if(!indexes.length){

    showToast(
      "این کلمه قبلاً کامل راهنمایی شده.",
      "bad"
    );

    return;
  }

  const index =
    indexes[Math.floor(
      Math.random()*indexes.length
    )];

  if(!revealed[target])
    revealed[target] = {};

  revealed[target][index] = true;

  localStorage.setItem(
    key,
    String(count-1)
  );

  saveState();
  renderWords();
  updateStats();

  showToast(
    "🔤 یک حرف آشکار شد!",
    "good"
  );
}

/* =========================
   حذف حروف
========================= */

function useRemoveItem(){

  const key =
    "kalemebaz_removeLetters";

  const count =
    Number(localStorage.getItem(key)) || 0;

  if(count <= 0){

    showToast(
      "🧹 این آیتم را نداری!",
      "bad"
    );

    return;
  }

  const useful =
    new Set();

  levelWords
    .filter(w=>!solvedWords.includes(w))
    .forEach(word=>{
      [...word].forEach(ch=>{
        useful.add(ch);
      });
    });

  let removed = 0;

  document
    .querySelectorAll(".letterBtn")
    .forEach(btn=>{

      if(
        !useful.has(btn.dataset.char) &&
        removed < 3
      ){

        btn.classList.add("disabled");

        removed++;
      }
    });

  if(removed === 0){

    showToast(
      "همه حروف فعلی کاربرد دارند.",
      "bad"
    );

    return;
  }

  localStorage.setItem(
    key,
    String(count-1)
  );

  updateStats();

  showToast(
    `🧹 ${faNumber(removed)} حرف حذف شد`,
    "good"
  );
}

/* =========================
   جواب جادویی
========================= */

function useSolveItem(){

  const key =
    "kalemebaz_solveWords";

  const count =
    Number(localStorage.getItem(key)) || 0;

  if(count <= 0){

    showToast(
      "💡 این آیتم را نداری!",
      "bad"
    );

    return;
  }

  const target =
    levelWords.find(
      w=>!solvedWords.includes(w)
    );

  if(!target) return;

  localStorage.setItem(
    key,
    String(count-1)
  );

  updateStats();

  solveWord(target);
}

/* =========================
   معجون
========================= */

function usePotion(){

  const key =
    "kalemebaz_magicPotions";

  const count =
    Number(localStorage.getItem(key)) || 0;

  if(count <= 0){

    showToast(
      "🧪 معجون نداری!",
      "bad"
    );

    return;
  }

  if(potionActive){

    showToast(
      "🧪 معجون از قبل فعال است!",
      "bad"
    );

    return;
  }

  localStorage.setItem(
    key,
    String(count-1)
  );

  potionActive = true;

  updateStats();

  showToast(
    "🧪 معجون فعال شد! پاداش کلمه بعدی دو برابر است.",
    "good"
  );
}

/* =========================
   تکمیل مرحله
========================= */

function completeLevel(){

  if(completedBefore)
    return;

  completedBefore = true;

  localStorage.setItem(
    `kalemebaz_completed_${level}`,
    "1"
  );

  let completed =
    Number(
      localStorage.getItem(
        "kalemebaz_completedLevels"
      )
    ) || 0;

  localStorage.setItem(
    "kalemebaz_completedLevels",
    String(completed+1)
  );

  addCoins(20);
  addXP(25);

  const current =
    Number(
      localStorage.getItem(
        "kalemebaz_currentLevel"
      )
    ) || 1;

  if(level >= current){

    localStorage.setItem(
      "kalemebaz_currentLevel",
      String(level+1)
    );
  }

  $("modalReward").textContent =
    "🪙 +۲۰ سکه   ⭐ +۲۵ XP";

  $("levelModal").classList.add("show");

  createConfetti(35);
}

/* =========================
   مرحله بعد
========================= */

function nextLevel(){

  const next = level+1;

  $("levelModal").classList.remove("show");

  location.href =
    "game.html?level=" + next;
}

/* =========================
   ناوبری
========================= */

function goHome(){
  location.href = "index.html";
}

function goShop(){
  location.href = "shop.html";
}

/* =========================
   کنفتی
========================= */

function createConfetti(amount){

  for(let i=0;i<amount;i++){

    const piece =
      document.createElement("div");

    piece.className = "confetti";

    piece.style.left =
      (window.innerWidth/2) + "px";

    piece.style.top =
      (window.innerHeight*.38) + "px";

    piece.style.setProperty(
      "--x",
      ((Math.random()-.5)*280)+"px"
    );

    piece.style.setProperty(
      "--y",
      (Math.random()*500+100)+"px"
    );

    piece.style.background =
      [
        "#a855f7",
        "#22d3ee",
        "#facc15",
        "#4ade80",
        "#fb7185"
      ][
        Math.floor(Math.random()*5)
      ];

    document.body.appendChild(piece);

    setTimeout(()=>{
      piece.remove();
    },1000);
  }
}

========================= */

  renderWords();

  setTimeout(()=>{
    $("loading").style.display = "none";

}

startGame();

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>کلمه‌باز | بازی</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Tahoma,Arial,sans-serif;
  color:#fff;
  background:#08031a;
}

body{
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%,rgba(132,76,255,.35),transparent 35%),
    radial-gradient(circle at 20% 80%,rgba(0,170,255,.13),transparent 30%),
    linear-gradient(180deg,#12052f,#070219 65%,#020107);
}

body.theme-blue{
  background:
    radial-gradient(circle at 50% 0%,rgba(30,130,255,.35),transparent 35%),
    linear-gradient(180deg,#03152c,#020812);
}

body.theme-forest{
  background:
    radial-gradient(circle at 50% 0%,rgba(20,190,110,.3),transparent 35%),
    linear-gradient(180deg,#031d18,#020907);
}

#stars{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:white;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.2}
  to{opacity:1}
}

.moon{
  position:fixed;
  left:20px;
  top:55px;
  width:75px;
  height:75px;
  border-radius:50%;
  background:#eee5ff;
  box-shadow:0 0 35px rgba(200,170,255,.7);
  z-index:0;
}

.moon:after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#12052f;
  left:18px;
  top:-7px;
}

body.theme-blue .moon:after{
  background:#03152c;
}

body.theme-forest .moon:after{
  background:#031d18;
}

.container{
  position:relative;
  z-index:2;
  width:min(100%,620px);
  height:100vh;
  margin:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
}

.topbar{
  display:flex;
  align-items:center;
  gap:8px;
}

.top-btn{
  width:43px;
  height:43px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);
  color:white;
  font-size:20px;
}

.title{
  flex:1;
  text-align:center;
}

.title h1{
  margin:0;
  font-size:21px;
  text-shadow:0 0 15px #a777ff;
}

.title p{
  margin:3px 0 0;
  font-size:10px;
  color:#afa2cc;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:8px;
}

.stat{
  padding:8px;
  text-align:center;
  border-radius:15px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
}

.stat strong{
  display:block;
  font-size:13px;
  margin-top:3px;
}

.level-info{
  margin-top:8px;
  padding:11px 14px;
  border-radius:18px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
}

.level-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.level{
  font-size:20px;
  font-weight:bold;
}

.realm{
  color:#bfaef0;
  font-size:10px;
}

.progress{
  margin-top:8px;
  height:7px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0;
  border-radius:20px;
  background:linear-gradient(90deg,#8250ff,#dc9dff);
  transition:.35s;
}

.words-panel{
  margin-top:8px;
  padding:10px;
  border-radius:20px;
  background:rgba(4,2,18,.62);
  border:1px solid rgba(255,255,255,.1);
  flex-shrink:0;
}

.panel-title{
  text-align:center;
  font-size:11px;
  color:#bcaed7;
  margin-bottom:7px;
}

.words{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  max-height:105px;
  overflow:auto;
}

.word{
  min-width:75px;
  padding:6px 9px;
  border-radius:10px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  text-align:center;
  font-size:13px;
  letter-spacing:2px;
}

.word.solved{
  color:#8fffd0;
  border-color:rgba(70,255,170,.35);
  background:rgba(30,180,110,.14);
  letter-spacing:0;
}

.game-area{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.current-word{
  min-height:55px;
  width:90%;
  border-radius:18px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(180,140,255,.2);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:8px;
  font-size:23px;
  font-weight:bold;
  letter-spacing:4px;
  box-shadow:0 0 30px rgba(100,50,200,.12);
}

.current-word.empty{
  font-size:12px;
  letter-spacing:0;
  color:#8f849f;
}

#connectionCanvas{
  position:fixed;
  inset:0;
  z-index:8;
  pointer-events:none;
}

.letters-area{
  position:relative;
  width:min(92vw,360px);
  height:min(92vw,360px);
  max-height:360px;
  max-width:360px;
  margin-top:12px;
}

.circle{
  position:absolute;
  inset:7%;
  border-radius:50%;
  border:1px solid rgba(190,150,255,.13);
  box-shadow:
    inset 0 0 40px rgba(130,70,255,.08),
    0 0 35px rgba(130,70,255,.07);
}

.letter-btn{
  position:absolute;
  width:61px;
  height:61px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  border:2px solid rgba(220,190,255,.25);
  background:
    radial-gradient(circle at 35% 25%,
    rgba(255,255,255,.22),
    rgba(89,45,160,.75));
  color:#fff;
  font-size:24px;
  font-weight:bold;
  box-shadow:
    0 7px 20px rgba(0,0,0,.4),
    0 0 18px rgba(130,80,255,.25);
  transition:.12s;
  z-index:10;
}

.letter-btn.selected{
  transform:translate(-50%,-50%) scale(1.15);
  background:
    radial-gradient(circle,
    #dcaaff,
    #7646dc);
  border-color:#f0d8ff;
  box-shadow:
    0 0 25px rgba(205,145,255,.8);
}

.letter-btn.disabled{
  opacity:.25;
}

.drag-hint{
  text-align:center;
  font-size:10px;
  color:#8e83a4;
  margin-top:4px;
}

.tools{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:7px;
}

.tool{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.06);
  color:#fff;
  border-radius:13px;
  padding:7px 3px;
  font-size:10px;
}

.tool span{
  display:block;
  font-size:18px;
  margin-bottom:2px;
}

.tool small{
  color:#a99fba;
}

.bottom-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:7px;
}

.action{
  border:0;
  border-radius:15px;
  padding:12px;
  color:white;
  font-weight:bold;
}

.clear{
  background:rgba(255,255,255,.08);
}

.hint{
  background:linear-gradient(135deg,#7850e8,#b568ff);
}

.next{
  display:none;
  width:100%;
  margin-top:7px;
  padding:12px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#16a876,#61e4b1);
  color:#03150d;
  font-weight:bold;
}

.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translate(-50%,120px);
  background:rgba(18,8,40,.96);
  border:1px solid rgba(210,170,255,.25);
  padding:11px 17px;
  border-radius:14px;
  z-index:50;
  font-size:11px;
  transition:.3s;
  white-space:nowrap;
}

.toast.show{
  transform:translate(-50%,0);
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.75);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(100%,400px);
  padding:24px;
  border-radius:25px;
  text-align:center;
  background:linear-gradient(145deg,#1b0c43,#080218);
  border:1px solid rgba(210,170,255,.25);
}

.modal-icon{
  font-size:52px;
}

.modal-box h2{
  margin:8px 0;
}

.modal-box p{
  color:#c0b5d2;
  font-size:12px;
  line-height:1.9;
}

.modal-btn{
  width:100%;
  padding:13px;
  margin-top:7px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#7d4fff,#b66cff);
  color:white;
  font-weight:bold;
}

@media(max-height:650px){

  .letters-area{
    width:270px;
    height:270px;
  }

  .letter-btn{
    width:50px;
    height:50px;
    font-size:20px;
  }

  .current-word{
    min-height:43px;
    font-size:19px;
  }

  .words-panel{
    padding:7px;
  }

  .words{
    max-height:65px;
  }
}
</style>
</head>

<body>

<div id="stars"></div>
<div class="moon"></div>

<canvas id="connectionCanvas"></canvas>

<div class="container">

  <div class="topbar">

    <button class="top-btn"
            onclick="goHome()">⌂</button>

    <div class="title">
      <h1>✨ کلمه‌باز</h1>
      <p>سرزمین جادویی واژه‌ها</p>
    </div>

    <button class="top-btn"
            onclick="location.href='shop.html'">
      🛒
    </button>

  </div>

  <div class="stats">

    <div class="stat">
      🪙
      <strong id="coins">0</strong>
    </div>

    <div class="stat">
      ⭐
      <strong id="xp">0 XP</strong>
    </div>

    <div class="stat">
      🔮
      <strong id="solvedCount">0</strong>
    </div>

  </div>

  <div class="level-info">

    <div class="level-row">

      <div>
        <div class="level">
          مرحله <span id="levelNumber">1</span>
        </div>

        <div class="realm" id="realm">
          جنگل جادویی
        </div>
      </div>

      <div id="progressText">
        0 / 4
      </div>

    </div>

    <div class="progress">
      <div class="progress-fill"
           id="progressFill"></div>
    </div>

  </div>

  <div class="words-panel">

    <div class="panel-title">
      🔮 کلمات پیدا شده
    </div>

    <div class="words"
         id="words">
    </div>

  </div>

  <div class="game-area">

    <div class="current-word empty"
         id="currentWord">
      انگشتت را روی حروف بکش
    </div>

    <div class="letters-area"
         id="lettersArea">

      <div class="circle"></div>

    </div>

    <div class="drag-hint">
      ✨ حروف را با کشیدن انگشت به هم وصل کن
    </div>

  </div>

  <div class="tools">

    <button class="tool"
            onclick="useLetterItem()">
      <span>🔤</span>
      حرف
      <small id="hintCount">×0</small>
    </button>

    <button class="tool"
            onclick="useRemoveItem()">
      <span>🧹</span>
      پاک‌کن
      <small id="removeCount">×0</small>
    </button>

    <button class="tool"
            onclick="useSolveItem()">
      <span>💡</span>
      جواب
      <small id="solveCount">×0</small>
    </button>

    <button class="tool"
            onclick="usePotion()">
      <span>🧪</span>
      معجون
      <small id="potionCount">×0</small>
    </button>

  </div>

  <div class="bottom-actions">

    <button class="action clear"
            onclick="clearSelection()">
      پاک کردن
    </button>

    <button class="action hint"
            onclick="normalHint()">
      🔮 راهنمایی
    </button>

  </div>

  <button class="next"
          id="nextButton"
          onclick="nextLevel()">
    مرحله بعدی ✨
  </button>

</div>


<div class="modal"
     id="completeModal">

  <div class="modal-box">

    <div class="modal-icon">🏆</div>

    <h2>مرحله کامل شد!</h2>

    <p id="completeText"></p>

    <button class="modal-btn"
            onclick="nextLevel()">
      مرحله بعدی ✨
    </button>

    <button class="modal-btn"
            onclick="goHome()"
            style="background:rgba(255,255,255,.08)">
      برگشت به نقشه
    </button>

  </div>

</div>

<div class="toast"
     id="toast"></div>


<script src="levels.js"></script>

<script>
/* ==================================
   BASIC DATA
================================== */

const params =
  new URLSearchParams(location.search);

let level =
  parseInt(params.get("level")) || 1;

if(level < 1) level = 1;
if(level > 500) level = 500;

const realms = [
  "جنگل جادویی",
  "دره ستاره‌ها",
  "قلعه افسون‌شده",
  "سرزمین اژدها",
  "دریاچه ماه",
  "برج جادوگران",
  "قصر بلورین",
  "دروازه اسرار"
];

let levelWords = [];

let selectedLetters = [];
let selectedButtons = [];

let solvedWords = [];

let revealed = {};

let disabledLetters = {};

let potionBoost = false;

let completed = false;


/* ==================================
   CANVAS
================================== */

const canvas =
  document.getElementById("connectionCanvas");

const ctx =
  canvas.getContext("2d");

function resizeCanvas(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

  drawLines();
}

window.addEventListener(
  "resize",
  resizeCanvas
);


/* ==================================
   STORAGE
================================== */

function num(key, fallback=0){

  const n =
    parseInt(localStorage.getItem(key));

  return Number.isFinite(n)
    ? n
    : fallback;
}

function setNum(key,value){

  localStorage.setItem(
    key,
    String(value)
  );
}

function inventory(key){

  return num(key,0);
}

function setInventory(key,value){

  setNum(
    key,
    Math.max(0,value)
  );
}

function stateKey(){

  return "kalemebaz_levelState_" + level;
}

function loadState(){

  try{

    const state =
      JSON.parse(
        localStorage.getItem(stateKey()) || "{}"
      );

    solvedWords =
      Array.isArray(state.solvedWords)
        ? state.solvedWords
        : [];

    revealed =
      state.revealed || {};

  }catch(e){

    solvedWords = [];
    revealed = {};

  }

  selectedLetters = [];
  selectedButtons = [];
  disabledLetters = {};
  potionBoost = false;

  completed =
    solvedWords.length >= levelWords.length;
}

function saveState(){

  localStorage.setItem(
    stateKey(),
    JSON.stringify({
      solvedWords,
      revealed
    })
  );
}


/* ==================================
   STARS
================================== */

function createStars(){

  const box =
    document.getElementById("stars");

  for(let i=0;i<80;i++){

    const star =
      document.createElement("div");

    star.className = "star";

    star.style.left =
      Math.random()*100 + "%";

    star.style.top =
      Math.random()*100 + "%";

    star.style.animationDelay =
      Math.random()*3 + "s";

    box.appendChild(star);
  }
}


/* ==================================
   SETTINGS
================================== */

function applySettings(){

  try{

    const settings =
      JSON.parse(
        localStorage.getItem(
          "kalemebaz_settings"
        ) || "{}"
      );

    const brightness =
      Number(settings.brightness || 100);

    document.body.style.filter =
      "brightness(" +
      (brightness/100) +
      ")";

    if(settings.theme === "blue"){
      document.body.classList.add(
        "theme-blue"
      );
    }

    if(settings.theme === "forest"){
      document.body.classList.add(
        "theme-forest"
      );
    }

    if(settings.stars === false){
      document.getElementById(
        "stars"
      ).style.display = "none";
    }

    if(settings.animations === false){

      const style =
        document.createElement("style");

      style.textContent =
        "*{animation:none!important;transition:none!important}";

      document.head.appendChild(style);
    }

  }catch(e){}
}


/* ==================================
   LOAD LEVEL
================================== */

function loadLevel(){

  if(!window.KalameBazLevels){

    showToast(
      "❌ levels.js پیدا نشد"
    );

    return;
  }

  levelWords =
    window.KalameBazLevels[level] || [];

  levelWords =
    levelWords
      .map(w=>String(w).trim())
      .filter(Boolean);

  if(!levelWords.length){

    showToast(
      "❌ اطلاعات مرحله پیدا نشد"
    );

    return;
  }

  loadState();

  document.getElementById(
    "levelNumber"
  ).textContent = level;

  document.getElementById(
    "realm"
  ).textContent =
    realms[(level-1)%realms.length];

  renderWords();

  createLetterWheel();

  updateStats();

  updateInventory();

  resizeCanvas();

  if(completed){

    document.getElementById(
      "nextButton"
    ).style.display =
      level < 500 ? "block" : "none";
  }
}


/* ==================================
   WORDS
================================== */

function renderWords(){

  const box =
    document.getElementById("words");

  box.innerHTML = "";

  levelWords.forEach((word,index)=>{

    const div =
      document.createElement("div");

    div.className =
      "word";

    if(solvedWords.includes(index)){

      div.classList.add("solved");

      div.textContent =
        "✓ " + word;

    }else{

      div.textContent =
        "• ".repeat(word.length)
          .trim();

    }

    box.appendChild(div);

  });

  document.getElementById(
    "progressText"
  ).textContent =
    solvedWords.length +
    " / " +
    levelWords.length;

  const percent =
    (solvedWords.length /
      levelWords.length) * 100;

  document.getElementById(
    "progressFill"
  ).style.width =
    percent + "%";
}


/* ==================================
   CREATE LETTERS FROM LEVEL WORDS
================================== */

function createLetterWheel(){

  const area =
    document.getElementById(
      "lettersArea"
    );

  area.querySelectorAll(
    ".letter-btn"
  ).forEach(x=>x.remove());

  /*
    حروف تمام کلمات همین مرحله
    جمع می‌شوند.
  */

  let chars = [];

  levelWords.forEach(word=>{

    [...word].forEach(char=>{

      if(
        char !== " " &&
        !chars.includes(char)
      ){

        chars.push(char);
      }

    });

  });

  /*
    برای اینکه چرخ خیلی بزرگ نشود،
    حداکثر 12 حرف نمایش می‌دهیم.
    اگر کمتر باشد همه نمایش داده می‌شوند.
  */

  chars = chars.slice(0,12);

  const center = 50;
  const radius = 41;

  chars.forEach((char,index)=>{

    const angle =
      (-90 + (360/chars.length)*index)
      * Math.PI / 180;

    const x =
      center + Math.cos(angle)*radius;

    const y =
      center + Math.sin(angle)*radius;

    const button =
      document.createElement("button");

    button.className =
      "letter-btn";

    button.textContent =
      char;

    button.dataset.letter =
      char;

    button.style.left =
      x + "%";

    button.style.top =
      y + "%";

    /*
      Touch events
    */

    button.addEventListener(
      "pointerdown",
      startDrag
    );

    button.addEventListener(
      "pointerenter",
      moveDrag
    );

    button.addEventListener(
      "pointerup",
      endDrag
    );

    button.addEventListener(
      "pointercancel",
      endDrag
    );

    area.appendChild(button);

  });

}


/* ==================================
   DRAG SYSTEM
================================== */

let dragging = false;

function startDrag(e){

  if(
    e.pointerType === "mouse" &&
    e.button !== 0
  ) return;

  const button =
    e.currentTarget;

  if(
    button.classList.contains("disabled")
  ) return;

  dragging = true;

  selectedLetters = [];
  selectedButtons = [];

  clearCanvas();

  addSelected(button);

  try{
    button.setPointerCapture(
      e.pointerId
    );
  }catch(err){}

  e.preventDefault();
}

function moveDrag(e){

  if(!dragging) return;

  const button =
    e.currentTarget;

  if(
    button.classList.contains("disabled")
  ) return;

  addSelected(button);

  e.preventDefault();
}

function endDrag(){

  if(!dragging) return;

  dragging = false;

  checkSelectedWord();
}


/* ==================================
   ADD LETTER
================================== */

function addSelected(button){

  if(
    selectedButtons.includes(button)
  ){

    return;
  }

  selectedButtons.push(button);

  selectedLetters.push(
    button.dataset.letter
  );

  button.classList.add("selected");

  updateCurrentWord();

  drawLines();
}


/* ==================================
   DRAW CONNECTION
================================== */

function getCenter(element){

  const rect =
    element.getBoundingClientRect();

  return {
    x:rect.left + rect.width/2,
    y:rect.top + rect.height/2
  };
}

function drawLines(){

  clearCanvas();

  if(
    selectedButtons.length < 2
  ) return;

  ctx.lineWidth = 7;

  ctx.lineCap = "round";

  ctx.lineJoin = "round";

  ctx.strokeStyle =
    "rgba(205,155,255,.85)";

  ctx.shadowBlur = 15;

  ctx.shadowColor =
    "rgba(170,90,255,.8)";

  ctx.beginPath();

  selectedButtons.forEach(
    (button,index)=>{

      const p =
        getCenter(button);

      if(index === 0){

        ctx.moveTo(
          p.x,
          p.y
        );

      }else{

        ctx.lineTo(
          p.x,
          p.y
        );
      }

    }
  );

  ctx.stroke();

  ctx.shadowBlur = 0;
}

function clearCanvas(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
}


/* ==================================
   CURRENT WORD
================================== */

function updateCurrentWord(){

  const box =
    document.getElementById(
      "currentWord"
    );

  if(!selectedLetters.length){

    box.textContent =
      "انگشتت را روی حروف بکش";

    box.classList.add("empty");

    return;
  }

  box.classList.remove("empty");

  box.textContent =
    selectedLetters.join("");
}


/* ==================================
   CHECK WORD
================================== */

function checkSelectedWord(){

  const guess =
    selectedLetters.join("");

  const index =
    levelWords.indexOf(guess);

  if(!guess){

    resetSelection();
    return;
  }

  if(index === -1){

    showToast(
      "❌ این کلمه در مرحله نیست"
    );

    resetSelection();

    return;
  }

  if(solvedWords.includes(index)){

    showToast(
      "این کلمه قبلاً پیدا شده!"
    );

    resetSelection();

    return;
  }

  solveWord(index);

  resetSelection();
}


/* ==================================
   SOLVE WORD
================================== */

function solveWord(index){

  solvedWords.push(index);

  saveState();

  let reward = 5;

  if(potionBoost){

    reward += 10;

    potionBoost = false;

    showToast(
      "🧪 معجون فعال بود! +" +
      reward +
      " سکه"
    );

  }else{

    showToast(
      "✨ درست بود! +" +
      reward +
      " سکه"
    );
  }

  setNum(
    "kalemebaz_coins",
    num("kalemebaz_coins") + reward
  );

  setNum(
    "kalemebaz_xp",
    num("kalemebaz_xp") + 10
  );

  renderWords();

  updateStats();

  if(
    solvedWords.length >=
    levelWords.length
  ){

    completeLevel();
  }
}


/* ==================================
   RESET SELECTION
================================== */

function resetSelection(){

  selectedButtons.forEach(
    button=>{
      button.classList.remove(
        "selected"
      );
    }
  );

  selectedLetters = [];
  selectedButtons = [];

  clearCanvas();

  updateCurrentWord();
}

function clearSelection(){

  resetSelection();
}


/* ==================================
   NORMAL HINT
================================== */

function normalHint(){

  const coins =
    num("kalemebaz_coins");

  if(coins < 20){

    showToast(
      "🪙 برای راهنمایی ۲۰ سکه لازم داری."
    );

    return;
  }

  let target = -1;

  for(let i=0;i<levelWords.length;i++){

    if(!solvedWords.includes(i)){

      target = i;
      break;
    }
  }

  if(target === -1){

    showToast(
      "همه کلمات پیدا شده‌اند!"
    );

    return;
  }

  const word =
    levelWords[target];

  if(!revealed[target]){
    revealed[target] = {};
  }

  let pos = -1;

  for(let i=0;i<word.length;i++){

    if(!revealed[target][i]){

      pos = i;
      break;
    }
  }

  if(pos === -1){

    showToast(
      "این کلمه قبلاً کامل راهنمایی شده."
    );

    return;
  }

  revealed[target][pos] = true;

  setNum(
    "kalemebaz_coins",
    coins - 20
  );

  saveState();

  renderWords();

  updateStats();

  showToast(
    "🔮 یک حرف از واژه " +
    (target+1) +
    " نمایش داده شد."
  );
}


/* ==================================
   LETTER ITEM
================================== */

function useLetterItem(){

  const count =
    inventory(
      "kalemebaz_hintLetters"
    );

  if(count <= 0){

    showToast(
      "🔤 طلسم حرف نداری. از فروشگاه بخر."
    );

    return;
  }

  let target = -1;

  for(let i=0;i<levelWords.length;i++){

    if(!solvedWords.includes(i)){

      target = i;
      break;
    }
  }

  if(target === -1) return;

  const word =
    levelWords[target];

  if(!revealed[target]){
    revealed[target] = {};
  }

  let pos = -1;

  for(let i=0;i<word.length;i++){

    if(!revealed[target][i]){

      pos = i;
      break;
    }
  }

  if(pos === -1){

    showToast(
      "حروف این کلمه قبلاً نمایش داده شده."
    );

    return;
  }

  revealed[target][pos] = true;

  setInventory(
    "kalemebaz_hintLetters",
    count - 1
  );

  saveState();

  renderWords();

  updateInventory();

  showToast(
    "🔤 حرف راهنما نمایش داده شد!"
  );
}


/* ==================================
   REMOVE ITEM
================================== */

function useRemoveItem(){

  const count =
    inventory(
      "kalemebaz_removeLetters"
    );

  if(count <= 0){

    showToast(
      "🧹 پاک‌کن جادویی نداری."
    );

    return;
  }

  const possible =
    new Set();

  levelWords.forEach(
    (word,index)=>{

      if(
        !solvedWords.includes(index)
      ){

        [...word].forEach(
          char=>possible.add(char)
        );
      }

    }
  );

  let removed = 0;

  document
    .querySelectorAll(".letter-btn")
    .forEach(button=>{

      const char =
        button.dataset.letter;

      if(!possible.has(char)){

        button.classList.add(
          "disabled"
        );

        disabledLetters[char] = true;

        removed++;
      }

    });

  if(!removed){

    showToast(
      "🧹 فعلاً حرف اضافی وجود ندارد."
    );

    return;
  }

  setInventory(
    "kalemebaz_removeLetters",
    count - 1
  );

  updateInventory();

  showToast(
    "🧹 حروف اضافی حذف شدند!"
  );
}


/* ==================================
   SOLVE ITEM
================================== */

function useSolveItem(){

  const count =
    inventory(
      "kalemebaz_solveWords"
    );

  if(count <= 0){

    showToast(
      "💡 جواب جادویی نداری."
    );

    return;
  }

  let target = -1;

  for(let i=0;i<levelWords.length;i++){

    if(!solvedWords.includes(i)){

      target = i;
      break;
    }
  }

  if(target === -1) return;

  setInventory(
    "kalemebaz_solveWords",
    count - 1
  );

  setNum(
    "kalemebaz_coins",
    num("kalemebaz_coins") + 2
  );

  setNum(
    "kalemebaz_xp",
    num("kalemebaz_xp") + 5
  );

  solveWord(target);

  updateInventory();

  showToast(
    "💡 یک کلمه جادویی پیدا شد!"
  );
}


/* ==================================
   POTION
================================== */

function usePotion(){

  const count =
    inventory(
      "kalemebaz_magicPotions"
    );

  if(count <= 0){

    showToast(
      "🧪 معجون جادویی نداری."
    );

    return;
  }

  if(potionBoost){

    showToast(
      "🧪 معجون از قبل فعال است."
    );

    return;
  }

  setInventory(
    "kalemebaz_magicPotions",
    count - 1
  );

  potionBoost = true;

  updateInventory();

  showToast(
    "🧪 فعال شد! جواب بعدی سکه بیشتری می‌دهد."
  );
}


/* ==================================
   INVENTORY UI
================================== */

function updateInventory(){

  document.getElementById(
    "hintCount"
  ).textContent =
    "×" +
    inventory(
      "kalemebaz_hintLetters"
    );

  document.getElementById(
    "removeCount"
  ).textContent =
    "×" +
    inventory(
      "kalemebaz_removeLetters"
    );

  document.getElementById(
    "solveCount"
  ).textContent =
    "×" +
    inventory(
      "kalemebaz_solveWords"
    );

  document.getElementById(
    "potionCount"
  ).textContent =
    "×" +
    inventory(
      "kalemebaz_magicPotions"
    );
}


/* ==================================
   STATS
================================== */

function updateStats(){

  document.getElementById(
    "coins"
  ).textContent =
    num("kalemebaz_coins");

  const xp =
    num("kalemebaz_xp");

  document.getElementById(
    "xp"
  ).textContent =
    xp + " XP";

  document.getElementById(
    "solvedCount"
  ).textContent =
    num(
      "kalemebaz_completedLevels"
    );
}


/* ==================================
   COMPLETE
================================== */

function completeLevel(){

  if(completed) return;

  completed = true;

  setNum(
    "kalemebaz_coins",
    num("kalemebaz_coins") + 20
  );

  setNum(
    "kalemebaz_xp",
    num("kalemebaz_xp") + 25
  );

  let current =
    num(
      "kalemebaz_currentLevel",
      1
    );

  if(level >= current){

    setNum(
      "kalemebaz_currentLevel",
      Math.min(level+1,500)
    );
  }

  let completedLevels =
    num(
      "kalemebaz_completedLevels",
      0
    );

  /*
    فقط اگر قبلاً ثبت نشده،
    تعداد مراحل کامل‌شده زیاد شود.
  */

  const completionKey =
    "kalemebaz_completed_" + level;

  if(
    localStorage.getItem(
      completionKey
    ) !== "1"
  ){

    localStorage.setItem(
      completionKey,
      "1"
    );

    setNum(
      "kalemebaz_completedLevels",
      completedLevels + 1
    );
  }

  document.getElementById(
    "completeText"
  ).textContent =
    "همه واژه‌های این مرحله را پیدا کردی! " +
    "۲۰ سکه و ۲۵ XP جایزه گرفتی.";

  document.getElementById(
    "completeModal"
  ).classList.add("show");

  document.getElementById(
    "nextButton"
  ).style.display =
    level < 500 ? "block" : "none";

  updateStats();
}


/* ==================================
   NEXT
================================== */

function nextLevel(){

  document.getElementById(
    "completeModal"
  ).classList.remove("show");

  if(level >= 500){

    goHome();

    return;
  }

  const next =
    level + 1;

  const current =
    num(
      "kalemebaz_currentLevel",
      1
    );

  if(next > current){

    showToast(
      "اول این مرحله را کامل کن."
    );

    return;
  }

  location.href =
    "game.html?level=" +
    next;
}


/* ==================================
   TOAST
================================== */

let toastTimer;

function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      toast.classList.remove(
        "show"
      );
    },2200);
}


/* ==================================
   HOME
================================== */

function goHome(){

  location.href =
    "index.html";
}


/* ==================================
   START
================================== */

createStars();

applySettings();

loadLevel();

resizeCanvas();

</script>

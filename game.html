<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>کلمه‌باز | بازی</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Tahoma,Arial,sans-serif;
  color:#fff;
  background:#08031a;
}

body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 0%,rgba(120,70,255,.30),transparent 35%),
    radial-gradient(circle at 10% 80%,rgba(0,180,255,.14),transparent 30%),
    linear-gradient(180deg,#10052c 0%,#08031a 55%,#03020b 100%);
}

body.theme-blue{
  background:
    radial-gradient(circle at 50% 0%,rgba(30,130,255,.32),transparent 35%),
    linear-gradient(180deg,#03152c,#020812 100%);
}

body.theme-forest{
  background:
    radial-gradient(circle at 50% 0%,rgba(30,190,110,.28),transparent 35%),
    linear-gradient(180deg,#031d18,#020907 100%);
}

#stars{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#fff;
  opacity:.8;
  animation:twinkle 2.5s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.25;transform:scale(.7)}
  to{opacity:1;transform:scale(1.4)}
}

.moon{
  position:fixed;
  top:55px;
  left:25px;
  width:85px;
  height:85px;
  border-radius:50%;
  background:linear-gradient(135deg,#fff,#bca9ff);
  box-shadow:0 0 35px rgba(190,160,255,.7);
  z-index:0;
}

.moon:after{
  content:"";
  position:absolute;
  width:78px;
  height:78px;
  border-radius:50%;
  background:#10052c;
  top:-8px;
  left:18px;
}

.container{
  position:relative;
  z-index:2;
  width:min(100%,650px);
  margin:auto;
  padding:15px 12px 40px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
}

.top-btn{
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.08);
  color:#fff;
  width:45px;
  height:45px;
  border-radius:15px;
  font-size:21px;
  cursor:pointer;
  backdrop-filter:blur(10px);
}

.title{
  text-align:center;
  flex:1;
}

.title h1{
  margin:0;
  font-size:22px;
  text-shadow:0 0 15px #9d72ff;
}

.title p{
  margin:3px 0 0;
  color:#bdaee9;
  font-size:11px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat{
  padding:10px 5px;
  border-radius:16px;
  text-align:center;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(12px);
}

.stat-icon{
  font-size:18px;
}

.stat strong{
  display:block;
  margin-top:4px;
  font-size:14px;
}

.level-card{
  padding:16px;
  border-radius:24px;
  background:linear-gradient(145deg,rgba(116,66,205,.28),rgba(20,10,55,.65));
  border:1px solid rgba(190,160,255,.25);
  box-shadow:0 15px 45px rgba(0,0,0,.25);
  margin-bottom:12px;
}

.level-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.level-number{
  font-size:25px;
  font-weight:bold;
}

.realm{
  color:#cdbdff;
  font-size:12px;
}

.xpbar{
  height:9px;
  background:rgba(255,255,255,.09);
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.xpfill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#8f5cff,#d9a7ff);
  border-radius:20px;
  transition:.4s;
}

.word-panel{
  background:rgba(7,3,24,.68);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:14px;
  backdrop-filter:blur(15px);
  margin-bottom:12px;
}

.panel-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-weight:bold;
}

.words{
  display:grid;
  gap:8px;
}

.word-card{
  min-height:58px;
  border-radius:16px;
  padding:9px 12px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.09);
  display:flex;
  flex-direction:column;
  justify-content:center;
  transition:.25s;
}

.word-card.solved{
  background:linear-gradient(90deg,rgba(40,190,120,.22),rgba(40,100,80,.12));
  border-color:rgba(80,255,170,.35);
}

.word-label{
  font-size:11px;
  color:#a99acb;
  margin-bottom:5px;
}

.letters{
  display:flex;
  direction:rtl;
  justify-content:center;
  gap:5px;
  flex-wrap:wrap;
}

.letter-box{
  width:30px;
  height:32px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.10);
  font-size:16px;
  font-weight:bold;
}

.letter-box.revealed{
  color:#f1d9ff;
  background:rgba(137,83,255,.25);
  border-color:rgba(190,140,255,.4);
}

.letter-box.solved-letter{
  color:#91ffd0;
  background:rgba(30,180,110,.2);
  border-color:rgba(80,255,170,.3);
}

.guess-panel{
  padding:13px;
  border-radius:22px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  margin-bottom:12px;
}

.guess-label{
  text-align:center;
  color:#bcaed8;
  font-size:12px;
  margin-bottom:8px;
}

.guess-box{
  min-height:50px;
  border-radius:15px;
  background:rgba(0,0,0,.25);
  border:1px solid rgba(190,150,255,.25);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  padding:8px;
  font-size:21px;
  font-weight:bold;
  letter-spacing:1px;
}

.hint-message{
  min-height:22px;
  text-align:center;
  color:#f2cf70;
  font-size:12px;
  margin-top:7px;
}

.tools{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:12px;
}

.tool{
  border:1px solid rgba(255,255,255,.12);
  border-radius:15px;
  padding:9px 4px;
  background:rgba(255,255,255,.065);
  color:white;
  cursor:pointer;
  font-size:11px;
}

.tool:active{
  transform:scale(.95);
}

.tool .emoji{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

.tool small{
  display:block;
  color:#a99ec1;
  margin-top:3px;
}

.keyboard{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  direction:rtl;
  margin-bottom:12px;
}

.key{
  min-height:43px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  color:#fff;
  background:linear-gradient(145deg,rgba(93,57,160,.42),rgba(30,16,70,.65));
  font-size:16px;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.key:active{
  transform:scale(.92);
}

.key.used{
  opacity:.25;
}

.key.disabled{
  opacity:.18;
  filter:grayscale(1);
  pointer-events:none;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.action{
  border:0;
  border-radius:17px;
  padding:14px;
  color:#fff;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}

.submit{
  background:linear-gradient(135deg,#7c4dff,#b76cff);
  box-shadow:0 8px 25px rgba(124,77,255,.3);
}

.clear{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12);
}

.next{
  display:none;
  width:100%;
  margin-top:9px;
  border:0;
  padding:14px;
  border-radius:17px;
  background:linear-gradient(135deg,#18a875,#5ce6ad);
  color:#03130c;
  font-weight:bold;
  font-size:14px;
}

.notice{
  text-align:center;
  color:#8f83aa;
  font-size:10px;
  margin-top:12px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(100%,420px);
  border-radius:25px;
  padding:25px 18px;
  text-align:center;
  background:linear-gradient(145deg,#1b0d42,#08031b);
  border:1px solid rgba(205,170,255,.25);
  box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.modal-box h2{
  margin:0 0 10px;
}

.modal-box p{
  color:#c0b5d5;
  line-height:1.9;
  font-size:13px;
}

.modal-btn{
  width:100%;
  border:0;
  padding:13px;
  border-radius:15px;
  margin-top:8px;
  background:linear-gradient(135deg,#8455ff,#b86cff);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  z-index:50;
  padding:12px 18px;
  border-radius:15px;
  background:rgba(18,10,40,.94);
  border:1px solid rgba(200,170,255,.3);
  box-shadow:0 10px 35px rgba(0,0,0,.4);
  font-size:12px;
  transition:.3s;
  white-space:nowrap;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
}

@media(max-width:390px){
  .keyboard{
    gap:4px;
  }

  .key{
    min-height:39px;
    font-size:14px;
  }

  .letter-box{
    width:27px;
    height:29px;
  }
}
</style>
</head>

<body>

<div id="stars"></div>
<div class="moon"></div>

<div class="container">

  <div class="topbar">
    <button class="top-btn" onclick="goHome()">⌂</button>

    <div class="title">
      <h1>✨ کلمه‌باز</h1>
      <p>ماجراجویی در سرزمین واژه‌ها</p>
    </div>

    <button class="top-btn" onclick="location.href='shop.html'">🛒</button>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-icon">🪙</span>
      <strong id="coins">0</strong>
    </div>

    <div class="stat">
      <span class="stat-icon">⭐</span>
      <strong id="xp">0 XP</strong>
    </div>

    <div class="stat">
      <span class="stat-icon">📦</span>
      <strong id="solvedCount">0</strong>
    </div>
  </div>

  <div class="level-card">
    <div class="level-head">
      <div>
        <div class="level-number">مرحله <span id="levelNumber">1</span></div>
        <div class="realm" id="realm">جنگل جادویی</div>
      </div>

      <div id="progressText">0 / 4</div>
    </div>

    <div class="xpbar">
      <div class="xpfill" id="xpFill"></div>
    </div>
  </div>

  <div class="word-panel">
    <div class="panel-title">
      <span>🔮 واژه‌های این مرحله</span>
      <span id="wordCount">4 واژه</span>
    </div>

    <div class="words" id="words"></div>
  </div>

  <div class="guess-panel">

    <div class="guess-label">
      حروف را انتخاب کن و کلمه را بساز
    </div>

    <div class="guess-box" id="guessBox">
      هنوز حرفی انتخاب نشده
    </div>

    <div class="hint-message" id="message"></div>

  </div>

  <div class="tools">

    <button class="tool" onclick="useLetterItem()">
      <span class="emoji">🔤</span>
      نمایش حرف
      <small id="hintLettersCount">×0</small>
    </button>

    <button class="tool" onclick="useRemoveItem()">
      <span class="emoji">🧹</span>
      پاک‌کن
      <small id="removeLettersCount">×0</small>
    </button>

    <button class="tool" onclick="useSolveItem()">
      <span class="emoji">💡</span>
      جواب جادویی
      <small id="solveWordsCount">×0</small>
    </button>

    <button class="tool" onclick="usePotion()">
      <span class="emoji">🧪</span>
      معجون
      <small id="potionCount">×0</small>
    </button>

  </div>

  <div class="keyboard" id="keyboard"></div>

  <div class="actions">
    <button class="action clear" onclick="clearGuess()">پاک کردن</button>
    <button class="action submit" onclick="submitGuess()">ثبت کلمه ✨</button>
  </div>

  <button class="next" id="nextButton" onclick="nextLevel()">
    مرحله بعدی ➜
  </button>

  <div class="notice">
    کلمه‌باز • سرزمین جادویی واژه‌ها
  </div>

</div>

<div class="modal" id="completeModal">
  <div class="modal-box">
    <div style="font-size:50px">🏆</div>
    <h2>مرحله کامل شد!</h2>
    <p id="completeText"></p>

    <button class="modal-btn" onclick="nextLevel()">
      مرحله بعدی ✨
    </button>

    <button class="modal-btn" onclick="goHome()"
      style="background:rgba(255,255,255,.08)">
      بازگشت به نقشه
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="levels.js"></script>

<script>
/* =========================
   SETTINGS
========================= */

const params = new URLSearchParams(location.search);

let level = parseInt(params.get("level")) || 1;

if(level < 1) level = 1;
if(level > 500) level = 500;


/* =========================
   DATA
========================= */

const letters = [
  "ا","ب","پ","ت","ث","ج","چ",
  "ح","خ","د","ذ","ر","ز","ژ",
  "س","ش","ص","ض","ط","ظ","ع",
  "غ","ف","ق","ک","گ","ل","م",
  "ن","و","ه","ی"
];

const realms = [
  "جنگل جادویی",
  "دره ستاره‌ها",
  "قلعه افسون‌شده",
  "سرزمین اژدها",
  "دریاچه ماه",
  "برج جادوگران",
  "دروازه‌های اسرار",
  "قصر بلورین"
];

let levelWords = [];
let solvedWords = [];
let currentGuess = "";
let revealed = {};
let disabledLetters = {};
let potionBoost = false;
let stageCompleted = false;


/* =========================
   STORAGE
========================= */

function getNumber(key, fallback = 0){
  const value = parseInt(localStorage.getItem(key));
  return Number.isFinite(value) ? value : fallback;
}

function setNumber(key,value){
  localStorage.setItem(key,String(value));
}

function getInventory(key){
  return getNumber(key,0);
}

function setInventory(key,value){
  setNumber(key,Math.max(0,value));
}

function stateKey(){
  return "kalemebaz_levelState_" + level;
}

function loadLevelState(){

  try{

    const saved = JSON.parse(
      localStorage.getItem(stateKey()) || "{}"
    );

    solvedWords = Array.isArray(saved.solvedWords)
      ? saved.solvedWords
      : [];

    revealed = saved.revealed || {};

  }catch(e){

    solvedWords = [];
    revealed = {};
  }

  disabledLetters = {};
  currentGuess = "";
  potionBoost = false;
  stageCompleted = solvedWords.length >= levelWords.length;
}

function saveLevelState(){

  localStorage.setItem(
    stateKey(),
    JSON.stringify({
      solvedWords,
      revealed
    })
  );
}


/* =========================
   SETTINGS
========================= */

function applySettings(){

  try{

    const settings =
      JSON.parse(localStorage.getItem("kalemebaz_settings") || "{}");

    const brightness =
      Number(settings.brightness || 100);

    document.body.style.filter =
      `brightness(${brightness / 100})`;

    if(settings.theme === "blue"){
      document.body.classList.add("theme-blue");
    }

    if(settings.theme === "forest"){
      document.body.classList.add("theme-forest");
    }

    if(settings.stars === false){
      document.getElementById("stars").style.display = "none";
    }

    if(settings.animations === false){
      document.documentElement.style.setProperty(
        "*",
        "animation:none!important"
      );
    }

  }catch(e){}
}


/* =========================
   STARS
========================= */

function createStars(){

  const stars = document.getElementById("stars");

  for(let i=0;i<90;i++){

    const s = document.createElement("div");

    s.className = "star";

    s.style.left = Math.random()*100 + "%";
    s.style.top = Math.random()*100 + "%";

    s.style.animationDelay =
      Math.random()*3 + "s";

    s.style.opacity =
      (.25 + Math.random()*.75);

    stars.appendChild(s);
  }
}


/* =========================
   LOAD LEVEL
========================= */

function loadLevel(){

  if(!window.KalameBazLevels){

    showToast("خطا: فایل levels.js پیدا نشد");
    return;
  }

  levelWords =
    window.KalameBazLevels[level] || [];

  if(!levelWords.length){

    showToast("اطلاعات این مرحله پیدا نشد");
    return;
  }

  levelWords =
    levelWords.map(w =>
      String(w).trim()
    ).filter(Boolean);

  loadLevelState();

  document.getElementById("levelNumber").textContent =
    level;

  document.getElementById("realm").textContent =
    realms[(level-1) % realms.length];

  document.getElementById("wordCount").textContent =
    levelWords.length + " واژه";

  renderWords();
  renderKeyboard();
  updateStats();
  updateInventory();
  updateGuess();
}


/* =========================
   WORD DISPLAY
========================= */

function renderWords(){

  const container =
    document.getElementById("words");

  container.innerHTML = "";

  levelWords.forEach((word,index)=>{

    const solved =
      solvedWords.includes(index);

    const card =
      document.createElement("div");

    card.className =
      "word-card" + (solved ? " solved" : "");

    const label =
      document.createElement("div");

    label.className = "word-label";

    label.textContent =
      "واژه " + (index+1);

    const lettersBox =
      document.createElement("div");

    lettersBox.className = "letters";

    const chars =
      [...word];

    chars.forEach((char,charIndex)=>{

      const box =
        document.createElement("div");

      box.className = "letter-box";

      if(solved){

        box.textContent = char;
        box.classList.add("solved-letter");

      }else if(
        revealed[index] &&
        revealed[index][charIndex]
      ){

        box.textContent = char;
        box.classList.add("revealed");

      }else{

        box.textContent = "•";
      }

      lettersBox.appendChild(box);
    });

    card.appendChild(label);
    card.appendChild(lettersBox);

    container.appendChild(card);
  });

  document.getElementById("progressText").textContent =
    solvedWords.length + " / " + levelWords.length;
}


/* =========================
   KEYBOARD
========================= */

function renderKeyboard(){

  const keyboard =
    document.getElementById("keyboard");

  keyboard.innerHTML = "";

  letters.forEach(letter=>{

    const button =
      document.createElement("button");

    button.className = "key";

    button.textContent = letter;

    if(disabledLetters[letter]){
      button.classList.add("disabled");
    }

    button.onclick = () =>
      addLetter(letter);

    keyboard.appendChild(button);
  });
}

function addLetter(letter){

  if(disabledLetters[letter]) return;

  if(currentGuess.length >= 15){

    showMessage("کلمه خیلی طولانی شد!");
    return;
  }

  currentGuess += letter;

  updateGuess();
}

function updateGuess(){

  const box =
    document.getElementById("guessBox");

  if(!currentGuess){

    box.textContent =
      "هنوز حرفی انتخاب نشده";

    return;
  }

  box.textContent =
    currentGuess;
}

function clearGuess(){

  currentGuess = "";

  updateGuess();
}


/* =========================
   GUESS
========================= */

function submitGuess(){

  const guess =
    currentGuess.trim();

  if(!guess){

    showMessage("اول یک کلمه بساز!");
    return;
  }

  const index =
    levelWords.indexOf(guess);

  if(index === -1){

    showMessage("❌ این کلمه در این مرحله نیست");
    currentGuess = "";
    updateGuess();
    return;
  }

  if(solvedWords.includes(index)){

    showMessage("این کلمه قبلاً پیدا شده!");
    currentGuess = "";
    updateGuess();
    return;
  }

  solvedWords.push(index);

  saveLevelState();

  let reward = 5;

  if(potionBoost){

    reward += 10;
    potionBoost = false;

    showMessage(
      "🧪 معجون فعال شد! پاداش بیشتر گرفتی."
    );

  }else{

    showMessage(
      "✨ درست بود! +" + reward + " سکه"
    );
  }

  setNumber(
    "kalemebaz_coins",
    getNumber("kalemebaz_coins") + reward
  );

  setNumber(
    "kalemebaz_xp",
    getNumber("kalemebaz_xp") + 10
  );

  currentGuess = "";

  renderWords();
  updateGuess();
  updateStats();

  if(solvedWords.length >= levelWords.length){

    completeLevel();
  }
}


/* =========================
   COMPLETE LEVEL
========================= */

function completeLevel(){

  if(stageCompleted) return;

  stageCompleted = true;

  setNumber(
    "kalemebaz_coins",
    getNumber("kalemebaz_coins") + 20
  );

  setNumber(
    "kalemebaz_xp",
    getNumber("kalemebaz_xp") + 25
  );

  const currentLevel =
    getNumber("kalemebaz_currentLevel",1);

  if(level >= currentLevel){

    setNumber(
      "kalemebaz_currentLevel",
      Math.min(level + 1,500)
    );
  }

  document.getElementById("nextButton").style.display =
    level < 500 ? "block" : "none";

  document.getElementById("completeText").textContent =
    level < 500
      ? "آفرین! همه واژه‌های مرحله را پیدا کردی. ۲۰ سکه و ۲۵ XP جایزه گرفتی."
      : "تبریک! تو به پایان ۵۰۰ مرحله فعلی کلمه‌باز رسیدی!";

  document.getElementById("completeModal")
    .classList.add("show");

  updateStats();
}


/* =========================
   NEXT LEVEL
========================= */

function nextLevel(){

  document.getElementById("completeModal")
    .classList.remove("show");

  if(level >= 500){

    goHome();
    return;
  }

  const next =
    level + 1;

  const current =
    getNumber("kalemebaz_currentLevel",1);

  if(next > current){

    showToast("اول مرحله فعلی را کامل کن!");
    return;
  }

  location.href =
    "game.html?level=" + next;
}


/* =========================
   ITEM 1
   LETTER HINT
========================= */

function useLetterItem(){

  const count =
    getInventory("kalemebaz_hintLetters");

  if(count <= 0){

    showMessage(
      "🔤 طلسم نمایش حرف نداری. از فروشگاه تهیه کن."
    );

    return;
  }

  let targetIndex = -1;

  for(let i=0;i<levelWords.length;i++){

    if(!solvedWords.includes(i)){

      targetIndex = i;
      break;
    }
  }

  if(targetIndex === -1){

    showMessage("همه کلمات حل شده‌اند!");
    return;
  }

  const word =
    levelWords[targetIndex];

  if(!revealed[targetIndex]){
    revealed[targetIndex] = {};
  }

  let charIndex = -1;

  for(let i=0;i<word.length;i++){

    if(!revealed[targetIndex][i]){

      charIndex = i;
      break;
    }
  }

  if(charIndex === -1){

    showMessage("حروف این کلمه قبلاً نمایش داده شده‌اند.");
    return;
  }

  revealed[targetIndex][charIndex] = true;

  setInventory(
    "kalemebaz_hintLetters",
    count - 1
  );

  saveLevelState();

  renderWords();
  updateInventory();

  showMessage(
    "🔤 یک حرف از واژه " +
    (targetIndex+1) +
    " نمایش داده شد."
  );
}


/* =========================
   ITEM 2
   REMOVE WRONG LETTERS
========================= */

function useRemoveItem(){

  const count =
    getInventory("kalemebaz_removeLetters");

  if(count <= 0){

    showMessage(
      "🧹 پاک‌کن جادویی نداری. از فروشگاه تهیه کن."
    );

    return;
  }

  const unsolved =
    levelWords.filter(
      (_,i)=>!solvedWords.includes(i)
    );

  const possibleLetters = new Set();

  unsolved.forEach(word=>{

    [...word].forEach(char=>{
      possibleLetters.add(char);
    });

  });

  let removed = 0;

  letters.forEach(letter=>{

    if(!possibleLetters.has(letter)){

      if(!disabledLetters[letter]){

        disabledLetters[letter] = true;
        removed++;
      }
    }
  });

  if(removed === 0){

    showMessage(
      "همه حروف فعلاً می‌توانند در جواب استفاده شوند."
    );

    return;
  }

  setInventory(
    "kalemebaz_removeLetters",
    count - 1
  );

  renderKeyboard();
  updateInventory();

  showMessage(
    "🧹 " + removed + " حرف اضافی پاک شد."
  );
}


/* =========================
   ITEM 3
   SOLVE ONE WORD
========================= */

function useSolveItem(){

  const count =
    getInventory("kalemebaz_solveWords");

  if(count <= 0){

    showMessage(
      "💡 جواب جادویی نداری. از فروشگاه تهیه کن."
    );

    return;
  }

  let target = -1;

  for(let i=0;i<levelWords.length;i++){

    if(!solvedWords.includes(i)){

      target = i;
      break;
    }
  }

  if(target === -1){

    showMessage("همه کلمات حل شده‌اند!");
    return;
  }

  solvedWords.push(target);

  setInventory(
    "kalemebaz_solveWords",
    count - 1
  );

  setNumber(
    "kalemebaz_coins",
    getNumber("kalemebaz_coins") + 2
  );

  setNumber(
    "kalemebaz_xp",
    getNumber("kalemebaz_xp") + 5
  );

  saveLevelState();

  renderWords();
  updateInventory();
  updateStats();

  showMessage(
    "💡 واژه " + (target+1) + " جادویی حل شد!"
  );

  if(solvedWords.length >= levelWords.length){

    completeLevel();
  }
}


/* =========================
   ITEM 4
   POTION
========================= */

function usePotion(){

  const count =
    getInventory("kalemebaz_magicPotions");

  if(count <= 0){

    showMessage(
      "🧪 معجون جادویی نداری. از فروشگاه تهیه کن."
    );

    return;
  }

  if(potionBoost){

    showMessage(
      "🧪 معجون همین حالا فعال است."
    );

    return;
  }

  setInventory(
    "kalemebaz_magicPotions",
    count - 1
  );

  potionBoost = true;

  updateInventory();

  showMessage(
    "🧪 معجون فعال شد! جواب بعدی پاداش بیشتری دارد."
  );
}


/* =========================
   INVENTORY
========================= */

function updateInventory(){

  document.getElementById("hintLettersCount")
    .textContent =
    "×" + getInventory("kalemebaz_hintLetters");

  document.getElementById("removeLettersCount")
    .textContent =
    "×" + getInventory("kalemebaz_removeLetters");

  document.getElementById("solveWordsCount")
    .textContent =
    "×" + getInventory("kalemebaz_solveWords");

  document.getElementById("potionCount")
    .textContent =
    "×" + getInventory("kalemebaz_magicPotions");
}


/* =========================
   STATS
========================= */

function updateStats(){

  const coins =
    getNumber("kalemebaz_coins",0);

  const xp =
    getNumber("kalemebaz_xp",0);

  const completed =
    getNumber("kalemebaz_completedLevels",0);

  document.getElementById("coins")
    .textContent = coins;

  document.getElementById("xp")
    .textContent = xp + " XP";

  document.getElementById("solvedCount")
    .textContent = completed;

  const progress =
    Math.min((xp % 100),100);

  document.getElementById("xpFill")
    .style.width = progress + "%";
}


/* =========================
   MESSAGES
========================= */

function showMessage(text){

  document.getElementById("message")
    .textContent = text;

  showToast(text);
}

let toastTimer;

function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },2200);
}


/* =========================
   HOME
========================= */

function goHome(){

  location.href = "index.html";
}


/* =========================
   START
========================= */

createStars();
applySettings();
loadLevel();

</script>

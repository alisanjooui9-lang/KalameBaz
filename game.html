<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>کلمه‌باز | بازی کلمات جادویی</title>

<script src="levels.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    font-family:Tahoma,Arial,sans-serif;
    background:#090719;
    color:#fff;
    overflow-x:hidden;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 15%,rgba(128,80,255,.25),transparent 30%),
        radial-gradient(circle at 10% 80%,rgba(0,180,255,.12),transparent 30%),
        linear-gradient(160deg,#100a27,#080615 70%);
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
    color:white;
}

#stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.7;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;transform:scale(.7)}
    to{opacity:1;transform:scale(1.4)}
}

.moon{
    position:fixed;
    top:35px;
    left:25px;
    width:70px;
    height:70px;
    border-radius:50%;
    background:linear-gradient(135deg,#fff,#bdb6ff);
    box-shadow:0 0 35px rgba(190,180,255,.55);
    z-index:0;
}

.app{
    position:relative;
    z-index:2;
    width:100%;
    max-width:560px;
    margin:auto;
    padding:12px 12px 30px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:12px;
}

.iconBtn{
    width:44px;
    height:44px;
    border-radius:15px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.1);
    font-size:20px;
}

.stats{
    flex:1;
    display:flex;
    justify-content:center;
    gap:8px;
}

.stat{
    min-width:78px;
    padding:7px 10px;
    border-radius:14px;
    text-align:center;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.09);
}

.stat small{
    display:block;
    color:#aaa5c8;
    font-size:10px;
}

.stat b{
    font-size:14px;
}

.levelTitle{
    text-align:center;
    margin:10px 0 4px;
    font-size:24px;
    font-weight:900;
}

.levelDifficulty{
    text-align:center;
    color:#bcb5dd;
    font-size:12px;
    margin-bottom:12px;
}

.progress{
    height:8px;
    background:rgba(255,255,255,.1);
    border-radius:99px;
    overflow:hidden;
    margin-bottom:14px;
}

.progressFill{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#8d5cff,#32d6ff);
    box-shadow:0 0 15px rgba(100,100,255,.5);
    transition:.4s;
}

.wordPanel{
    display:grid;
    gap:7px;
    margin-bottom:15px;
}

.word{
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:8px;
    border-radius:15px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:inset 0 0 20px rgba(255,255,255,.02);
}

.word.solved{
    background:rgba(65,210,150,.13);
    border-color:rgba(65,220,160,.45);
}

.wordLetter{
    width:27px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:2px solid #8c80ba;
    color:#fff;
    font-size:17px;
    font-weight:bold;
}

.word.solved .wordLetter{
    border-bottom-color:#50e4a2;
    color:#71f0b8;
}

.current{
    min-height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:10px 0 16px;
    border-radius:18px;
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.1);
    font-size:25px;
    font-weight:900;
    letter-spacing:4px;
}

.current.empty{
    color:#67627f;
    font-size:14px;
    letter-spacing:0;
}

#wheel{
    position:relative;
    width:min(88vw,390px);
    height:min(88vw,390px);
    margin:auto;
    touch-action:none;
    user-select:none;
}

.wheelGlow{
    position:absolute;
    inset:14%;
    border-radius:50%;
    background:radial-gradient(circle,rgba(120,80,255,.22),rgba(0,0,0,0));
    filter:blur(15px);
}

.center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:105px;
    height:105px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:radial-gradient(circle,#34206d,#17102d);
    border:2px solid rgba(168,125,255,.5);
    box-shadow:0 0 35px rgba(125,75,255,.3);
    color:#ddd6ff;
    font-size:12px;
    pointer-events:none;
}

.letterBtn{
    position:absolute;
    width:56px;
    height:56px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#33205f,#17122e);
    border:2px solid rgba(168,130,255,.4);
    box-shadow:0 5px 20px rgba(0,0,0,.35),0 0 12px rgba(130,80,255,.12);
    font-size:23px;
    font-weight:900;
    touch-action:none;
    transition:.12s;
}

.letterBtn.active{
    transform:translate(-50%,-50%) scale(1.12);
    background:linear-gradient(145deg,#7c4cff,#3c237e);
    border-color:#c8aaff;
    box-shadow:0 0 28px rgba(145,90,255,.7);
}

.letterBtn.disabled{
    opacity:.25;
    filter:grayscale(1);
}

#connectionCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:20;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:12px;
}

.action{
    min-height:48px;
    border-radius:15px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    font-weight:bold;
}

.action.hint{
    background:linear-gradient(135deg,#6d42d8,#3b2781);
}

.tools{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:10px;
}

.tool{
    min-height:62px;
    border-radius:15px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    font-size:18px;
}

.tool small{
    display:block;
    margin-top:3px;
    color:#bdb7d8;
    font-size:10px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(30px);
    opacity:0;
    z-index:100;
    padding:12px 18px;
    border-radius:14px;
    background:#21163d;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    transition:.3s;
    pointer-events:none;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.modal{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(4,2,12,.75);
    backdrop-filter:blur(7px);
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(92vw,400px);
    padding:25px;
    border-radius:25px;
    text-align:center;
    background:linear-gradient(160deg,#241443,#100a22);
    border:1px solid rgba(190,150,255,.3);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.modalBox h2{
    margin:0 0 10px;
}

.modalBox p{
    color:#c7c0df;
    line-height:1.9;
}

.modalButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:18px;
}

.modalButtons button{
    min-height:48px;
    border-radius:14px;
    background:#33205f;
}

.modalButtons .next{
    background:linear-gradient(135deg,#8654ff,#4930a0);
}

#loading{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    background:#090719;
}

.loader{
    width:45px;
    height:45px;
    border:4px solid rgba(255,255,255,.12);
    border-top-color:#9a6cff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:370px){

    .stat{
        min-width:65px;
        padding:6px;
    }

    .letterBtn{
        width:48px;
        height:48px;
        font-size:20px;
    }

    .center{
        width:88px;
        height:88px;
    }

    #wheel{
        width:92vw;
        height:92vw;
    }
}
</style>
</head>

<body>

<div id="loading">
    <div style="font-size:32px">✨</div>
    <b>کلمه‌باز</b>
    <div style="color:#aaa5c8;font-size:12px">در حال آماده‌سازی مرحله...</div>
    <div class="loader"></div>
</div>

<div id="stars"></div>
<div class="moon"></div>

<canvas id="connectionCanvas"></canvas>

<div class="app">

    <div class="topbar">

        <button class="iconBtn" onclick="goHome()">🏠</button>

        <div class="stats">

            <div class="stat">
                <small>🪙 سکه</small>
                <b id="coins">0</b>
            </div>

            <div class="stat">
                <small>⭐ XP</small>
                <b id="xp">0</b>
            </div>

        </div>

        <button class="iconBtn" onclick="goShop()">🛒</button>

    </div>

    <div class="levelTitle" id="levelTitle">مرحله ۱</div>

    <div class="levelDifficulty" id="difficulty">
        آماده‌ای؟
    </div>

    <div class="progress">
        <div class="progressFill" id="progressFill"></div>
    </div>

    <div class="wordPanel" id="wordPanel"></div>

    <div id="currentWord" class="current empty">
        حروف را بکش و کلمه بساز
    </div>

    <div id="wheel">

        <div class="wheelGlow"></div>

        <div class="center">
            ✨<br>
            کلمه‌باز
        </div>

    </div>

    <div class="tools">

        <button class="tool" onclick="useLetterItem()">
            🔤
            <small>طلسم حرف</small>
            <small id="hintCount">0</small>
        </button>

        <button class="tool" onclick="useRemoveItem()">
            🧹
            <small>پاک‌کن</small>
            <small id="removeCount">0</small>
        </button>

        <button class="tool" onclick="useSolveItem()">
            💡
            <small>جواب جادویی</small>
            <small id="solveCount">0</small>
        </button>

        <button class="tool" onclick="usePotion()">
            🧪
            <small>معجون</small>
            <small id="potionCount">0</small>
        </button>

    </div>

    <div class="actions">

        <button class="action" onclick="clearSelection()">
            ↩️ پاک کردن
        </button>

        <button class="action hint" onclick="normalHint()">
            ✨ راهنمایی · ۲۰ 🪙
        </button>

    </div>

</div>

<div id="toast" class="toast"></div>

<div id="levelModal" class="modal">

    <div class="modalBox">

        <div style="font-size:45px">🏆</div>

        <h2>مرحله کامل شد!</h2>

        <p id="rewardText">
            آفرین!
        </p>

        <div class="modalButtons">

            <button onclick="goHome()">
                🏠 خانه
            </button>

            <button class="next" onclick="nextLevel()">
                مرحله بعد ➜
            </button>

        </div>

    </div>

</div>

<script>

/* =========================================================
   کلمه‌باز — GAME ENGINE
========================================================= */

const TOTAL_LEVELS = 1200;

function normalizeWord(word){

    return String(word || "")
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ۀ/g,"ه")
        .replace(/ة/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/إ/g,"ا")
        .replace(/أ/g,"ا")
        .replace(/ٱ/g,"ا")
        .replace(/‌/g,"")
        .replace(/\u200c/g,"")
        .replace(/\u200d/g,"")
        .replace(/\s+/g,"")
        .trim();
}

/* ---------------------------------------------------------
   گرفتن مراحل
--------------------------------------------------------- */

const LEVELS =
    window.KALAMEBAZ_LEVELS ||
    window.KalameBazLevels ||
    window.levels ||
    {};

let level =
    parseInt(
        new URLSearchParams(location.search).get("level")
    ) || 1;

if(level < 1) level = 1;
if(level > TOTAL_LEVELS) level = TOTAL_LEVELS;

const words = Array.isArray(LEVELS[level])
    ? LEVELS[level].map(normalizeWord)
    : [];

/* ---------------------------------------------------------
   اگر مرحله پیدا نشد
--------------------------------------------------------- */

if(!words.length){

    document.getElementById("loading").innerHTML = `
        <div style="font-size:45px">⚠️</div>
        <b>مرحله پیدا نشد</b>
        <div style="color:#aaa5c8;margin-top:8px">
            فایل levels.js را بررسی کنید.
        </div>
        <button onclick="goHome()" style="
            margin-top:15px;
            padding:12px 25px;
            border-radius:12px;
            background:#5632a0;
            color:white;
        ">بازگشت</button>
    `;

}else{

    initGame();

}

/* ---------------------------------------------------------
   ذخیره وضعیت
--------------------------------------------------------- */

const stateKey =
    "kalemebaz_levelState_" + level;

let state = JSON.parse(
    localStorage.getItem(stateKey) || "null"
);

if(!state){

    state = {
        solvedWords:[],
        revealed:{},
        bonusWordsUsed:[],
        wrongAttempts:0
    };

}

if(!Array.isArray(state.solvedWords))
    state.solvedWords = [];

if(!Array.isArray(state.bonusWordsUsed))
    state.bonusWordsUsed = [];

if(!state.revealed)
    state.revealed = {};

function saveState(){

    localStorage.setItem(
        stateKey,
        JSON.stringify(state)
    );

}

/* ---------------------------------------------------------
   متغیرهای بازی
--------------------------------------------------------- */

let selectedIndices = [];
let selectedLetters = [];
let dragging = false;
let pointerX = 0;
let pointerY = 0;
let bonusPotionActive = false;
let disabledLetters = new Set();

/* ---------------------------------------------------------
   عناصر
--------------------------------------------------------- */

const wheel =
    document.getElementById("wheel");

const currentWord =
    document.getElementById("currentWord");

const canvas =
    document.getElementById("connectionCanvas");

const ctx =
    canvas.getContext("2d");

/* ---------------------------------------------------------
   ستاره‌ها
--------------------------------------------------------- */

function createStars(){

    const box =
        document.getElementById("stars");

    for(let i=0;i<75;i++){

        const star =
            document.createElement("div");

        star.className = "star";

        star.style.left =
            Math.random()*100 + "%";

        star.style.top =
            Math.random()*100 + "%";

        star.style.animationDelay =
            Math.random()*2 + "s";

        box.appendChild(star);
    }
}

createStars();

/* ---------------------------------------------------------
   اندازه Canvas
--------------------------------------------------------- */

function resizeCanvas(){

    canvas.width = innerWidth;
    canvas.height = innerHeight;

}

addEventListener("resize",resizeCanvas);

resizeCanvas();

/* ---------------------------------------------------------
   سکه و XP
--------------------------------------------------------- */

function getCoins(){

    return parseInt(
        localStorage.getItem("kalemebaz_coins") || "100"
    );

}

function getXP(){

    return parseInt(
        localStorage.getItem("kalemebaz_xp") || "0"
    );

}

function setCoins(value){

    localStorage.setItem(
        "kalemebaz_coins",
        Math.max(0,value)
    );

}

function setXP(value){

    localStorage.setItem(
        "kalemebaz_xp",
        Math.max(0,value)
    );

}

function updateStats(){

    document.getElementById("coins").textContent =
        getCoins();

    document.getElementById("xp").textContent =
        getXP();

    document.getElementById("hintCount").textContent =
        localStorage.getItem("kalemebaz_hintLetters") || "0";

    document.getElementById("removeCount").textContent =
        localStorage.getItem("kalemebaz_removeLetters") || "0";

    document.getElementById("solveCount").textContent =
        localStorage.getItem("kalemebaz_solveWords") || "0";

    document.getElementById("potionCount").textContent =
        localStorage.getItem("kalemebaz_magicPotions") || "0";
}

/* ---------------------------------------------------------
   تعداد حروف مورد نیاز
--------------------------------------------------------- */

function maxLetterCounts(){

    const counts = {};

    words.forEach(word => {

        const local = {};

        [...word].forEach(letter => {

            local[letter] =
                (local[letter] || 0) + 1;

        });

        Object.keys(local).forEach(letter => {

            counts[letter] =
                Math.max(
                    counts[letter] || 0,
                    local[letter]
                );

        });

    });

    return counts;
}

/* ---------------------------------------------------------
   ساخت چرخ حروف
--------------------------------------------------------- */

let letterData = [];

function buildWheel(){

    wheel.querySelectorAll(".letterBtn")
        .forEach(el => el.remove());

    const counts = maxLetterCounts();

    letterData = [];

    Object.keys(counts).forEach(letter => {

        for(let i=0;i<counts[letter];i++){

            letterData.push({
                letter:letter,
                index:letterData.length
            });

        }

    });

    /*
      در مراحل با حروف زیاد، اندازه دکمه
      به صورت خودکار کوچک‌تر می‌شود.
    */

    let buttonSize = 56;

    if(letterData.length >= 17)
        buttonSize = 51;

    if(letterData.length >= 21)
        buttonSize = 46;

    if(letterData.length >= 25)
        buttonSize = 42;

    if(letterData.length >= 29)
        buttonSize = 38;

    const rect =
        wheel.getBoundingClientRect();

    const size =
        Math.min(rect.width,rect.height);

    let radius =
        size * .35;

    if(letterData.length >= 21)
        radius = size * .38;

    if(letterData.length >= 27)
        radius = size * .40;

    letterData.forEach((item,i)=>{

        const btn =
            document.createElement("button");

        btn.className =
            "letterBtn";

        btn.textContent =
            item.letter;

        btn.dataset.index =
            i;

        btn.style.width =
            buttonSize + "px";

        btn.style.height =
            buttonSize + "px";

        const angle =
            (-Math.PI/2) +
            (i / letterData.length) *
            Math.PI*2;

        const x =
            size/2 +
            Math.cos(angle)*radius;

        const y =
            size/2 +
            Math.sin(angle)*radius;

        btn.style.left =
            x + "px";

        btn.style.top =
            y + "px";

        btn.addEventListener(
            "pointerdown",
            e => {

                e.preventDefault();

                startDrag(i,e);

            }
        );

        wheel.appendChild(btn);

    });

}

/* ---------------------------------------------------------
   شروع کشیدن
--------------------------------------------------------- */

function startDrag(index,e){

    if(disabledLetters.has(index))
        return;

    dragging = true;

    selectedIndices = [index];

    selectedLetters = [
        letterData[index].letter
    ];

    pointerX = e.clientX;
    pointerY = e.clientY;

    refreshSelection();

}

/* ---------------------------------------------------------
   تشخیص دکمه زیر انگشت
--------------------------------------------------------- */

function detectLetterAt(x,y){

    const el =
        document.elementFromPoint(x,y);

    if(!el)
        return -1;

    const btn =
        el.closest(".letterBtn");

    if(!btn)
        return -1;

    const index =
        parseInt(btn.dataset.index);

    return Number.isInteger(index)
        ? index
        : -1;
}

/* ---------------------------------------------------------
   حرکت انگشت
--------------------------------------------------------- */

document.addEventListener(
    "pointermove",
    e => {

        if(!dragging)
            return;

        e.preventDefault();

        pointerX = e.clientX;
        pointerY = e.clientY;

        const index =
            detectLetterAt(
                e.clientX,
                e.clientY
            );

        if(
            index >= 0 &&
            !disabledLetters.has(index) &&
            !selectedIndices.includes(index)
        ){

            selectedIndices.push(index);

            selectedLetters.push(
                letterData[index].letter
            );

            refreshSelection();

        }

        drawConnection();

    },
    {passive:false}
);

/* ---------------------------------------------------------
   پایان کشیدن
--------------------------------------------------------- */

document.addEventListener(
    "pointerup",
    () => {

        if(!dragging)
            return;

        dragging = false;

        const formed =
            selectedLetters.join("");

        if(formed.length >= 2){

            submitWord(formed);

        }

        selectedIndices = [];
        selectedLetters = [];

        refreshSelection();
        clearCanvas();

    }
);

/* ---------------------------------------------------------
   نمایش انتخاب
--------------------------------------------------------- */

function refreshSelection(){

    const buttons =
        wheel.querySelectorAll(".letterBtn");

    buttons.forEach((btn,i)=>{

        btn.classList.toggle(
            "active",
            selectedIndices.includes(i)
        );

    });

    if(selectedLetters.length){

        currentWord.classList.remove("empty");

        currentWord.textContent =
            selectedLetters.join("");

    }else{

        currentWord.classList.add("empty");

        currentWord.textContent =
            "حروف را بکش و کلمه بساز";

    }

}

/* ---------------------------------------------------------
   خط اتصال
--------------------------------------------------------- */

function drawConnection(){

    clearCanvas();

    if(selectedIndices.length === 0)
        return;

    const points = [];

    selectedIndices.forEach(index=>{

        const btn =
            wheel.querySelector(
                `.letterBtn[data-index="${index}"]`
            );

        if(!btn)
            return;

        const r =
            btn.getBoundingClientRect();

        points.push({
            x:r.left+r.width/2,
            y:r.top+r.height/2
        });

    });

    if(!points.length)
        return;

    ctx.beginPath();

    ctx.lineWidth = 7;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.shadowBlur = 18;

    ctx.shadowColor =
        "rgba(155,100,255,.9)";

    ctx.strokeStyle =
        "rgba(170,125,255,.85)";

    ctx.moveTo(
        points[0].x,
        points[0].y
    );

    for(let i=1;i<points.length;i++){

        ctx.lineTo(
            points[i].x,
            points[i].y
        );

    }

    ctx.lineTo(pointerX,pointerY);

    ctx.stroke();

}

function clearCanvas(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}

/* ---------------------------------------------------------
   پاک کردن انتخاب
--------------------------------------------------------- */

function clearSelection(){

    selectedIndices = [];

    selectedLetters = [];

    refreshSelection();

    clearCanvas();

}

/* ---------------------------------------------------------
   ارسال کلمه
--------------------------------------------------------- */

function submitWord(rawWord){

    const word =
        normalizeWord(rawWord);

    if(!word)
        return;

    const foundIndex =
        words.findIndex(
            w => normalizeWord(w) === word
        );

    if(foundIndex >= 0){

        if(
            state.solvedWords.includes(foundIndex)
        ){

            showToast("این کلمه قبلاً پیدا شده است!");

            return;
        }

        solveWord(
            foundIndex,
            word
        );

        return;
    }

    handleWrongWord(word);

}

/* ---------------------------------------------------------
   جواب درست
--------------------------------------------------------- */

function solveWord(index,word){

    state.solvedWords.push(index);

    saveState();

    let reward =
        Math.max(
            4,
            Math.min(
                14,
                word.length * 2
            )
        );

    let xpReward =
        Math.max(
            5,
            word.length * 2
        );

    if(bonusPotionActive){

        reward *= 2;

        xpReward *= 2;

        bonusPotionActive = false;

        showToast(
            `🧪 معجون فعال بود! +${reward} سکه`
        );

    }else{

        showToast(
            `✨ درست بود! +${reward} سکه`
        );

    }

    setCoins(
        getCoins()+reward
    );

    setXP(
        getXP()+xpReward
    );

    updateStats();

    renderWords();

    updateProgress();

    if(
        state.solvedWords.length >=
        words.length
    ){

        completeLevel();

    }

}

/* ---------------------------------------------------------
   کلمه اشتباه
--------------------------------------------------------- */

function handleWrongWord(word){

    state.wrongAttempts =
        (state.wrongAttempts || 0) + 1;

    saveState();

    /*
      بازی فعلاً محدودیت سخت برای تعداد تلاش ندارد.
      هر اشتباه فقط پیام می‌دهد.
    */

    showToast(
        "❌ این کلمه در این مرحله نیست"
    );

}

/* ---------------------------------------------------------
   نمایش کلمات
--------------------------------------------------------- */

function renderWords(){

    const panel =
        document.getElementById("wordPanel");

    panel.innerHTML = "";

    words.forEach((word,index)=>{

        const box =
            document.createElement("div");

        box.className =
            "word";

        const solved =
            state.solvedWords.includes(index);

        if(solved)
            box.classList.add("solved");

        const revealed =
            state.revealed[index] || [];

        [...word].forEach((letter,i)=>{

            const span =
                document.createElement("span");

            span.className =
                "wordLetter";

            if(
                solved ||
                revealed.includes(i)
            ){

                span.textContent =
                    letter;

            }else{

                span.textContent =
                    "•";

            }

            box.appendChild(span);

        });

        panel.appendChild(box);

    });

}

/* ---------------------------------------------------------
   پیشرفت
--------------------------------------------------------- */

function updateProgress(){

    const solved =
        state.solvedWords.length;

    const percent =
        (solved / words.length)*100;

    document.getElementById(
        "progressFill"
    ).style.width =
        percent + "%";

}

/* ---------------------------------------------------------
   راهنمای معمولی
--------------------------------------------------------- */

function normalHint(){

    if(
        state.solvedWords.length >=
        words.length
    ){

        showToast("همه کلمات پیدا شده‌اند!");

        return;
    }

    if(getCoins() < 20){

        showToast("🪙 سکه کافی نداری!");

        return;
    }

    let target = -1;

    for(let i=0;i<words.length;i++){

        if(
            !state.solvedWords.includes(i)
        ){

            target = i;
            break;

        }

    }

    if(target < 0)
        return;

    const word =
        words[target];

    const revealed =
        state.revealed[target] || [];

    let position = 0;

    for(
        let i=0;
        i<word.length;
        i++
    ){

        if(!revealed.includes(i)){

            position = i;

            break;

        }

    }

    if(!state.revealed[target])
        state.revealed[target] = [];

    state.revealed[target].push(position);

    setCoins(
        getCoins()-20
    );

    saveState();

    renderWords();

    updateStats();

    showToast("✨ یک حرف آشکار شد!");

}

/* ---------------------------------------------------------
   طلسم یک حرف
--------------------------------------------------------- */

function useLetterItem(){

    const key =
        "kalemebaz_hintLetters";

    let count =
        parseInt(
            localStorage.getItem(key) || "0"
        );

    if(count <= 0){

        showToast("🔤 طلسم حرف نداری!");

        return;
    }

    let target = -1;

    for(let i=0;i<words.length;i++){

        if(!state.solvedWords.includes(i)){

            target = i;
            break;

        }

    }

    if(target < 0)
        return;

    const word =
        words[target];

    const revealed =
        state.revealed[target] || [];

    let position = -1;

    for(let i=0;i<word.length;i++){

        if(!revealed.includes(i)){

            position = i;
            break;

        }

    }

    if(position < 0)
        return;

    if(!state.revealed[target])
        state.revealed[target] = [];

    state.revealed[target].push(position);

    localStorage.setItem(
        key,
        count-1
    );

    saveState();

    renderWords();

    updateStats();

    showToast("🔤 یک حرف با طلسم آشکار شد!");

}

/* ---------------------------------------------------------
   پاک‌کن جادویی
--------------------------------------------------------- */

function useRemoveItem(){

    const key =
        "kalemebaz_removeLetters";

    let count =
        parseInt(
            localStorage.getItem(key) || "0"
        );

    if(count <= 0){

        showToast("🧹 پاک‌کن جادویی نداری!");

        return;
    }

    disabledLetters.clear();

    const useful =
        new Set();

    words.forEach((word,index)=>{

        if(
            !state.solvedWords.includes(index)
        ){

            [...word].forEach(letter=>{
                useful.add(letter);
            });

        }

    });

    const buttons =
        [...wheel.querySelectorAll(".letterBtn")];

    let removed = 0;

    buttons.forEach((btn,i)=>{

        const letter =
            letterData[i].letter;

        if(
            !useful.has(letter) &&
            removed < 3
        ){

            disabledLetters.add(i);

            btn.classList.add("disabled");

            removed++;

        }

    });

    localStorage.setItem(
        key,
        count-1
    );

    updateStats();

    showToast(
        `🧹 ${removed} حرف بی‌استفاده پاک شد`
    );

}

/* ---------------------------------------------------------
   جواب جادویی
--------------------------------------------------------- */

function useSolveItem(){

    const key =
        "kalemebaz_solveWords";

    let count =
        parseInt(
            localStorage.getItem(key) || "0"
        );

    if(count <= 0){

        showToast("💡 جواب جادویی نداری!");

        return;
    }

    let target = -1;

    for(let i=0;i<words.length;i++){

        if(
            !state.solvedWords.includes(i)
        ){

            target = i;
            break;

        }

    }

    if(target < 0)
        return;

    state.solvedWords.push(target);

    localStorage.setItem(
        key,
        count-1
    );

    const word =
        words[target];

    setCoins(
        getCoins() +
        Math.max(
            4,
            Math.min(
                14,
                word.length*2
            )
        )
    );

    setXP(
        getXP() +
        Math.max(
            5,
            word.length*2
        )
    );

    saveState();

    renderWords();

    updateProgress();

    updateStats();

    showToast(
        `💡 کلمه «${word}» پیدا شد!`
    );

    if(
        state.solvedWords.length >=
        words.length
    ){

        setTimeout(
            completeLevel,
            500
        );

    }

}

/* ---------------------------------------------------------
   معجون جادویی
--------------------------------------------------------- */

function usePotion(){

    const key =
        "kalemebaz_magicPotions";

    let count =
        parseInt(
            localStorage.getItem(key) || "0"
        );

    if(count <= 0){

        showToast("🧪 معجون نداری!");

        return;
    }

    localStorage.setItem(
        key,
        count-1
    );

    bonusPotionActive = true;

    updateStats();

    showToast(
        "🧪 معجون فعال شد! پاداش کلمه بعدی دو برابر است."
    );

}

/* ---------------------------------------------------------
   پایان مرحله
--------------------------------------------------------- */

function completeLevel(){

    if(
        localStorage.getItem(
            "kalemebaz_completed_"+level
        ) === "1"
    ){

        showCompletionModal();

        return;
    }

    localStorage.setItem(
        "kalemebaz_completed_"+level,
        "1"
    );

    let completed =
        parseInt(
            localStorage.getItem(
                "kalemebaz_completedLevels"
            ) || "0"
        );

    completed++;

    localStorage.setItem(
        "kalemebaz_completedLevels",
        completed
    );

    /*
      باز کردن مرحله بعد
    */

    let current =
        parseInt(
            localStorage.getItem(
                "kalemebaz_currentLevel"
            ) || "1"
        );

    if(level >= current){

        localStorage.setItem(
            "kalemebaz_currentLevel",
            Math.min(
                TOTAL_LEVELS,
                level+1
            )
        );

    }

    setCoins(
        getCoins()+20
    );

    setXP(
        getXP()+25
    );

    updateStats();

    showCompletionModal();

}

/* ---------------------------------------------------------
   مودال پایان
--------------------------------------------------------- */

function showCompletionModal(){

    document.getElementById(
        "rewardText"
    ).innerHTML = `
        🎉 همه کلمات مرحله را پیدا کردی!<br><br>
        🪙 پاداش پایان مرحله: <b>۲۰ سکه</b><br>
        ⭐ پاداش تجربه: <b>۲۵ XP</b>
    `;

    document.getElementById(
        "levelModal"
    ).classList.add("show");

}

/* ---------------------------------------------------------
   مرحله بعد
--------------------------------------------------------- */

function nextLevel(){

    if(level >= TOTAL_LEVELS){

        showToast(
            "👑 تبریک! تمام ۱۲۰۰ مرحله را کامل کردی!"
        );

        return;
    }

    location.href =
        "game.html?level="+(level+1);

}

/* ---------------------------------------------------------
   پیام
--------------------------------------------------------- */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            ()=>toast.classList.remove("show"),
            2200
        );

}

/* ---------------------------------------------------------
   خانه
--------------------------------------------------------- */

function goHome(){

    location.href =
        "index.html";

}

/* ---------------------------------------------------------
   فروشگاه
--------------------------------------------------------- */

function goShop(){

    location.href =
        "shop.html";

}

/* ---------------------------------------------------------
   شروع بازی
--------------------------------------------------------- */

function initGame(){

    document.getElementById(
        "levelTitle"
    ).textContent =
        "مرحله " + level;

    let difficulty =
        "آسان";

    if(level > 100)
        difficulty = "متوسط";

    if(level > 300)
        difficulty = "سخت";

    if(level > 500)
        difficulty = "خیلی سخت";

    if(level > 800)
        difficulty = "حرفه‌ای";

    if(level > 1000)
        difficulty = "افسانه‌ای";

    document.getElementById(
        "difficulty"
    ).textContent =
        "درجه سختی: " + difficulty;

    updateStats();

    renderWords();

    updateProgress();

    /*
      یک تأخیر کوتاه برای نمایش صفحه لودینگ
    */

    setTimeout(()=>{

        buildWheel();

        document.getElementById(
            "loading"
        ).style.display =
            "none";

    },350);

}

/* ---------------------------------------------------------
   بازسازی چرخ در تغییر اندازه صفحه
--------------------------------------------------------- */

let resizeTimer;

addEventListener(
    "resize",
    ()=>{

        clearTimeout(resizeTimer);

        resizeTimer =
            setTimeout(
                buildWheel,
                150
            );

    }
);

</script>

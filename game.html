<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>کلمه‌باز - بازی</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% 5%,#35216f 0%,#15103d 38%,#05030f 100%);
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

body{
    position:relative;
}

#stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    opacity:.7;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;transform:scale(.7)}
    to{opacity:1;transform:scale(1.4)}
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* ---------- TOP ---------- */

#topbar{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    height:54px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:50;
}

.top-btn{
    width:46px;
    height:46px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:15px;
    background:rgba(18,12,48,.78);
    color:#fff;
    font-size:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

#stats{
    display:flex;
    gap:7px;
}

.stat{
    min-width:75px;
    height:40px;
    padding:0 9px;
    border-radius:13px;
    background:rgba(18,12,48,.78);
    border:1px solid rgba(255,255,255,.13);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:13px;
}

#coins{
    color:#ffd75e;
}

#xp{
    color:#74eaff;
}

/* ---------- LEVEL ---------- */

#levelInfo{
    position:fixed;
    top:70px;
    left:10px;
    right:10px;
    text-align:center;
    z-index:40;
}

#levelTitle{
    font-size:22px;
    font-weight:bold;
    text-shadow:0 0 16px #8c6cff;
}

#difficulty{
    margin-top:5px;
    font-size:11px;
    color:#c9bfff;
}

/* ---------- WORD PANEL ---------- */

#wordPanel{
    position:fixed;
    top:112px;
    left:10px;
    right:10px;

    height:220px;

    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-auto-rows:58px;

    gap:8px;
    padding:3px;

    overflow:hidden;

    z-index:30;
}

.word-card{
    min-width:0;
    height:58px;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            rgba(52,38,107,.8),
            rgba(19,14,54,.9)
        );

    border:1px solid rgba(159,131,255,.25);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        inset 0 0 20px rgba(130,100,255,.05),
        0 6px 15px rgba(0,0,0,.2);

    font-size:16px;
    font-weight:bold;

    direction:rtl;
    overflow:hidden;
}

.word-card.empty{
    color:#7e779d;
}

.word-card.found{
    border-color:rgba(88,255,184,.5);

    background:
        linear-gradient(
            135deg,
            rgba(27,106,91,.75),
            rgba(14,53,52,.85)
        );

    color:#7dffc8;
}

.word-letters{
    display:flex;
    gap:3px;
    justify-content:center;
    align-items:center;
}

.word-slot{
    width:17px;
    height:24px;
    border-bottom:2px solid rgba(255,255,255,.55);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:15px;
}

.word-card.found .word-slot{
    border-bottom-color:#69ffc0;
}

/* ---------- CURRENT WORD ---------- */

#currentWord{
    position:fixed;
    left:50%;
    top:350px;

    transform:translateX(-50%);

    min-width:120px;
    height:43px;
    padding:0 18px;

    border-radius:22px;

    background:rgba(12,8,35,.8);
    border:1px solid rgba(169,139,255,.4);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:bold;

    color:#fff;

    z-index:45;

    opacity:0;
    transition:.15s;
}

#currentWord.show{
    opacity:1;
}

/* ---------- WHEEL ---------- */

#wheel{
    position:fixed;

    left:50%;
    top:70%;

    width:min(78vw,340px);
    height:min(78vw,340px);

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(65,48,139,.32) 0%,
            rgba(24,16,66,.25) 45%,
            rgba(5,3,18,.05) 70%
        );

    border:1px solid rgba(159,129,255,.18);

    box-shadow:
        0 0 45px rgba(112,75,255,.16),
        inset 0 0 45px rgba(90,60,180,.1);

    z-index:20;

    touch-action:none;
}

#wheelCenter{
    position:absolute;

    left:50%;
    top:50%;

    width:90px;
    height:90px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(circle,#332270,#120b32);

    border:1px solid rgba(180,155,255,.25);

    box-shadow:
        0 0 30px rgba(119,85,255,.3),
        inset 0 0 20px rgba(0,0,0,.3);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#a99aff;
    font-size:12px;
}

/* ---------- LETTER ---------- */

.letter{
    position:absolute;

    width:61px;
    height:61px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #6351bb,
            #2d1d6c 55%,
            #170d3f
        );

    border:1px solid rgba(195,180,255,.45);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
    font-weight:bold;

    box-shadow:
        0 7px 18px rgba(0,0,0,.4),
        0 0 13px rgba(127,93,255,.2);

    z-index:10;

    touch-action:none;
    pointer-events:auto;

    transition:
        transform .1s,
        background .1s,
        box-shadow .1s;
}

.letter.selected{
    transform:translate(-50%,-50%) scale(1.13);

    background:
        radial-gradient(
            circle at 35% 25%,
            #b18cff,
            #694bd0 55%,
            #38208a
        );

    box-shadow:
        0 0 28px rgba(156,118,255,.8),
        0 0 55px rgba(110,75,255,.35);

    border-color:#e5dcff;
}

/* ---------- CONNECTION ---------- */

#connectionCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:18;
}

/* ---------- BOTTOM ---------- */

#tools{
    position:fixed;

    bottom:16px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:center;
    gap:9px;

    z-index:50;
}

.tool{
    width:58px;
    height:48px;

    border:1px solid rgba(255,255,255,.15);
    border-radius:16px;

    background:rgba(18,12,48,.82);

    color:#fff;

    font-size:20px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:2px;
}

.tool small{
    font-size:9px;
    color:#bbb2d9;
}

/* ---------- TOAST ---------- */

#toast{
    position:fixed;

    left:50%;
    bottom:80px;

    transform:translate(-50%,20px);

    padding:10px 17px;

    border-radius:15px;

    background:rgba(20,12,52,.95);

    border:1px solid rgba(172,143,255,.3);

    color:#fff;

    font-size:13px;

    opacity:0;
    pointer-events:none;

    transition:.25s;

    z-index:100;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* ---------- LOADING ---------- */

#loading{
    position:fixed;
    inset:0;

    background:
        radial-gradient(circle at center,#27185e,#070411 70%);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    z-index:500;

    transition:.4s;
}

#loading.hide{
    opacity:0;
    pointer-events:none;
}

.loading-title{
    font-size:30px;
    font-weight:bold;

    text-shadow:
        0 0 20px #8c6cff,
        0 0 45px #4f31c8;
}

.loading-sub{
    margin-top:12px;
    color:#b9aef0;
    font-size:13px;
}

/* ---------- MODAL ---------- */

#modal{
    position:fixed;
    inset:0;

    background:rgba(3,2,13,.72);
    backdrop-filter:blur(7px);

    display:none;
    align-items:center;
    justify-content:center;

    z-index:400;
}

#modal.show{
    display:flex;
}

.modal-box{
    width:min(90vw,370px);

    padding:25px 20px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(48,34,102,.97),
            rgba(13,9,36,.98)
        );

    border:1px solid rgba(183,159,255,.28);

    text-align:center;

    box-shadow:
        0 20px 60px rgba(0,0,0,.5),
        0 0 45px rgba(107,77,230,.25);
}

.modal-icon{
    font-size:48px;
}

.modal-title{
    margin-top:10px;
    font-size:24px;
    font-weight:bold;
}

.modal-text{
    margin-top:8px;
    color:#c4bddc;
    font-size:14px;
    line-height:1.8;
}

.modal-btn{
    margin-top:18px;

    width:100%;
    height:50px;

    border:0;
    border-radius:16px;

    background:
        linear-gradient(135deg,#7655e8,#4c32a7);

    color:#fff;

    font-size:16px;
    font-weight:bold;
}

/* ---------- SMALL SCREENS ---------- */

@media(max-height:650px){

    #wordPanel{
        top:105px;
        height:180px;
        grid-auto-rows:48px;
        gap:6px;
    }

    .word-card{
        height:48px;
        font-size:14px;
    }

    #currentWord{
        top:285px;
    }

    #wheel{
        top:69%;
        width:min(70vw,290px);
        height:min(70vw,290px);
    }

    .letter{
        width:54px;
        height:54px;
        font-size:22px;
    }

    #wheelCenter{
        width:72px;
        height:72px;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<div id="game">

    <canvas id="connectionCanvas"></canvas>

    <div id="topbar">
        <button class="top-btn" id="homeBtn">⌂</button>

        <div id="stats">
            <div class="stat" id="coins">🪙 <span>0</span></div>
            <div class="stat" id="xp">⭐ <span>0</span></div>
        </div>

        <button class="top-btn" id="shopBtn">🛒</button>
    </div>

    <div id="levelInfo">
        <div id="levelTitle">مرحله ۱</div>
        <div id="difficulty">آغاز ماجراجویی</div>
    </div>

    <div id="wordPanel"></div>

    <div id="currentWord"></div>

    <div id="wheel">
        <div id="wheelCenter">کلمه‌باز</div>
    </div>

    <div id="tools">

        <button class="tool" id="hintBtn">
            💡
            <small>راهنما</small>
        </button>

        <button class="tool" id="shuffleBtn">
            🔄
            <small>چرخش</small>
        </button>

        <button class="tool" id="clearBtn">
            ✖
            <small>پاک‌کردن</small>
        </button>

    </div>

    <div id="toast"></div>

</div>

<div id="loading">
    <div class="loading-title">کلمه‌باز</div>
    <div class="loading-sub">در حال آماده‌سازی مرحله...</div>
</div>

<div id="modal">

    <div class="modal-box">

        <div class="modal-icon">✨</div>

        <div class="modal-title">
            مرحله کامل شد!
        </div>

        <div class="modal-text" id="modalText">
            آفرین! مرحله را با موفقیت تمام کردی.
        </div>

        <button class="modal-btn" id="nextBtn">
            مرحله بعد
        </button>

    </div>

</div>

<script src="levels.js"></script>

<script>
"use strict";

/* =========================================================
   DATA
========================================================= */

const LEVELS =
    window.KALAMEBAZ_LEVELS ||
    window.KalameBazLevels ||
    window.levels ||
    {};

const MAX_LEVEL =
    Number(
        window.KALAMEBAZ_TOTAL_LEVELS ||
        window.TOTAL_LEVELS ||
        1200
    );

/* =========================================================
   تعداد کلمات هر بازه
========================================================= */

function getRequiredWordCount(levelNumber){

    if(levelNumber >= 1 && levelNumber <= 100){
        return 7;
    }

    if(levelNumber >= 101 && levelNumber <= 200){
        return 5;
    }

    if(levelNumber >= 201 && levelNumber <= 300){
        return 6;
    }

    if(levelNumber >= 301 && levelNumber <= 400){
        return 7;
    }

    if(levelNumber >= 401 && levelNumber <= 1200){
        return 8;
    }

    return 7;
}

/* =========================================================
   LEVEL
========================================================= */

let level =
    parseInt(
        new URLSearchParams(location.search).get("level") || "1",
        10
    );

if(!Number.isFinite(level) || level < 1){
    level = 1;
}

if(level > MAX_LEVEL){
    level = MAX_LEVEL;
}

/* =========================================================
   PLAYER DATA
========================================================= */

const SAVE_KEY = "kalamebaz_player";

let player;

try{
    player =
        JSON.parse(
            localStorage.getItem(SAVE_KEY) || "{}"
        );
}catch(e){
    player = {};
}

if(!player || typeof player !== "object"){
    player = {};
}

if(typeof player.coins !== "number"){
    player.coins = 500;
}

if(typeof player.xp !== "number"){
    player.xp = 0;
}

if(typeof player.unlocked !== "number"){
    player.unlocked = 1;
}

if(typeof player.hints !== "number"){
    player.hints = 3;
}

/* =========================================================
   DOM
========================================================= */

const wordPanel =
    document.getElementById("wordPanel");

const wheel =
    document.getElementById("wheel");

const currentWordEl =
    document.getElementById("currentWord");

const loading =
    document.getElementById("loading");

const modal =
    document.getElementById("modal");

const modalText =
    document.getElementById("modalText");

const nextBtn =
    document.getElementById("nextBtn");

const toast =
    document.getElementById("toast");

const connectionCanvas =
    document.getElementById("connectionCanvas");

const ctx =
    connectionCanvas.getContext("2d");

const coinsEl =
    document.querySelector("#coins span");

const xpEl =
    document.querySelector("#xp span");

/* =========================================================
   STARS
========================================================= */

function createStars(){

    const stars =
        document.getElementById("stars");

    stars.innerHTML = "";

    for(let i=0;i<75;i++){

        const star =
            document.createElement("div");

        star.className = "star";

        star.style.left =
            Math.random()*100 + "%";

        star.style.top =
            Math.random()*100 + "%";

        const size =
            Math.random()*2 + 1;

        star.style.width = size + "px";
        star.style.height = size + "px";

        star.style.animationDelay =
            Math.random()*2 + "s";

        stars.appendChild(star);
    }
}

createStars();

/* =========================================================
   SAVE
========================================================= */

function savePlayer(){

    try{
        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(player)
        );
    }catch(e){}
}

function updateStats(){

    coinsEl.textContent =
        Math.max(0,Math.floor(player.coins));

    xpEl.textContent =
        Math.max(0,Math.floor(player.xp));
}

updateStats();

/* =========================================================
   GET LEVEL DATA
========================================================= */

function getLevelData(){

    let data = null;

    try{
        data = LEVELS[level];
    }catch(e){
        data = null;
    }

    if(!data && typeof window.getLevel === "function"){

        try{
            data = window.getLevel(level);
        }catch(e){}
    }

    return data;
}

let levelData = getLevelData();

if(!levelData){

    levelData = {
        words:["ماه","ابر","گل","نور"],
        difficulty:"آغاز"
    };
}

/* =========================================================
   NORMALIZER
========================================================= */

function normalizeWord(word){

    return String(word || "")
        .trim()
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/\u200c/g,"")
        .replace(/\s+/g,"");
}

/* =========================================================
   STAGE WORDS
========================================================= */

function getStageWords(){

    const required =
        getRequiredWordCount(level);

    let source = [];

    if(Array.isArray(levelData)){
        source = levelData;
    }
    else if(Array.isArray(levelData.words)){
        source = levelData.words;
    }
    else if(Array.isArray(levelData.answers)){
        source = levelData.answers;
    }
    else if(Array.isArray(levelData.wordList)){
        source = levelData.wordList;
    }

    source =
        source
            .map(normalizeWord)
            .filter(Boolean);

    source =
        [...new Set(source)];

    return source.slice(0,required);
}

let stageWords =
    getStageWords();

/* =========================================================
   DIFFICULTY
========================================================= */

function getDifficultyText(){

    if(level <= 100){
        return "جنگل جادویی";
    }

    if(level <= 200){
        return "مسیر افسون‌شده";
    }

    if(level <= 300){
        return "قلعه اسرار";
    }

    if(level <= 400){
        return "قلمرو سایه‌ها";
    }

    if(level <= 800){
        return "افسانه‌ای";
    }

    return "فوق‌العاده سخت";
}

document.getElementById("levelTitle").textContent =
    "مرحله " + level;

document.getElementById("difficulty").textContent =
    getDifficultyText();

/* =========================================================
   WORD PANEL
========================================================= */

const foundWords =
    new Set();

function renderWords(){

    wordPanel.innerHTML = "";

    stageWords.forEach(word=>{

        const card =
            document.createElement("div");

        card.className =
            "word-card";

        if(foundWords.has(word)){
            card.classList.add("found");
        }

        const letters =
            document.createElement("div");

        letters.className =
            "word-letters";

        for(const ch of word){

            const slot =
                document.createElement("div");

            slot.className =
                "word-slot";

            if(foundWords.has(word)){
                slot.textContent = ch;
            }

            letters.appendChild(slot);
        }

        card.appendChild(letters);

        wordPanel.appendChild(card);
    });
}

renderWords();

/* =========================================================
   LETTER WHEEL
========================================================= */

let letterData = [];

let selectedIndices = [];
let selectedLetters = [];

let dragging = false;
let activePointerId = null;

function getUniqueLetters(){

    const all = [];

    stageWords.forEach(word=>{

        for(const ch of word){

            if(
                ch.trim() &&
                !all.includes(ch)
            ){
                all.push(ch);
            }
        }
    });

    return all;
}

function buildWheel(){

    wheel
        .querySelectorAll(".letter")
        .forEach(el=>el.remove());

    letterData = [];

    const letters =
        getUniqueLetters();

    if(!letters.length){
        return;
    }

    const rect =
        wheel.getBoundingClientRect();

    const size =
        Math.min(rect.width,rect.height);

    const radius =
        Math.max(72,size*.34);

    const center =
        size/2;

    letters.forEach((letter,index)=>{

        const angle =
            (-Math.PI/2) +
            (index/letters.length) *
            Math.PI*2;

        const x =
            center +
            Math.cos(angle)*radius;

        const y =
            center +
            Math.sin(angle)*radius;

        const el =
            document.createElement("div");

        el.className =
            "letter";

        el.textContent =
            letter;

        el.dataset.index =
            String(index);

        el.style.left =
            x+"px";

        el.style.top =
            y+"px";

        el.addEventListener(
            "pointerdown",
            handlePointerDown,
            {passive:false}
        );

        wheel.appendChild(el);

        letterData.push({
            element:el,
            letter:letter,
            x:x,
            y:y
        });
    });

    drawLines();
}

/* =========================================================
   SELECT
========================================================= */

function selectLetter(index){

    if(index < 0 || index >= letterData.length){
        return;
    }

    if(selectedIndices.includes(index)){
        return;
    }

    selectedIndices.push(index);

    selectedLetters.push(
        letterData[index].letter
    );

    letterData[index]
        .element
        .classList.add("selected");

    currentWordEl.textContent =
        selectedLetters.join("");

    currentWordEl.classList.add("show");

    drawLines();
}

/* =========================================================
   POINTER DOWN
========================================================= */

function handlePointerDown(event){

    event.preventDefault();

    dragging = true;

    activePointerId =
        event.pointerId;

    selectedIndices = [];
    selectedLetters = [];

    clearSelectedVisual();

    const index =
        Number(event.currentTarget.dataset.index);

    selectLetter(index);

    try{
        event.currentTarget.setPointerCapture(
            event.pointerId
        );
    }catch(e){}
}

/* =========================================================
   POINTER MOVE
========================================================= */

function handlePointerMove(event){

    if(!dragging){
        return;
    }

    if(
        activePointerId !== null &&
        event.pointerId !== activePointerId
    ){
        return;
    }

    event.preventDefault();

    const rect =
        wheel.getBoundingClientRect();

    const x =
        event.clientX - rect.left;

    const y =
        event.clientY - rect.top;

    let closest = -1;
    let minDistance = Infinity;

    for(let i=0;i<letterData.length;i++){

        const data =
            letterData[i];

        const dx =
            x-data.x;

        const dy =
            y-data.y;

        const distance =
            Math.sqrt(dx*dx+dy*dy);

        if(
            distance < 43 &&
            distance < minDistance
        ){
            closest = i;
            minDistance = distance;
        }
    }

    if(closest !== -1){
        selectLetter(closest);
    }

    drawLines();
}

/* =========================================================
   FINISH
========================================================= */

function finishDrag(event){

    if(!dragging){
        return;
    }

    if(
        activePointerId !== null &&
        event.pointerId !== activePointerId
    ){
        return;
    }

    event.preventDefault();

    dragging = false;
    activePointerId = null;

    submitWord();
}

/* =========================================================
   POINTER EVENTS
========================================================= */

wheel.addEventListener(
    "pointermove",
    handlePointerMove,
    {passive:false}
);

window.addEventListener(
    "pointerup",
    finishDrag,
    {passive:false}
);

window.addEventListener(
    "pointercancel",
    finishDrag,
    {passive:false}
);

/* =========================================================
   CLEAR SELECTION
========================================================= */

function clearSelectedVisual(){

    letterData.forEach(data=>{
        data.element.classList.remove("selected");
    });
}

/* =========================================================
   CURRENT WORD
========================================================= */

function getCurrentWord(){

    return normalizeWord(
        selectedLetters.join("")
    );
}

/* =========================================================
   SUBMIT
========================================================= */

function submitWord(){

    const word =
        getCurrentWord();

    currentWordEl.classList.remove("show");

    if(!word){

        resetSelection();
        return;
    }

    const correct =
        stageWords.includes(word);

    if(correct){

        if(!foundWords.has(word)){

            foundWords.add(word);

            player.coins += 10;
            player.xp += 20;

            savePlayer();
            updateStats();

            renderWords();

            showToast(
                "✨ کلمه پیدا شد! +۱۰ سکه"
            );

        }else{

            showToast(
                "این کلمه قبلاً پیدا شده"
            );
        }

    }else{

        showToast(
            "این کلمه در مرحله نیست"
        );
    }

    resetSelection();

    checkLevelComplete();
}

/* =========================================================
   RESET
========================================================= */

function resetSelection(){

    selectedIndices = [];
    selectedLetters = [];

    clearSelectedVisual();

    currentWordEl.textContent = "";
    currentWordEl.classList.remove("show");

    drawLines();
}

/* =========================================================
   COMPLETE CHECK
========================================================= */

function checkLevelComplete(){

    if(
        stageWords.length > 0 &&
        foundWords.size >= stageWords.length
    ){
        completeLevel();
    }
}

/* =========================================================
   COMPLETE
========================================================= */

let levelCompleted = false;

function completeLevel(){

    if(levelCompleted){
        return;
    }

    levelCompleted = true;

    const reward =
        50 + level*2;

    player.coins += reward;
    player.xp += 50;

    if(
        level >= player.unlocked &&
        level < MAX_LEVEL
    ){
        player.unlocked =
            level+1;
    }

    savePlayer();
    updateStats();

    modalText.textContent =
        "مرحله "+
        level+
        " را کامل کردی! +"+
        reward+
        " سکه";

    if(level >= MAX_LEVEL){
        nextBtn.textContent =
            "پایان مراحل";
    }else{
        nextBtn.textContent =
            "مرحله بعد";
    }

    modal.classList.add("show");
}

/* =========================================================
   NEXT
========================================================= */

nextBtn.addEventListener(
    "click",
    ()=>{

        if(level >= MAX_LEVEL){

            modal.classList.remove("show");

            showToast(
                "🎉 همه مراحل را تمام کردی!"
            );

            return;
        }

        const nextLevel =
            level+1;

        location.href =
            "game.html?level="+
            nextLevel;
    }
);

/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove("show");
            },
            1700
        );
}

/* =========================================================
   HINT
========================================================= */

document
.getElementById("hintBtn")
.addEventListener(
    "click",
    ()=>{

        if(player.hints <= 0){

            if(player.coins >= 30){

                player.coins -= 30;
                player.hints += 1;

            }else{

                showToast(
                    "سکه کافی نداری"
                );

                return;
            }
        }

        const remaining =
            stageWords.filter(
                word=>!foundWords.has(word)
            );

        if(!remaining.length){
            return;
        }

        const target =
            remaining[0];

        const first =
            target[0];

        const index =
            letterData.findIndex(
                data=>data.letter===first
            );

        if(index !== -1){

            player.hints--;

            savePlayer();
            updateStats();

            showToast(
                "💡 کلمه‌ای با «"+
                first+
                "» شروع می‌شود"
            );
        }
    }
);

/* =========================================================
   SHUFFLE
========================================================= */

document
.getElementById("shuffleBtn")
.addEventListener(
    "click",
    ()=>{

        const letters =
            [...letterData]
            .map(x=>x.letter);

        letters.sort(
            ()=>Math.random()-.5
        );

        letterData.forEach(
            (data,index)=>{

                data.letter =
                    letters[index];

                data.element.textContent =
                    letters[index];
            }
        );

        resetSelection();

        showToast(
            "🔄 حروف جابه‌جا شدند"
        );
    }
);

/* =========================================================
   CLEAR
========================================================= */

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    ()=>{
        resetSelection();
    }
);

/* =========================================================
   HOME
========================================================= */

document
.getElementById("homeBtn")
.addEventListener(
    "click",
    ()=>{
        location.href =
            "index.html";
    }
);

/* =========================================================
   SHOP
========================================================= */

document
.getElementById("shopBtn")
.addEventListener(
    "click",
    ()=>{
        location.href =
            "shop.html";
    }
);

/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas(){

    connectionCanvas.width =
        window.innerWidth*
        devicePixelRatio;

    connectionCanvas.height =
        window.innerHeight*
        devicePixelRatio;

    connectionCanvas.style.width =
        window.innerWidth+"px";

    connectionCanvas.style.height =
        window.innerHeight+"px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

resizeCanvas();

window.addEventListener(
    "resize",
    ()=>{
        resizeCanvas();
        buildWheel();
    }
);

function drawLines(){

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    if(selectedIndices.length<2){
        return;
    }

    const wheelRect =
        wheel.getBoundingClientRect();

    ctx.beginPath();

    selectedIndices.forEach(
        (index,i)=>{

            const data =
                letterData[index];

            const x =
                wheelRect.left+
                data.x;

            const y =
                wheelRect.top+
                data.y;

            if(i===0){
                ctx.moveTo(x,y);
            }else{
                ctx.lineTo(x,y);
            }
        }
    );

    ctx.lineWidth=6;

    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.strokeStyle=
        "rgba(158,126,255,.8)";

    ctx.shadowBlur=15;

    ctx.shadowColor=
        "rgba(125,85,255,.8)";

    ctx.stroke();

    ctx.shadowBlur=0;
}

/* =========================================================
   START
========================================================= */

function startGame(){

    const required =
        getRequiredWordCount(level);

    if(stageWords.length>required){

        stageWords =
            stageWords.slice(
                0,
                required
            );
    }

    renderWords();

    setTimeout(
        ()=>{
            buildWheel();

            setTimeout(
                ()=>{
                    loading.classList.add("hide");
                },
                300
            );

        },
        100
    );
}

startGame();

console.log(
    "کلمه‌باز:",
    "مرحله =",level,
    "تعداد مجاز =",getRequiredWordCount(level),
    "تعداد نمایش =",stageWords.length
);

</script>

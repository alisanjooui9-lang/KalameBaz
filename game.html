<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>کلمه‌باز | بازی کلمات جادویی</title>

<script src="levels.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
    background:#090719;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
    overflow-x:hidden;
}

body{
    background:
        radial-gradient(circle at 50% 10%,rgba(125,70,255,.25),transparent 30%),
        radial-gradient(circle at 10% 80%,rgba(0,180,255,.12),transparent 30%),
        linear-gradient(160deg,#100a27,#080615 70%);
}

button{
    font-family:inherit;
    border:0;
    color:#fff;
    cursor:pointer;
}

#stars{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.7;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;transform:scale(.7)}
    to{opacity:1;transform:scale(1.4)}
}

.moon{
    position:fixed;
    top:30px;
    left:20px;
    width:65px;
    height:65px;
    border-radius:50%;
    background:linear-gradient(135deg,#fff,#bdb6ff);
    box-shadow:0 0 35px rgba(190,180,255,.5);
    z-index:0;
}

.app{
    position:relative;
    z-index:2;
    width:100%;
    max-width:560px;
    margin:auto;
    padding:12px 12px 30px;
}

.topbar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
}

.iconBtn{
    width:44px;
    height:44px;
    border-radius:15px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.1);
    font-size:20px;
}

.stats{
    flex:1;
    display:flex;
    justify-content:center;
    gap:7px;
}

.stat{
    min-width:78px;
    padding:7px 10px;
    text-align:center;
    border-radius:14px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
}

.stat small{
    display:block;
    color:#aaa5c8;
    font-size:10px;
}

.stat b{
    font-size:14px;
}

.levelTitle{
    text-align:center;
    font-size:25px;
    font-weight:900;
    margin:10px 0 4px;
}

.levelDifficulty{
    text-align:center;
    color:#bbb5d8;
    font-size:12px;
    margin-bottom:12px;
}

.progress{
    height:8px;
    background:rgba(255,255,255,.1);
    border-radius:99px;
    overflow:hidden;
    margin-bottom:14px;
}

.progressFill{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#8d5cff,#32d6ff);
    transition:.3s;
}

.wordPanel{
    display:grid;
    gap:7px;
    margin-bottom:12px;
}

.word{
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:7px;
    border-radius:15px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
}

.word.solved{
    background:rgba(65,210,150,.13);
    border-color:rgba(65,220,160,.45);
}

.wordLetter{
    width:28px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:2px solid #8c80ba;
    font-size:17px;
    font-weight:bold;
}

.word.solved .wordLetter{
    border-bottom-color:#50e4a2;
    color:#71f0b8;
}

.current{
    min-height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:10px 0 15px;
    border-radius:18px;
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.1);
    font-size:25px;
    font-weight:900;
    letter-spacing:3px;
}

.current.empty{
    color:#67627f;
    font-size:14px;
    letter-spacing:0;
}

#wheel{
    position:relative;
    width:min(88vw,390px);
    height:min(88vw,390px);
    margin:auto;
    touch-action:none;
    user-select:none;
}

.wheelGlow{
    position:absolute;
    inset:14%;
    border-radius:50%;
    background:radial-gradient(circle,rgba(120,80,255,.22),transparent 70%);
    filter:blur(15px);
}

.center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:105px;
    height:105px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:radial-gradient(circle,#34206d,#17102d);
    border:2px solid rgba(168,125,255,.5);
    box-shadow:0 0 35px rgba(125,75,255,.3);
    color:#ddd6ff;
    font-size:12px;
    pointer-events:none;
}

.letterBtn{
    position:absolute;
    transform:translate(-50%,-50%);
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#33205f,#17122e);
    border:2px solid rgba(168,130,255,.4);
    box-shadow:0 5px 20px rgba(0,0,0,.35);
    font-size:22px;
    font-weight:900;
    touch-action:none;
}

.letterBtn.active{
    transform:translate(-50%,-50%) scale(1.12);
    background:linear-gradient(145deg,#7c4cff,#3c237e);
    border-color:#c8aaff;
    box-shadow:0 0 28px rgba(145,90,255,.7);
}

.letterBtn.disabled{
    opacity:.22;
    filter:grayscale(1);
}

#connectionCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:20;
}

.tools{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:10px;
}

.tool{
    min-height:62px;
    border-radius:15px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    font-size:18px;
}

.tool small{
    display:block;
    margin-top:3px;
    color:#bdb7d8;
    font-size:10px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:10px;
}

.action{
    min-height:48px;
    border-radius:15px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    font-weight:bold;
}

.action.hint{
    background:linear-gradient(135deg,#6d42d8,#3b2781);
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(30px);
    opacity:0;
    z-index:100;
    padding:12px 18px;
    border-radius:14px;
    background:#21163d;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    transition:.3s;
    pointer-events:none;
    white-space:nowrap;
    max-width:90vw;
    overflow:hidden;
    text-overflow:ellipsis;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.modal{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(4,2,12,.78);
    backdrop-filter:blur(7px);
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(92vw,400px);
    padding:25px;
    border-radius:25px;
    text-align:center;
    background:linear-gradient(160deg,#241443,#100a22);
    border:1px solid rgba(190,150,255,.3);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.modalBox h2{
    margin:0 0 10px;
}

.modalBox p{
    color:#c7c0df;
    line-height:1.9;
}

.modalButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:18px;
}

.modalButtons button{
    min-height:48px;
    border-radius:14px;
    background:#33205f;
}

.modalButtons .next{
    background:linear-gradient(135deg,#8654ff,#4930a0);
}

#loading{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    background:#090719;
}

.loader{
    width:45px;
    height:45px;
    border:4px solid rgba(255,255,255,.12);
    border-top-color:#9a6cff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(max-width:370px){
    .stat{
        min-width:65px;
        padding:6px;
    }

    .letterBtn{
        width:48px;
        height:48px;
        font-size:20px;
    }

    .center{
        width:88px;
        height:88px;
    }

    #wheel{
        width:92vw;
        height:92vw;
    }
}
</style>
</head>

<body>

<div id="loading">
    <div style="font-size:32px">✨</div>
    <b>کلمه‌باز</b>
    <div style="color:#aaa5c8;font-size:12px">
        در حال آماده‌سازی مرحله...
    </div>
    <div class="loader"></div>
</div>

<div id="stars"></div>
<div class="moon"></div>

<canvas id="connectionCanvas"></canvas>

<div class="app">

    <div class="topbar">

        <button class="iconBtn" onclick="goHome()">🏠</button>

        <div class="stats">

            <div class="stat">
                <small>🪙 سکه</small>
                <b id="coins">0</b>
            </div>

            <div class="stat">
                <small>⭐ XP</small>
                <b id="xp">0</b>
            </div>

        </div>

        <button class="iconBtn" onclick="goShop()">🛒</button>

    </div>

    <div class="levelTitle" id="levelTitle">
        مرحله ۱
    </div>

    <div class="levelDifficulty" id="difficulty">
        آماده‌ای؟
    </div>

    <div class="progress">
        <div class="progressFill" id="progressFill"></div>
    </div>

    <div class="wordPanel" id="wordPanel"></div>

    <div id="currentWord" class="current empty">
        حروف را بکش و کلمه بساز
    </div>

    <div id="wheel">

        <div class="wheelGlow"></div>

        <div class="center">
            ✨<br>
            کلمه‌باز
        </div>

    </div>

    <div class="tools">

        <button class="tool" onclick="useLetterItem()">
            🔤
            <small>طلسم حرف</small>
            <small id="hintCount">0</small>
        </button>

        <button class="tool" onclick="useRemoveItem()">
            🧹
            <small>پاک‌کن</small>
            <small id="removeCount">0</small>
        </button>

        <button class="tool" onclick="useSolveItem()">
            💡
            <small>جواب جادویی</small>
            <small id="solveCount">0</small>
        </button>

        <button class="tool" onclick="usePotion()">
            🧪
            <small>معجون</small>
            <small id="potionCount">0</small>
        </button>

    </div>

    <div class="actions">

        <button class="action" onclick="clearSelection()">
            ↩️ پاک کردن
        </button>

        <button class="action hint" onclick="normalHint()">
            ✨ راهنمایی · ۲۰ 🪙
        </button>

    </div>

</div>

<div id="toast" class="toast"></div>

<div id="levelModal" class="modal">

    <div class="modalBox">

        <div style="font-size:45px">🏆</div>

        <h2>مرحله کامل شد!</h2>

        <p id="rewardText">
            آفرین!
        </p>

        <div class="modalButtons">

            <button onclick="goHome()">
                🏠 خانه
            </button>

            <button class="next" onclick="nextLevel()">
                مرحله بعد ➜
            </button>

        </div>

    </div>

</div>

<script>
"use strict";

/* ================================
   تنظیمات اصلی
================================ */

const TOTAL_LEVELS = 1200;

const LEVELS =
    window.KALAMEBAZ_LEVELS ||
    window.KalameBazLevels ||
    window.levels ||
    {};

let level =
    parseInt(
        new URLSearchParams(location.search).get("level") || "1",
        10
    );

if(!Number.isFinite(level) || level < 1){
    level = 1;
}

if(level > TOTAL_LEVELS){
    level = TOTAL_LEVELS;
}

/* ================================
   ابزارهای عمومی
================================ */

function normalizeWord(word){

    return String(word || "")
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ۀ/g,"ه")
        .replace(/ة/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/إ/g,"ا")
        .replace(/أ/g,"ا")
        .replace(/ٱ/g,"ا")
        .replace(/‌/g,"")
        .replace(/\u200c/g,"")
        .replace(/\u200d/g,"")
        .replace(/\s+/g,"")
        .trim();

}

const words =
    Array.isArray(LEVELS[level])
        ? LEVELS[level]
            .map(normalizeWord)
            .filter(Boolean)
        : [];

/* ================================
   وضعیت مرحله
================================ */

const stateKey =
    "kalemebaz_levelState_" + level;

let state;

try{

    state =
        JSON.parse(
            localStorage.getItem(stateKey) || "null"
        );

}catch(e){

    state = null;

}

if(!state){

    state = {
        solvedWords:[],
        revealed:{},
        wrongAttempts:0
    };

}

if(!Array.isArray(state.solvedWords)){
    state.solvedWords = [];
}

if(!state.revealed){
    state.revealed = {};
}

function saveState(){

    localStorage.setItem(
        stateKey,
        JSON.stringify(state)
    );

}

/* ================================
   عناصر صفحه
================================ */

const wheel =
    document.getElementById("wheel");

const currentWord =
    document.getElementById("currentWord");

const wordPanel =
    document.getElementById("wordPanel");

const loading =
    document.getElementById("loading");

const canvas =
    document.getElementById("connectionCanvas");

const ctx =
    canvas.getContext("2d");

let letterData = [];

let selectedIndices = [];
let selectedLetters = [];

let dragging = false;

let disabledLetters = new Set();

let bonusPotionActive = false;

let toastTimer = null;

/* ================================
   ستاره‌ها
================================ */

function createStars(){

    const box =
        document.getElementById("stars");

    for(let i=0;i<75;i++){

        const star =
            document.createElement("div");

        star.className = "star";

        star.style.left =
            Math.random()*100 + "%";

        star.style.top =
            Math.random()*100 + "%";

        star.style.animationDelay =
            Math.random()*2 + "s";

        box.appendChild(star);

    }

}

createStars();

/* ================================
   Canvas
================================ */

function resizeCanvas(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    drawConnection();

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();

/* ================================
   سکه و XP
================================ */

function getCoins(){

    return parseInt(
        localStorage.getItem("kalemebaz_coins") || "100",
        10
    );

}

function getXP(){

    return parseInt(
        localStorage.getItem("kalemebaz_xp") || "0",
        10
    );

}

function setCoins(value){

    localStorage.setItem(
        "kalemebaz_coins",
        String(Math.max(0,Math.floor(value)))
    );

}

function setXP(value){

    localStorage.setItem(
        "kalemebaz_xp",
        String(Math.max(0,Math.floor(value)))
    );

}

function addCoins(value){

    setCoins(
        getCoins() + value
    );

}

function addXP(value){

    setXP(
        getXP() + value
    );

}

/* ================================
   تعداد آیتم‌ها
================================ */

function getItem(key){

    return parseInt(
        localStorage.getItem(key) || "0",
        10
    );

}

function setItem(key,value){

    localStorage.setItem(
        key,
        String(Math.max(0,Math.floor(value)))
    );

}

/* ================================
   آمار
================================ */

function updateStats(){

    document.getElementById("coins").textContent =
        getCoins();

    document.getElementById("xp").textContent =
        getXP();

    document.getElementById("hintCount").textContent =
        getItem("kalemebaz_hintLetters");

    document.getElementById("removeCount").textContent =
        getItem("kalemebaz_removeLetters");

    document.getElementById("solveCount").textContent =
        getItem("kalemebaz_solveWords");

    document.getElementById("potionCount").textContent =
        getItem("kalemebaz_magicPotions");

}

/* ================================
   پیام
================================ */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove("show");
            },
            2200
        );

}

/* ================================
   سختی مرحله
================================ */

function getDifficulty(){

    if(level <= 100){
        return "🌱 آسان";
    }

    if(level <= 300){
        return "🌿 متوسط";
    }

    if(level <= 500){
        return "🔥 سخت";
    }

    if(level <= 800){
        return "⚡ خیلی سخت";
    }

    if(level <= 1000){
        return "👑 حرفه‌ای";
    }

    return "💀 افسانه‌ای";

}

/* ================================
   رندر کلمات
================================ */

function renderWords(){

    wordPanel.innerHTML = "";

    words.forEach(
        (word,index)=>{

            const row =
                document.createElement("div");

            const solved =
                state.solvedWords.includes(index);

            row.className =
                "word" +
                (solved ? " solved" : "");

            [...word].forEach(
                (letter,letterIndex)=>{

                    const cell =
                        document.createElement("div");

                    cell.className =
                        "wordLetter";

                    let value = "";

                    if(solved){

                        value = letter;

                    }else if(
                        state.revealed[index] &&
                        state.revealed[index][letterIndex]
                    ){

                        value = letter;

                    }

                    cell.textContent = value;

                    row.appendChild(cell);

                }
            );

            wordPanel.appendChild(row);

        }
    );

    const completed =
        state.solvedWords.length;

    const percent =
        words.length
            ? (completed / words.length) * 100
            : 0;

    document.getElementById(
        "progressFill"
    ).style.width =
        percent + "%";

}

/* ================================
   حروف موردنیاز
================================ */

function maxLetterCounts(){

    const counts = {};

    words.forEach(
        word=>{

            const local = {};

            [...word].forEach(
                letter=>{

                    local[letter] =
                        (local[letter] || 0) + 1;

                }
            );

            Object.keys(local).forEach(
                letter=>{

                    counts[letter] =
                        Math.max(
                            counts[letter] || 0,
                            local[letter]
                        );

                }
            );

        }
    );

    return counts;

}

/* ================================
   ساخت چرخ
================================ */

function buildWheel(){

    wheel
        .querySelectorAll(".letterBtn")
        .forEach(
            el=>el.remove()
        );

    letterData = [];

    const counts =
        maxLetterCounts();

    Object.keys(counts).forEach(
        letter=>{

            for(
                let i=0;
                i<counts[letter];
                i++
            ){

                letterData.push({
                    letter:letter,
                    index:letterData.length
                });

            }

        }
    );

    if(!letterData.length){
        return;
    }

    const rect =
        wheel.getBoundingClientRect();

    const size =
        Math.min(
            rect.width,
            rect.height
        );

    let buttonSize = 56;

    if(letterData.length >= 17)
        buttonSize = 51;

    if(letterData.length >= 21)
        buttonSize = 46;

    if(letterData.length >= 25)
        buttonSize = 42;

    if(letterData.length >= 29)
        buttonSize = 38;

    let radius =
        size * .35;

    if(letterData.length >= 21)
        radius = size * .38;

    if(letterData.length >= 27)
        radius = size * .40;

    letterData.forEach(
        (item,index)=>{

            const btn =
                document.createElement("button");

            btn.className =
                "letterBtn";

            btn.textContent =
                item.letter;

            btn.dataset.index =
                index;

            btn.style.width =
                buttonSize + "px";

            btn.style.height =
                buttonSize + "px";

            const angle =
                -Math.PI/2 +
                (index / letterData.length) *
                Math.PI * 2;

            const x =
                size/2 +
                Math.cos(angle)*radius;

            const y =
                size/2 +
                Math.sin(angle)*radius;

            btn.style.left =
                x + "px";

            btn.style.top =
                y + "px";

            btn.addEventListener(
                "pointerdown",
                pointerDown
            );

            wheel.appendChild(btn);

        }
    );

    applyDisabledLetters();

}

/* ================================
   فعال/غیرفعال کردن حروف
================================ */

function applyDisabledLetters(){

    letterData.forEach(
        item=>{

            const btn =
                wheel.querySelector(
                    `[data-index="${item.index}"]`
                );

            if(!btn) return;

            btn.classList.toggle(
                "disabled",
                disabledLetters.has(item.index)
            );

        }
    );

}

/* ================================
   انتخاب حروف
================================ */

function pointerDown(event){

    if(!dragging){

        dragging = true;

        selectedIndices = [];
        selectedLetters = [];

    }

    const index =
        Number(event.currentTarget.dataset.index);

    selectLetter(index);

    try{
        event.currentTarget.setPointerCapture(
            event.pointerId
        );
    }catch(e){}

}

function selectLetter(index){

    if(disabledLetters.has(index)){
        return;
    }

    if(selectedIndices.includes(index)){
        return;
    }

    selectedIndices.push(index);

    selectedLetters.push(
        letterData[index].letter
    );

    const btn =
        wheel.querySelector(
            `[data-index="${index}"]`
        );

    if(btn){
        btn.classList.add("active");
    }

    updateCurrentWord();

    drawConnection();

}

function pointerMove(event){

    if(!dragging){
        return;
    }

    const element =
        document.elementFromPoint(
            event.clientX,
            event.clientY
        );

    if(!element){
        return;
    }

    const btn =
        element.closest(".letterBtn");

    if(!btn){
        return;
    }

    const index =
        Number(btn.dataset.index);

    selectLetter(index);

}

function pointerUp(){

    if(!dragging){
        return;
    }

    dragging = false;

    submitSelectedWord();

}

document.addEventListener(
    "pointermove",
    pointerMove
);

document.addEventListener(
    "pointerup",
    pointerUp
);

document.addEventListener(
    "pointercancel",
    pointerUp
);

/* ================================
   کلمه فعلی
================================ */

function updateCurrentWord(){

    if(!selectedLetters.length){

        currentWord.textContent =
            "حروف را بکش و کلمه بساز";

        currentWord.classList.add("empty");

        return;

    }

    currentWord.classList.remove("empty");

    currentWord.textContent =
        selectedLetters.join("");

}

/* ================================
   پاک کردن انتخاب
================================ */

function clearSelection(){

    selectedIndices.forEach(
        index=>{

            const btn =
                wheel.querySelector(
                    `[data-index="${index}"]`
                );

            if(btn){
                btn.classList.remove("active");
            }

        }
    );

    selectedIndices = [];
    selectedLetters = [];

    updateCurrentWord();
    drawConnection();

}

/* ================================
   بررسی کلمه
================================ */

function submitSelectedWord(){

    if(!selectedLetters.length){
        return;
    }

    const candidate =
        normalizeWord(
            selectedLetters.join("")
        );

    const wordIndex =
        words.findIndex(
            (word,index)=>
                word === candidate &&
                !state.solvedWords.includes(index)
        );

    if(wordIndex === -1){

        state.wrongAttempts =
            (state.wrongAttempts || 0) + 1;

        saveState();

        showToast(
            "❌ این کلمه در این مرحله نیست"
        );

        clearSelection();

        return;

    }

    solveWord(wordIndex);

    clearSelection();

}

/* ================================
   حل کلمه
================================ */

function solveWord(index){

    if(state.solvedWords.includes(index)){
        return;
    }

    state.solvedWords.push(index);

    state.revealed[index] = {};

    [...words[index]].forEach(
        (_,i)=>{
            state.revealed[index][i] = true;
        }
    );

    saveState();

    const reward =
        bonusPotionActive ? 15 : 10;

    addCoins(reward);
    addXP(10);

    bonusPotionActive = false;

    renderWords();
    updateStats();

    showToast(
        `✨ درست بود! +${reward} 🪙`
    );

    if(
        state.solvedWords.length >=
        words.length
    ){

        setTimeout(
            completeLevel,
            450
        );

    }

}

/* ================================

function normalHint(){

    if(getCoins() < 20){

        showToast(
            "🪙 سکه کافی نداری!"
        );

        return;

    }

    let targetIndex = -1;

    for(
        let i=0;
        i<words.length;
        i++
    ){

        if(
            !state.solvedWords.includes(i)
        ){

            targetIndex = i;
            break;

        }

    }

    if(targetIndex === -1){
        return;
    }

    const word =
        words[targetIndex];

    if(!state.revealed[targetIndex]){
        state.revealed[targetIndex] = {};
    }

    let hidden = -1;

    for(
        let i=0;
        i<word.length;
        i++
    ){

        if(
            !state.revealed[targetIndex][i]
        ){

            hidden = i;
            break;

        }

    }

    if(hidden === -1){

        showToast(
            "✨ این کلمه تقریباً کامل شده!"
        );

        return;

    }

    setCoins(
        getCoins() - 20
    );

    state.revealed[targetIndex][hidden] =
        true;

    saveState();

    renderWords();
    updateStats();

    showToast(
        "✨ یک حرف آشکار شد!"
    );

}

function useRemoveItem(){

    const key =
        "kalemebaz_removeLetters";

    const count =
        getItem(key);

    if(count <= 0){

        showToast(
            "🧹 پاک‌کن جادویی نداری!"
        );

        return;

    }

    const usefulLetters =
        new Set();

    words.forEach(
        word=>{

            [...word].forEach(
                letter=>{
                    usefulLetters.add(letter);
                }
            );

        }
    );

    disabledLetters.clear();

    let removed = 0;

    letterData.forEach(
        item=>{

            if(
                !usefulLetters.has(
                    item.letter
                )
            ){

                disabledLetters.add(
                    item.index
                );

                removed++;

            }

        }
    );

    /*
       اصلاح اصلی:
       اگر هیچ حرف بی‌استفاده‌ای وجود نداشت،
       آیتم نباید مصرف شود.
    */

    if(removed === 0){

        showToast(
            "🧹 در این مرحله حرف بی‌استفاده‌ای برای حذف وجود ندارد."
        );

        return;

    }

    setItem(
        key,
        count - 1
    );

    applyDisabledLetters();

    updateStats();

    showToast(
        `🧹 ${removed} حرف بی‌استفاده حذف شد`
    );

}

/* ================================
   پایان مرحله
================================ */

function completeLevel(){

    const completedKey =
        "kalemebaz_completed_" + level;

    if(
        localStorage.getItem(
            completedKey
        ) === "1"
    ){

        openLevelModal();

        return;

    }

    localStorage.setItem(
        completedKey,
        "1"
    );

    const oldCompleted =
        parseInt(
            localStorage.getItem(
                "kalemebaz_completedLevels"
            ) || "0",
            10
        );

    localStorage.setItem(
        "kalemebaz_completedLevels",
        String(oldCompleted + 1)
    );

    addCoins(20);
    addXP(25);

    const currentLevel =
        parseInt(
            localStorage.getItem(
                "kalemebaz_currentLevel"
            ) || "1",
            10
        );

    if(level >= currentLevel){

        localStorage.setItem(
            "kalemebaz_currentLevel",
            String(
                Math.min(
                    TOTAL_LEVELS,
                    level + 1
                )
            )
        );

    }

    updateStats();

    openLevelModal();

}

/* ================================
   Canvas اتصال حروف
================================ */

function getButtonCenter(btn){

    const rect =
        btn.getBoundingClientRect();

    return {
        x:rect.left + rect.width/2,
        y:rect.top + rect.height/2
    };

}

function drawConnection(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(selectedIndices.length < 2){
        return;
    }

    ctx.beginPath();

    selectedIndices.forEach(
        (index,i)=>{

            const btn =
                wheel.querySelector(
                    `[data-index="${index}"]`
                );

            if(!btn){
                return;
            }

            const point =
                getButtonCenter(btn);

            if(i === 0){

                ctx.moveTo(
                    point.x,
                    point.y
                );

            }else{

                ctx.lineTo(
                    point.x,
                    point.y
                );

            }

        }
    );

    ctx.strokeStyle =
        "rgba(166,125,255,.85)";

    ctx.lineWidth = 5;

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.shadowBlur = 12;
    ctx.shadowColor =
        "rgba(130,80,255,.8)";

    ctx.stroke();

    ctx.shadowBlur = 0;

}

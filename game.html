}
.topbar{
    display:flex;

}
.iconBtn{

}
.stats{
    flex:1;

.stat{
    min-width:78px;

}

}
.progressFill{

}

    align-items:center;

    position:absolute;
    inset:14%;
    border-radius:50%;
    background:radial-gradient(circle,rgba(120,80,255,.22),rgba(0,0,0,0));

}
.center{
    position:absolute;
    left:50%;
    top:50%;

    width:105px;
    height:105px;

    justify-content:center;

    color:#ddd6ff;
    font-size:12px;
    pointer-events:none;
}
.letterBtn{
    position:absolute;
    width:56px;
    height:56px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#33205f,#17122e);
    border:2px solid rgba(168,130,255,.4);
    box-shadow:0 5px 20px rgba(0,0,0,.35),0 0 12px rgba(130,80,255,.12);

    touch-action:none;
}
.letterBtn.active{
    transform:translate(-50%,-50%) scale(1.12);
    background:linear-gradient(145deg,#7c4cff,#3c237e);
    border-color:#c8aaff;
    box-shadow:0 0 28px rgba(145,90,255,.7);
}
.letterBtn.disabled{
    opacity:.2;
    filter:grayscale(1);
}
#connectionCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:20;
}
.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:12px;
}
.action{
    min-height:48px;
    border-radius:15px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    font-weight:bold;
}
.action.hint{
    background:linear-gradient(135deg,#6d42d8,#3b2781);
}
.tools{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:10px;
}
.tool{
    min-height:62px;
    border-radius:15px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    font-size:18px;
}
.tool small{
    display:block;
    margin-top:3px;
    color:#bdb7d8;
    font-size:10px;
}
.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(30px);
    opacity:0;
    z-index:100;
    padding:12px 18px;
    border-radius:14px;
    background:#21163d;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 30px rgba(0,0,0,.4);

    text-align:center;
}
.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}
.modal{
    position:fixed;
    inset:0;
    z-index:200;

    align-items:center;
    justify-content:center;

}
.modal.show{
    display:flex;
}
.modalBox{
    width:min(92vw,400px);
    padding:25px;
    border-radius:25px;
    text-align:center;
    background:linear-gradient(160deg,#241443,#100a22);
    border:1px solid rgba(190,150,255,.3);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.modalBox h2{
    margin:0 0 10px;
}
.modalBox p{
    color:#c7c0df;

}
.modalButtons{
    display:grid;
    grid-template-columns:1fr 1fr;

}
.modalButtons button{
    min-height:48px;
    border-radius:14px;

}
.modalButtons .next{
    background:linear-gradient(135deg,#8654ff,#4930a0);
}
#loading{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    background:#090719;
}
.loader{
    width:45px;
    height:45px;
    border:4px solid rgba(255,255,255,.12);
    border-top-color:#9a6cff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}
@keyframes spin{
    to{transform:rotate(360deg)}
}
@media(max-width:370px){
    .stat{
        min-width:65px;

    }
    .letterBtn{
        width:48px;
        height:48px;
        font-size:20px;
    }
    .center{
        width:88px;
        height:88px;
    }
    #wheel{
        width:92vw;
        height:92vw;
    }
}
</style></head><body><div id="loading">

<div class="moon"></div>
<canvas id="connectionCanvas"></canvas><div class="app"><div class="topbar">
    <button class="iconBtn" onclick="goHome()">🏠</button>

    <div class="stats">
        <div class="stat">
            <small>🪙 سکه</small>

        </div>
    </div>

    <button class="iconBtn" onclick="goShop()">🛒</button>
</div>

<div class="levelTitle" id="levelTitle">مرحله ۱</div>
<div class="levelDifficulty" id="difficulty">آماده‌ای؟</div>

<div class="progress">
    <div class="progressFill" id="progressFill"></div>
</div>

<div class="attemptBox">

    حروف را بکش و کلمه بساز
</div>

    <div class="wheelGlow"></div>

    <div class="center">
        ✨<br>
        کلمه‌باز
    </div>
</div>

<div class="tools">

    <button class="tool" onclick="useLetterItem()">
        🔤
        <small>طلسم حرف</small>
        <small id="hintCount">0</small>
    </button>

    <button class="tool" onclick="useRemoveItem()">
        🧹
        <small>پاک‌کن</small>
        <small id="removeCount">0</small>
    </button>

        💡
        <small>جواب جادویی</small>
        <small id="solveCount">0</small>
    </button>

    <button class="tool" onclick="usePotion()">
        🧪
        <small>معجون</small>
        <small id="potionCount">0</small>
    </button>

</div>

    <button class="action" onclick="clearSelection()">
        ↩️ پاک کردن
    </button>

    </button>
</div>

</div><div id="toast" class="toast"></div><div id="levelModal" class="modal">
    <div class="modalBox">    <div style="font-size:45px">🏆</div>

    <h2>مرحله کامل شد!</h2>

    <p id="rewardText">آفرین!</p>

    <div class="modalButtons">
        <button onclick="goHome()">🏠 خانه</button>
        <button class="next" onclick="nextLevel()">مرحله بعد ➜</button>
    </div>

</div>

</div><script>

/* =========================================================
   KALAMEBAZ GAME ENGINE
   نسخه اصلاح‌شده
========================================================= */

const TOTAL_LEVELS = 1200;

function normalizeWord(word){
    return String(word || "")
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ۀ/g,"ه")
        .replace(/ة/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/إ/g,"ا")
        .replace(/أ/g,"ا")
        .replace(/ٱ/g,"ا")
        .replace(/‌/g,"")
        .replace(/\u200c/g,"")
        .replace(/\u200d/g,"")
        .replace(/\s+/g,"")
        .trim();
}

const LEVELS =
    window.KALAMEBAZ_LEVELS ||
    window.KalameBazLevels ||
    window.levels ||
    {};

let level =
    parseInt(new URLSearchParams(location.search).get("level")) || 1;

level = Math.max(1,Math.min(TOTAL_LEVELS,level));

const words = Array.isArray(LEVELS[level])
    ? [...new Set(LEVELS[level].map(normalizeWord).filter(Boolean))]
    : [];

const loading = document.getElementById("loading");

if(!words.length){

    loading.innerHTML = `
        <div style="font-size:45px">⚠️</div>
        <b>مرحله پیدا نشد</b>
        <div style="color:#aaa5c8;margin-top:8px">
            فایل levels.js را بررسی کنید.
        </div>
        <button onclick="goHome()" style="
            margin-top:15px;
            padding:12px 25px;
            border-radius:12px;
            background:#5632a0;
        ">بازگشت</button>
    `;

}else{

    setTimeout(()=>{
        loading.style.display = "none";
    },350);

}

/* =========================================================
   STATE
========================================================= */

const stateKey = "kalemebaz_levelState_" + level;

let state;

try{
    state = JSON.parse(
        localStorage.getItem(stateKey) || "null"
    );
}catch(e){
    state = null;
}

if(!state){

    state = {
        solvedWords:[],
        revealed:{},
        bonusWordsUsed:[],
        wrongAttempts:0
    };

}

if(!Array.isArray(state.solvedWords))
    state.solvedWords = [];

if(!Array.isArray(state.bonusWordsUsed))
    state.bonusWordsUsed = [];

if(!state.revealed)
    state.revealed = {};

if(typeof state.wrongAttempts !== "number")
    state.wrongAttempts = 0;

function saveState(){

    localStorage.setItem(
        stateKey,
        JSON.stringify(state)
    );

}

/* =========================================================
   GAME VARIABLES
========================================================= */

let selectedIndices = [];
let selectedLetters = [];
let dragging = false;
let bonusPotionActive = false;
let disabledLetters = new Set();

const MAX_WRONG_ATTEMPTS = 10;

/* =========================================================
   ELEMENTS
========================================================= */

const wheel = document.getElementById("wheel");
const currentWord = document.getElementById("currentWord");
const canvas = document.getElementById("connectionCanvas");
const ctx = canvas.getContext("2d");

/* =========================================================
   STARS
========================================================= */

function createStars(){

    const box = document.getElementById("stars");

    for(let i=0;i<75;i++){

        const star = document.createElement("div");

        star.className = "star";

        star.style.left = Math.random()*100 + "%";
        star.style.top = Math.random()*100 + "%";

        star.style.animationDelay =
            Math.random()*2 + "s";

        box.appendChild(star);

    }

}

createStars();

/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas(){

    canvas.width = innerWidth;
    canvas.height = innerHeight;

}

addEventListener("resize",resizeCanvas);
resizeCanvas();

/* =========================================================
   COINS / XP
========================================================= */

function getCoins(){

    return parseInt(
        localStorage.getItem("kalemebaz_coins") || "100"
    ) || 0;

}

function getXP(){

    return parseInt(
        localStorage.getItem("kalemebaz_xp") || "0"
    ) || 0;

}

function setCoins(value){

    localStorage.setItem(
        "kalemebaz_coins",
        String(Math.max(0,value))
    );

}

function setXP(value){

    localStorage.setItem(
        "kalemebaz_xp",
        String(Math.max(0,value))
    );

}

function updateStats(){

    document.getElementById("coins").textContent = getCoins();
    document.getElementById("xp").textContent = getXP();

    document.getElementById("hintCount").textContent =
        localStorage.getItem("kalemebaz_hintLetters") || "0";

    document.getElementById("removeCount").textContent =
        localStorage.getItem("kalemebaz_removeLetters") || "0";

    document.getElementById("solveCount").textContent =
        localStorage.getItem("kalemebaz_solveWords") || "0";

    document.getElementById("potionCount").textContent =
        localStorage.getItem("kalemebaz_magicPotions") || "0";

    document.getElementById("wrongCount").textContent =
        state.wrongAttempts;

}

/* =========================================================
   DIFFICULTY
========================================================= */

function getDifficulty(){

    if(level >= 1000) return "👑 افسانه‌ای";
    if(level >= 800) return "🔥 بسیار سخت";
    if(level >= 600) return "⚔️ سخت";
    if(level >= 400) return "🔮 متوسط رو به سخت";
    if(level >= 200) return "✨ متوسط";

    return "🌱 آسان";

}

/* =========================================================
   WORD PANEL
========================================================= */

function renderWords(){

    const panel = document.getElementById("wordPanel");

    panel.innerHTML = "";

    words.forEach(word=>{

        const box = document.createElement("div");

        box.className = "word";

        const solved =
            state.solvedWords.includes(word);

        if(solved)
            box.classList.add("solved");

        [...word].forEach(letter=>{

            const span =
                document.createElement("span");

            span.className = "wordLetter";

            span.textContent =
                solved ? letter : "•";

            box.appendChild(span);

        });

        panel.appendChild(box);

    });

    const progress =
        (state.solvedWords.length / words.length) * 100;

    document.getElementById("progressFill").style.width =
        progress + "%";

}

/* =========================================================
   LETTER COUNTS
========================================================= */

function maxLetterCounts(){

    const counts = {};

    words.forEach(word=>{

        const local = {};

        [...word].forEach(letter=>{

            local[letter] =
                (local[letter] || 0) + 1;

        });

        Object.keys(local).forEach(letter=>{

            counts[letter] =
                Math.max(
                    counts[letter] || 0,
                    local[letter]
                );

        });

    });

    return counts;

}

/* =========================================================
   WHEEL
========================================================= */

let letterData = [];

function buildWheel(){

    wheel.querySelectorAll(".letterBtn")
        .forEach(el=>el.remove());

    const counts = maxLetterCounts();

    letterData = [];

    Object.keys(counts).forEach(letter=>{

        for(let i=0;i<counts[letter];i++){

            letterData.push({
                letter,
                index:letterData.length
            });

        }

    });

    let buttonSize = 56;

    if(letterData.length >= 17)
        buttonSize = 51;

    if(letterData.length >= 21)
        buttonSize = 46;

    if(letterData.length >= 25)
        buttonSize = 42;

    if(letterData.length >= 29)
        buttonSize = 38;

    const rect = wheel.getBoundingClientRect();

    const size =
        Math.min(rect.width,rect.height);

    let radius = size * .35;

    if(letterData.length >= 21)
        radius = size * .38;

    if(letterData.length >= 27)
        radius = size * .40;

    letterData.forEach((item,i)=>{

        const btn =
            document.createElement("button");

        btn.className = "letterBtn";

        btn.textContent = item.letter;

        btn.dataset.index = i;

        btn.style.width =
            buttonSize + "px";

        btn.style.height =
            buttonSize + "px";

        const angle =
            (-Math.PI/2) +
            (i / letterData.length) *
            Math.PI*2;

        btn.style.left =
            (50 + Math.cos(angle)*35) + "%";

        btn.style.top =
            (50 + Math.sin(angle)*35) + "%";

        btn.addEventListener(
            "pointerdown",
            e=>startDrag(e,i)
        );

        wheel.appendChild(btn);

    });

}

/* =========================================================
   DRAG
========================================================= */

function startDrag(e,index){

    if(disabledLetters.has(index))
        return;

    e.preventDefault();

    dragging = true;

    selectedIndices = [];
    selectedLetters = [];

    addSelection(index);

    document.addEventListener(
        "pointermove",
        onPointerMove
    );

    document.addEventListener(
        "pointerup",
        endDrag,
        {once:true}
    );

}

function onPointerMove(e){

    if(!dragging)
        return;

    const el =
        document.elementFromPoint(
            e.clientX,
            e.clientY
        );

    if(!el || !el.classList.contains("letterBtn"))
        return;

    const index =
        parseInt(el.dataset.index);

    if(disabledLetters.has(index))
        return;

    if(!selectedIndices.includes(index))
        addSelection(index);

}

function addSelection(index){

    selectedIndices.push(index);

    selectedLetters.push(
        letterData[index].letter
    );

    const btn =
        document.querySelector(
            `.letterBtn[data-index="${index}"]`
        );

    if(btn)
        btn.classList.add("active");

    currentWord.classList.remove("empty");

    currentWord.textContent =
        selectedLetters.join("");

    drawLines();

}

function endDrag(){

    if(!dragging)
        return;

    dragging = false;

    document.removeEventListener(
        "pointermove",
        onPointerMove
    );

    const formed =
        normalizeWord(selectedLetters.join(""));

    clearSelectionVisual();

    if(formed)
        submitWord(formed);

}

/* =========================================================
   SUBMIT
========================================================= */

function submitWord(word){

    if(state.solvedWords.includes(word)){

        showToast("این کلمه قبلاً پیدا شده است.");
        return;

    }

    if(words.includes(word)){

        solveWord(word);
        return;

    }

    state.wrongAttempts++;

    saveState();
    updateStats();

    if(state.wrongAttempts >= MAX_WRONG_ATTEMPTS){

        showToast(
            "❌ تلاش‌ها تمام شد؛ از راهنمایی استفاده کن."
        );

    }else{

        showToast(
            "❌ کلمه در این مرحله نیست."
        );

    }

}

/* =========================================================
   SOLVE WORD
========================================================= */

function solveWord(word){

    if(state.solvedWords.includes(word))
        return;

    state.solvedWords.push(word);

    const reward =
        bonusPotionActive ? 20 : 10;

    setCoins(getCoins()+reward);
    setXP(getXP()+10);

    bonusPotionActive = false;

    saveState();

    renderWords();
    updateStats();

    showToast(
        `✨ درست بود! +${reward} 🪙 +10 XP`
    );

    if(state.solvedWords.length >= words.length){

        setTimeout(
            completeLevel,
            450
        );

    }

}

/* =========================================================
   COMPLETE LEVEL
========================================================= */

function completeLevel(){

    const completionKey =
        "kalemebaz_completed_" + level;

    const alreadyCompleted =
        localStorage.getItem(completionKey) === "1";

    if(!alreadyCompleted){

        localStorage.setItem(
            completionKey,
            "1"
        );

        let completed =
            parseInt(
                localStorage.getItem(
                    "kalemebaz_completedLevels"
                ) || "0"
            ) || 0;

        completed++;

        localStorage.setItem(
            "kalemebaz_completedLevels",
            String(completed)
        );

        setCoins(getCoins()+20);
        setXP(getXP()+25);

    }

    let currentLevel =
        parseInt(
            localStorage.getItem(
                "kalemebaz_currentLevel"
            ) || "1"
        ) || 1;

    if(level >= currentLevel){

        currentLevel =
            Math.min(
                TOTAL_LEVELS,
                level+1
            );

        localStorage.setItem(
            "kalemebaz_currentLevel",
            String(currentLevel)
        );

    }

    updateStats();

    document.getElementById("rewardText").textContent =
        alreadyCompleted
        ? "این مرحله قبلاً کامل شده بود."
        : "🎉 +۲۰ سکه و +۲۵ XP دریافت کردی!";

    document
        .getElementById("levelModal")
        .classList.add("show");

}

/* =========================================================
   NEXT
========================================================= */

function nextLevel(){

    if(level >= TOTAL_LEVELS){

        showToast("👑 تبریک! تمام ۱۲۰۰ مرحله را تمام کردی!");

        setTimeout(
            goHome,
            1200
        );

        return;

    }

    location.href =
        "game.html?level=" +
        (level+1);

}

/* =========================================================
   CLEAR
========================================================= */

function clearSelection(){

    selectedIndices = [];
    selectedLetters = [];

    clearSelectionVisual();

    currentWord.textContent =
        "حروف را بکش و کلمه بساز";

    currentWord.classList.add("empty");

}

function clearSelectionVisual(){

    document
        .querySelectorAll(".letterBtn.active")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    clearLines();

}

/* =========================================================
   LINE DRAWING
========================================================= */

function drawLines(){

    clearLines();

    if(selectedIndices.length < 2)
        return;

    const wheelRect =
        wheel.getBoundingClientRect();

    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(166,115,255,.8)";
    ctx.shadowBlur = 15;
    ctx.shadowColor = "rgba(145,90,255,.7)";

    ctx.beginPath();

    selectedIndices.forEach((index,i)=>{

        const btn =
            document.querySelector(
                `.letterBtn[data-index="${index}"]`
            );

        if(!btn)
            return;

        const r =
            btn.getBoundingClientRect();

        const x =
            r.left + r.width/2;

        const y =
            r.top + r.height/2;

        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);

    });

    ctx.stroke();

}

function clearLines(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}

/* =========================================================
   HINT
========================================================= */

function normalHint(){

    if(getCoins() < 20){

        showToast("🪙 سکه کافی نداری.");
        return;

    }

    const target =
        words.find(
            w=>!state.solvedWords.includes(w)
        );

    if(!target){

        showToast("همه کلمات پیدا شده‌اند.");
        return;

    }

    setCoins(getCoins()-20);

    state.revealed[target] = true;

    saveState();

    renderWords();
    updateStats();

    showToast(
        "✨ یک راهنمایی فعال شد."
    );

}

/* =========================================================
   ITEM HELPERS
========================================================= */

function getItem(key){

    return parseInt(
        localStorage.getItem(key) || "0"
    ) || 0;

}

function setItem(key,value){

    localStorage.setItem(
        key,
        String(Math.max(0,value))
    );

}

/* =========================================================
   LETTER ITEM
========================================================= */

function useLetterItem(){

    const key =
        "kalemebaz_hintLetters";

    const count =
        getItem(key);

    if(count <= 0){

        showToast("🔤 طلسم حرف نداری.");
        return;

    }

    const target =
        words.find(
            w=>!state.solvedWords.includes(w)
        );

    if(!target){

        showToast("همه کلمات پیدا شده‌اند.");
        return;

    }

    const first =
        [...target][0];

    const index =
        letterData.findIndex(
            x=>x.letter === first
        );

    if(index < 0){

        showToast("این راهنمایی در این مرحله قابل استفاده نیست.");
        return;

    }

    setItem(key,count-1);

    saveState();

    updateStats();

    showToast(
        `🔤 حرف اول یکی از کلمات: «${first}»`
    );

}

/* =========================================================
   REMOVE ITEM
========================================================= */

function useRemoveItem(){

    const key =
        "kalemebaz_removeLetters";

    const count =
        getItem(key);

    if(count <= 0){

        showToast("🧹 پاک‌کن نداری.");
        return;

    }

    const usefulLetters =
        new Set();

    words.forEach(word=>{

        if(!state.solvedWords.includes(word)){

            [...word].forEach(
                l=>usefulLetters.add(l)
            );

        }

    });

    const candidates =
        letterData
            .map((item,index)=>({
                item,
                index
            }))
            .filter(
                x=>!usefulLetters.has(x.item.letter)
            )
            .filter(
                x=>!disabledLetters.has(x.index)
            );

    if(!candidates.length){

        showToast(
            "✨ هیچ حرف بی‌استفاده‌ای برای حذف وجود ندارد."
        );

        return;
    }

    const amount =
        Math.min(
            2,
            candidates.length
        );

    for(let i=0;i<amount;i++){

        disabledLetters.add(
            candidates[i].index
        );

        const btn =
            document.querySelector(
                `.letterBtn[data-index="${candidates[i].index}"]`
            );

        if(btn)
            btn.classList.add("disabled");

    }

    setItem(key,count-1);

    updateStats();

    showToast(
        `🧹 ${amount} حرف بی‌استفاده حذف شد.`
    );

}

/* =========================================================
   SOLVE ITEM
========================================================= */

function useSolveItem(){

    const key =
        "kalemebaz_solveWords";

    const count =
        getItem(key);

    if(count <= 0){

        showToast("💡 جواب جادویی نداری.");
        return;

    }

    const target =
        words.find(
            w=>!state.solvedWords.includes(w)
        );

    if(!target){

        showToast("همه کلمات پیدا شده‌اند.");
        return;

    }

    setItem(key,count-1);

    solveWord(target);

}

/* =========================================================
   POTION
========================================================= */

function usePotion(){

    const key =
        "kalemebaz_magicPotions";

    const count =
        getItem(key);

    if(count <= 0){

        showToast("🧪 معجون نداری.");
        return;

    }

    setItem(key,count-1);

    bonusPotionActive = true;

    updateStats();

    showToast(
        "🧪 معجون فعال شد! کلمه بعدی پاداش بیشتری دارد."
    );

}

/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(()=>{
            toast.classList.remove("show");
        },2200);

}

}

}

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08051b">
<title>کلمه‌باز | بازی کلمات جادویی</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 50% 20%,#25185c 0%,#0d0927 42%,#05030f 100%);
    color:#fff;
    user-select:none;
    touch-action:none;
}

body{
    position:relative;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 20% 25%,rgba(120,80,255,.18),transparent 25%),
        radial-gradient(circle at 80% 70%,rgba(0,210,255,.12),transparent 25%);
    pointer-events:none;
}

#stars{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    opacity:.7;
    animation:twinkle 2.5s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15;transform:scale(.7)}
    to{opacity:1;transform:scale(1.5)}
}

button{
    font-family:inherit;
}

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    z-index:20;
}

.topGroup{
    display:flex;
    align-items:center;
    gap:8px;
}

.stat{
    min-width:74px;
    padding:8px 10px;
    border-radius:16px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.stat small{
    display:block;
    font-size:10px;
    color:#aaa8c9;
}

.stat strong{
    display:block;
    margin-top:2px;
    font-size:14px;
}

.iconBtn{
    width:44px;
    height:44px;
    border:0;
    border-radius:14px;
    background:rgba(255,255,255,.09);
    color:#fff;
    font-size:21px;
    border:1px solid rgba(255,255,255,.12);
}

.iconBtn:active{
    transform:scale(.94);
}

.levelHeader{
    position:absolute;
    top:78px;
    left:0;
    right:0;
    text-align:center;
    z-index:10;
}

.levelHeader h1{
    margin:0;
    font-size:24px;
    text-shadow:0 0 20px rgba(150,110,255,.7);
}

.levelHeader p{
    margin:5px 0 0;
    color:#bdb9d7;
    font-size:12px;
}

#wordPanel{
    position:absolute;
    top:135px;
    left:12px;
    right:12px;
    max-height:145px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-content:flex-start;
    gap:7px;
    overflow:hidden;
    z-index:10;
}

.wordItem{
    min-width:72px;
    padding:8px 11px;
    border-radius:12px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.1);
    color:#8e8aa8;
    font-size:13px;
    text-align:center;
    direction:rtl;
}

.wordItem.solved{
    color:#fff;
    border-color:rgba(80,220,180,.55);
    background:rgba(60,220,170,.12);
    box-shadow:0 0 18px rgba(60,220,170,.12);
}

#currentWord{
    position:absolute;
    top:285px;
    left:15px;
    right:15px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:24px;
    font-weight:bold;
    z-index:12;
    text-shadow:0 0 18px rgba(120,190,255,.8);
}

#currentWord.empty{
    color:#777391;
    font-size:13px;
    font-weight:normal;
    text-shadow:none;
}

#connectionCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
}

#wheel{
    position:absolute;
    left:50%;
    top:56%;
    width:min(88vw,390px);
    height:min(88vw,390px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(circle,
            rgba(80,55,170,.28) 0%,
            rgba(25,17,65,.5) 38%,
            rgba(10,7,30,.7) 70%,
            rgba(5,3,15,.1) 71%);
    border:1px solid rgba(150,120,255,.18);
    box-shadow:
        0 0 50px rgba(100,60,255,.13),
        inset 0 0 45px rgba(100,70,255,.08);
    z-index:8;
}

#wheel::before{
    content:"✦";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:rgba(170,150,255,.3);
    font-size:32px;
}

.letter{
    position:absolute;
    width:62px;
    height:62px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 35% 25%,#5543a7,#211858 70%);
    border:2px solid rgba(180,160,255,.3);
    box-shadow:
        0 8px 22px rgba(0,0,0,.45),
        inset 0 0 15px rgba(255,255,255,.05);
    color:#fff;
    font-size:25px;
    font-weight:bold;
    z-index:15;
    transition:.12s;
}

.letter.selected{
    background:
        radial-gradient(circle at 35% 25%,#56cfff,#2350b8 70%);
    border-color:#b7ecff;
    transform:translate(-50%,-50%) scale(1.12);
    box-shadow:
        0 0 28px rgba(60,190,255,.55),
        0 8px 25px rgba(0,0,0,.5);
}

.letter:active{
    transform:translate(-50%,-50%) scale(1.05);
}

.bottomTools{
    position:absolute;
    left:0;
    right:0;
    bottom:24px;
    display:flex;
    justify-content:center;
    gap:10px;
    z-index:30;
}

.tool{
    min-width:65px;
    height:58px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:18px;
    color:#fff;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    box-shadow:0 8px 20px rgba(0,0,0,.22);
}

.tool span{
    font-size:21px;
}

.tool small{
    color:#bbb7d0;
    font-size:9px;
}

.tool:active{
    transform:scale(.93);
}

#loading{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,#21174d,#08051a 65%,#03020b);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:999;
    transition:opacity .25s ease;
}

.loadingLogo{
    font-size:42px;
    margin-bottom:15px;
    animation:pulse 1.5s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(.95);opacity:.65}
    to{transform:scale(1.08);opacity:1}
}

.loadingTitle{
    font-size:26px;
    font-weight:bold;
}

.loadingText{
    margin-top:10px;
    color:#aaa5c5;
    font-size:13px;
}

.loader{
    width:170px;
    height:5px;
    border-radius:20px;
    background:rgba(255,255,255,.1);
    margin-top:25px;
    overflow:hidden;
}

.loader::after{
    content:"";
    display:block;
    width:45%;
    height:100%;
    border-radius:20px;
    background:#8d6cff;
    animation:load 1s infinite ease-in-out;
}

@keyframes load{
    0%{transform:translateX(230%)}
    100%{transform:translateX(-230%)}
}

#toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translate(-50%,20px);
    padding:12px 18px;
    border-radius:16px;
    background:rgba(15,10,35,.94);
    border:1px solid rgba(255,255,255,.13);
    color:#fff;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:1000;
    font-size:13px;
    white-space:nowrap;
    max-width:90vw;
    overflow:hidden;
    text-overflow:ellipsis;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:500;
    padding:25px;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(360px,100%);
    border-radius:28px;
    padding:28px 20px;
    text-align:center;
    background:
        linear-gradient(145deg,#211750,#0c0820);
    border:1px solid rgba(170,140,255,.25);
    box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.modalBox .emoji{
    font-size:50px;
}

.modalBox h2{
    margin:10px 0;
}

.modalBox p{
    color:#aaa5c5;
    font-size:13px;
}

.modalBtns{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modalBtns button{
    flex:1;
    height:48px;
    border:0;
    border-radius:15px;
    color:#fff;
    background:#332277;
    font-size:14px;
}

.modalBtns button.primary{
    background:linear-gradient(135deg,#6f4cff,#3c91ff);
}

@media(max-height:650px){

    .topbar{
        height:58px;
    }

    .levelHeader{
        top:62px;
    }

    #wordPanel{
        top:105px;
        max-height:100px;
    }

    #currentWord{
        top:215px;
    }

    #wheel{
        top:58%;
    }

    .bottomTools{
        bottom:10px;
    }
}

@media(min-width:700px){

    #wheel{
        width:430px;
        height:430px;
    }

    .letter{
        width:68px;
        height:68px;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<canvas id="connectionCanvas"></canvas>

<!-- Loading -->
<div id="loading">
    <div class="loadingLogo">✨</div>
    <div class="loadingTitle">کلمه‌باز</div>
    <div class="loadingText">در حال آماده‌سازی مرحله...</div>
    <div class="loader"></div>
</div>

<!-- نوار بالا -->
<div class="topbar">

    <div class="topGroup">

        <button class="iconBtn" onclick="goHome()">
            🏠
        </button>

        <div class="stat">
            <small>سکه</small>
            <strong>🪙 <span id="coins">0</span></strong>
        </div>

    </div>

    <div class="topGroup">

        <div class="stat">
            <small>XP</small>
            <strong>⭐ <span id="xp">0</span></strong>
        </div>

        <button class="iconBtn" onclick="goShop()">
            🛒
        </button>

    </div>

</div>

<!-- عنوان -->
<div class="levelHeader">

    <h1 id="levelTitle">
        مرحله ۱
    </h1>

    <p id="difficulty">
        ✨ آماده‌ای؟
    </p>

</div>

<!-- کلمات -->
<div id="wordPanel"></div>

<!-- کلمه انتخاب شده -->
<div id="currentWord" class="empty">
    حروف را بکش و کلمه بساز
</div>

<!-- چرخ حروف -->
<div id="wheel"></div>

<!-- ابزارها -->
<div class="bottomTools">

    <button class="tool" onclick="normalHint()">
        <span>💡</span>
        <small>راهنما</small>
    </button>

    <button class="tool" onclick="useLetterItem()">
        <span>🔤</span>
        <small>حرف</small>
    </button>

    <button class="tool" onclick="useRemoveItem()">
        <span>🧹</span>
        <small>پاک‌کن</small>
    </button>

    <button class="tool" onclick="useSolveItem()">
        <span>✨</span>
        <small>جواب</small>
    </button>

    <button class="tool" onclick="usePotion()">
        <span>🧪</span>
        <small>معجون</small>
    </button>

</div>

<!-- Toast -->
<div id="toast"></div>

<!-- پایان مرحله -->
<div id="levelModal" class="modal">

    <div class="modalBox">

        <div class="emoji">🎉</div>

        <h2>مرحله کامل شد!</h2>

        <p id="rewardText">
            پاداش دریافت شد
        </p>

        <div class="modalBtns">

            <button onclick="goHome()">
                خانه
            </button>

            <button
                class="primary"
                onclick="nextLevel()"
            >
                مرحله بعد
            </button>

        </div>

    </div>

</div>

<!-- مهم:
     levels.js باید قبل از JavaScript بازی لود شود.
     این فایل خودش TOTAL_LEVELS تعریف نمی‌کند.
-->
<script src="levels.js"></script>

<script>
"use strict";

/* =====================================================
   KALAMEBAZ GAME ENGINE
   نسخه جدید و مستقل
   ===================================================== */

const LEVELS =
    window.KALAMEBAZ_LEVELS ||
    window.KalameBazLevels ||
    window.levels ||
    {};

let level =
    parseInt(
        new URLSearchParams(location.search)
            .get("level") || "1",
        10
    );

if (!Number.isFinite(level) || level < 1) {
    level = 1;
}

/*
   از TOTAL_LEVELS داخل levels.js استفاده می‌کنیم،
   ولی دوباره آن را با const تعریف نمی‌کنیم.
*/
const GAME_MAX_LEVEL =
    Number(
        window.KALAMEBAZ_TOTAL_LEVELS ||
        window.TOTAL_LEVELS ||
        1200
    );

/* =====================================================
   وضعیت
   ===================================================== */

let words = [];

let state = {
    solvedWords: [],
    revealed: {},
    wrongAttempts: 0
};

let letterData = [];
let selectedIndices = [];
let selectedLetters = [];
let dragging = false;
let toastTimer = null;

/* =====================================================
   عناصر
   ===================================================== */

const loading =
    document.getElementById("loading");

const wheel =
    document.getElementById("wheel");

const wordPanel =
    document.getElementById("wordPanel");

const currentWord =
    document.getElementById("currentWord");

const canvas =
    document.getElementById("connectionCanvas");

const ctx =
    canvas.getContext("2d");

/* =====================================================
   نرمال‌سازی
   ===================================================== */

function normalizeWord(word){

    return String(word || "")
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ۀ/g,"ه")
        .replace(/ة/g,"ه")
        .replace(/ؤ/g,"و")
        .replace(/إ/g,"ا")
        .replace(/أ/g,"ا")
        .replace(/ٱ/g,"ا")
        .replace(/‌/g,"")
        .replace(/\u200c/g,"")
        .replace(/\u200d/g,"")
        .replace(/\s+/g,"")
        .trim();
}

/* =====================================================
   دریافت مرحله
   ===================================================== */

function loadLevel(){

    let raw = null;

    try{
        raw = LEVELS[level];
    }catch(error){
        console.error(
            "LEVEL LOAD ERROR:",
            error
        );
    }

    if(Array.isArray(raw)){

        words =
            raw
            .map(normalizeWord)
            .filter(Boolean);

    }else{

        words = [];

    }

    console.log(
        "KALAMEBAZ LEVEL:",
        level,
        words
    );
}

/* =====================================================
   ذخیره وضعیت
   ===================================================== */

function loadState(){

    const key =
        "kalemebaz_levelState_" + level;

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(key) || "null"
            );

        if(saved){

            state = saved;

        }

    }catch(error){

        console.warn(
            "STATE LOAD ERROR:",
            error
        );
    }

    if(!Array.isArray(state.solvedWords)){
        state.solvedWords = [];
    }

    if(!state.revealed){
        state.revealed = {};
    }

    if(typeof state.wrongAttempts !== "number"){
        state.wrongAttempts = 0;
    }
}

function saveState(){

    const key =
        "kalemebaz_levelState_" + level;

    try{

        localStorage.setItem(
            key,
            JSON.stringify(state)
        );

    }catch(error){

        console.warn(
            "STATE SAVE ERROR:",
            error
        );
    }
}

/* =====================================================
   ستاره‌ها
   ===================================================== */

function createStars(){

    const container =
        document.getElementById("stars");

    if(!container) return;

    for(let i=0;i<70;i++){

        const star =
            document.createElement("div");

        star.className = "star";

        star.style.left =
            Math.random()*100 + "%";

        star.style.top =
            Math.random()*100 + "%";

        star.style.animationDelay =
            Math.random()*2 + "s";

        container.appendChild(star);
    }
}

/* =====================================================
   سکه / XP
   ===================================================== */

function getCoins(){

    return parseInt(
        localStorage.getItem(
            "kalemebaz_coins"
        ) || "0",
        10
    );
}

function getXP(){

    return parseInt(
        localStorage.getItem(
            "kalemebaz_xp"
        ) || "0",
        10
    );
}

function setCoins(value){

    localStorage.setItem(
        "kalemebaz_coins",
        String(Math.max(0,Math.floor(value)))
    );
}

function setXP(value){

    localStorage.setItem(
        "kalemebaz_xp",
        String(Math.max(0,Math.floor(value)))
    );
}

function addCoins(value){
    setCoins(getCoins()+value);
}

function addXP(value){
    setXP(getXP()+value);
}

/* =====================================================
   آیتم‌ها
   ===================================================== */

function getItem(key){

    return parseInt(
        localStorage.getItem(key) || "0",
        10
    );
}

function setItem(key,value){

    localStorage.setItem(
        key,
        String(Math.max(0,Math.floor(value)))
    );
}

/* =====================================================
   بروزرسانی HUD
   ===================================================== */

function updateHUD(){

    const coins =
        document.getElementById("coins");

    const xp =
        document.getElementById("xp");

    if(coins){
        coins.textContent = getCoins();
    }

    if(xp){
        xp.textContent = getXP();
    }
}

/* =====================================================
   Toast
   ===================================================== */

function showToast(message){

    const toast =
        document.getElementById("toast");

    if(!toast) return;

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove("show");
            },
            1800
        );
}

/* =====================================================
   نمایش کلمات
   ===================================================== */

function renderWords(){

    wordPanel.innerHTML = "";

    words.forEach(word=>{

        const item =
            document.createElement("div");

        item.className =
            "wordItem";

        const solved =
            state.solvedWords
                .includes(word);

        if(solved){

            item.textContent = word;

            item.classList.add("solved");

        }else{

            item.textContent =
                Array(word.length)
                    .fill("•")
                    .join(" ");

        }

        wordPanel.appendChild(item);
    });
}

/* =====================================================
   ساخت حروف
   ===================================================== */

function getUniqueLetters(){

    const result = [];

    for(const word of words){

        for(const char of word){

            if(
                char &&
                !result.includes(char)
            ){
                result.push(char);
            }
        }
    }

    /*
       حداقل چرخ قابل استفاده
    */
    if(result.length === 1){
        result.push(result[0]);
    }

    return result;
}

function buildWheel(){

    wheel
        .querySelectorAll(".letter")
        .forEach(
            el=>el.remove()
        );

    letterData = [];

    const letters =
        getUniqueLetters();

    if(!letters.length){

        showError(
            "حروف مرحله پیدا نشد."
        );

        return;
    }

    const rect =
        wheel.getBoundingClientRect();

    const centerX =
        rect.width/2;

    const centerY =
        rect.height/2;

    const radius =
        Math.min(
            rect.width,
            rect.height
        ) * .34;

    letters.forEach(
        (letter,index)=>{

            const angle =
                index *
                Math.PI * 2 /
                letters.length -
                Math.PI/2;

            const x =
                centerX +
                Math.cos(angle)*radius;

            const y =
                centerY +
                Math.sin(angle)*radius;

            const el =
                document.createElement("div");

            el.className =
                "letter";

            el.textContent =
                letter;

            el.dataset.index =
                index;

            el.style.left =
                x + "px";

            el.style.top =
                y + "px";

            el.addEventListener(
                "pointerdown",
                onLetterDown
            );

            el.addEventListener(
                "pointerenter",
                onLetterEnter
            );

            wheel.appendChild(el);

            letterData.push({
                element:el,
                letter:letter,
                x:x,
                y:y
            });
        }
    );

    drawLines();
}

/* =====================================================
   Drag
   ===================================================== */

function onLetterDown(event){

    event.preventDefault();

    dragging = true;

    clearSelection();

    const index =
        Number(
            event.currentTarget.dataset.index
        );

    selectLetter(index);
}

function onLetterEnter(event){

    if(!dragging) return;

    const index =
        Number(
            event.currentTarget.dataset.index
        );

    selectLetter(index);
}

function selectLetter(index){

    if(!letterData[index]) return;

    if(
        selectedIndices
            .includes(index)
    ){
        return;
    }

    selectedIndices.push(index);

    selectedLetters.push(
        letterData[index].letter
    );

    letterData[index]
        .element
        .classList.add("selected");

    updateCurrentWord();

    drawLines();
}

function clearSelection(){

    selectedIndices.forEach(index=>{

        if(letterData[index]){

            letterData[index]
                .element
                .classList.remove(
                    "selected"
                );
        }
    });

    selectedIndices = [];

    selectedLetters = [];

    updateCurrentWord();

    drawLines();
}

window.addEventListener(
    "pointerup",
    ()=>{
        if(!dragging) return;

        dragging = false;

        submitWord();
    }
);

/* =====================================================
   کلمه فعلی
   ===================================================== */

function updateCurrentWord(){

    const text =
        selectedLetters.join("");

    if(text){

        currentWord.textContent =
            text;

        currentWord.classList.remove(
            "empty"
        );

    }else{

        currentWord.textContent =
            "حروف را بکش و کلمه بساز";

        currentWord.classList.add(
            "empty"
        );
    }
}

/* =====================================================
   خط اتصال
   ===================================================== */

function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

    drawLines();
}

function drawLines(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(
        selectedIndices.length < 2
    ){
        return;
    }

    const wheelRect =
        wheel.getBoundingClientRect();

    ctx.beginPath();

    selectedIndices.forEach(
        (index,pos)=>{

            const data =
                letterData[index];

            if(!data) return;

            const x =
                wheelRect.left +
                data.x;

            const y =
                wheelRect.top +
                data.y;

            if(pos===0){

                ctx.moveTo(x,y);

            }else{

                ctx.lineTo(x,y);
            }
        }
    );

    ctx.lineWidth = 7;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.strokeStyle =
        "rgba(100,210,255,.9)";

    ctx.shadowColor =
        "rgba(70,180,255,.7)";

    ctx.shadowBlur = 12;

    ctx.stroke();

    ctx.shadowBlur = 0;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

/* =====================================================
   ارسال کلمه
   ===================================================== */

function submitWord(){

    const word =
        normalizeWord(
            selectedLetters.join("")
        );

    if(!word){
        return;
    }

    if(words.includes(word)){

        if(
            !state.solvedWords
                .includes(word)
        ){

            state.solvedWords.push(word);

            saveState();

            addCoins(10);

            addXP(20);

            showToast(
                "✨ آفرین! کلمه درست بود"
            );

            renderWords();

            updateHUD();

            if(
                state.solvedWords.length >=
                words.length
            ){

                completeLevel();
            }

        }else{

            showToast(
                "این کلمه قبلاً پیدا شده"
            );
        }

    }else{

        state.wrongAttempts++;

        saveState();

        showToast(
            "❌ کلمه در این مرحله نیست"
        );
    }

    clearSelection();
}

/* =====================================================
   اتمام مرحله
   ===================================================== */

function completeLevel(){

    let completed = [];

    try{

        completed =
            JSON.parse(
                localStorage.getItem(
                    "kalemebaz_completedLevels"
                ) || "[]"
            );

    }catch(error){

        completed = [];
    }

    if(!completed.includes(level)){

        completed.push(level);

        localStorage.setItem(
            "kalemebaz_completedLevels",
            JSON.stringify(completed)
        );

        addCoins(30);

        addXP(50);
    }

    updateHUD();

    const modal =
        document.getElementById(
            "levelModal"
        );

    const reward =
        document.getElementById(
            "rewardText"
        );

    if(reward){

        reward.textContent =
            "🎁 پاداش: +۳۰ سکه و +۵۰ XP";
    }

    if(modal){

        modal.classList.add("show");
    }
}

/* =====================================================
   مرحله بعد
   ===================================================== */

function nextLevel(){

    const next =
        level + 1;

    if(
        next > GAME_MAX_LEVEL
    ){

        showToast(
            "🏆 همه مراحل را تمام کردی!"
        );

        return;
    }

    location.href =
        "game.html?level=" + next;
}

/* =====================================================
   دکمه خانه / فروشگاه
   ===================================================== */

function goHome(){
    location.href = "index.html";
}

function goShop(){
    location.href = "shop.html";
}

/* =====================================================
   راهنما
   ===================================================== */

function normalHint(){

    const cost = 20;

    if(getCoins() < cost){

        showToast(
            "🪙 برای راهنما ۲۰ سکه لازم است"
        );

        return;
    }

    const unsolved =
        words.filter(
            word =>
                !state.solvedWords
                    .includes(word)
        );

    if(!unsolved.length){
        return;
    }

    const target =
        unsolved[0];

    addCoins(-cost);

    state.revealed[target] =
        target[0];

    saveState();

    showToast(
        "💡 حرف اول: " +
        target[0]
    );

    updateHUD();
}

/* =====================================================
   آیتم حرف
   ===================================================== */

function useLetterItem(){

    const key =
        "kalemebaz_hintLetters";

    const count =
        getItem(key);

    if(count <= 0){

        showToast(
            "🔤 آیتم حرف نداری"
        );

        return;
    }

    const unsolved =
        words.filter(
            word =>
                !state.solvedWords
                    .includes(word)
        );

    if(!unsolved.length){
        return;
    }

    const target =
        unsolved[0];

    setItem(
        key,
        count-1
    );

    showToast(
        "🔤 حرف اول: " +
        target[0]
    );
}

/* =====================================================
   پاک‌کن
   ===================================================== */

function useRemoveItem(){

    const key =
        "kalemebaz_removeLetters";

    const count =
        getItem(key);

    if(count <= 0){

        showToast(
            "🧹 پاک‌کن نداری"

    );

}

/* =====================================================
   جواب
   ===================================================== */

function useSolveItem(){

    const key =
        "kalemebaz_solveWords";

    const count =
        getItem(key);

    if(count <= 0){

        showToast(
            "✨ آیتم جواب نداری"
        );

        return;
    }

    const unsolved =
        words.filter(
            word =>
                !state.solvedWords

/* =====================================================
   خطای مرحله
   ===================================================== */

function showError(message){

    loading.innerHTML = `
        <div class="loadingLogo">⚠️</div>

        <div class="loadingTitle">
            خطا در مرحله
        </div>

        <div class="loadingText">
            ${message}
        </div>

        <button
            onclick="location.reload()"
            style="
                margin-top:22px;
                padding:13px 28px;
                border:0;
                border-radius:15px;
                background:#654cff;
                color:#fff;
                font-family:inherit;
                font-size:14px;
            "
        >
            تلاش دوباره
        </button>
    `;
}

/* =====================================================
   شروع
   ===================================================== */

function initGame(){

    try{

        loadLevel();

        if(!words.length){

            showError(
                "کلمات مرحله پیدا نشدند."
            );

            return;
        }

        loadState();

        document
            .getElementById("levelTitle")
            .textContent =
            "مرحله " + level;

        renderWords();

        updateHUD();

        buildWheel();

        requestAnimationFrame(
            ()=>{
                resizeCanvas();

                loading.style.opacity =
                    "0";

                setTimeout(
                    ()=>{
                        loading.style.display =
                            "none";
                    },
                    250
                );
            }
        );

    }catch(error){

        console.error(
            "KALAMEBAZ GAME ERROR:",
            error
        );

        showError(
            "اجرای بازی با خطا مواجه شد."
        );
    }
}

/* =====================================================
   شروع نهایی
   ===================================================== */

createStars();

resizeCanvas();

if(level > GAME_MAX_LEVEL){

    level = GAME_MAX_LEVEL;
}

requestAnimationFrame(
    initGame
);

</script>

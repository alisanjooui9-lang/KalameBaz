<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>کلمه‌باز | دستاوردها</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
 user-select:none;
}

html,body{
 margin:0;
 min-height:100%;
 font-family:Tahoma,Arial,sans-serif;
 background:#080512;
 color:#fff;
}

body{
 overflow-x:hidden;
}

button{
 font-family:inherit;
 cursor:pointer;
}

#app{
 min-height:100vh;
 position:relative;
 overflow:hidden;
 padding-bottom:35px;
 background:
 radial-gradient(circle at 50% 0%,rgba(124,58,237,.28),transparent 35%),
 radial-gradient(circle at 0% 80%,rgba(34,211,238,.10),transparent 30%),
 linear-gradient(180deg,#0c0620,#160b32 55%,#080512);
}

.stars{
 position:absolute;
 inset:0;
 overflow:hidden;
 pointer-events:none;
}

.star{
 position:absolute;
 width:2px;
 height:2px;
 background:#fff;
 border-radius:50%;
 opacity:.7;
 animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
 from{
  opacity:.15;
  transform:scale(.7);
 }
 to{
  opacity:1;
  transform:scale(1.5);
 }
}

.moon{
 position:absolute;
 width:115px;
 height:115px;
 top:-38px;
 left:50%;
 transform:translateX(-50%);
 border-radius:50%;
 background:
 radial-gradient(
  circle at 35% 30%,
  #fff,
  #d8c8ff 48%,
  #8060c5
 );
 box-shadow:0 0 48px rgba(190,170,255,.5);
 opacity:.72;
}

.header{
 position:relative;
 z-index:5;
 height:72px;
 padding:10px 12px;
 padding-top:max(10px,env(safe-area-inset-top));
 display:flex;
 align-items:center;
 gap:10px;
}

.back{
 width:45px;
 height:45px;
 border-radius:15px;
 border:1px solid rgba(255,255,255,.12);
 background:rgba(20,11,42,.9);
 color:#fff;
 font-size:22px;
}

.title{
 flex:1;
 text-align:center;
}

.title h1{
 margin:0;
 font-size:19px;
 text-shadow:0 0 18px rgba(168,85,247,.8);
}

.title p{
 margin:4px 0 0;
 color:#aaa0bd;
 font-size:10px;
}

.progressBox{
 min-width:76px;
 height:42px;
 border-radius:14px;
 background:rgba(25,15,51,.9);
 border:1px solid rgba(168,85,247,.2);
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
}

.progressNumber{
 font-size:12px;
 font-weight:900;
 color:#d8b4fe;
}

.progressText{
 font-size:8px;
 color:#968aa9;
 margin-top:2px;
}

.summary{
 position:relative;
 z-index:3;
 width:calc(100% - 24px);
 max-width:600px;
 margin:10px auto 15px;
 padding:18px;
 border-radius:23px;
 background:rgba(24,14,49,.88);
 border:1px solid rgba(168,85,247,.2);
 box-shadow:0 15px 45px rgba(0,0,0,.28);
}

.summaryTop{
 display:flex;
 align-items:center;
 gap:14px;
}

.trophy{
 width:60px;
 height:60px;
 border-radius:19px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:34px;
 background:rgba(250,204,21,.10);
 border:1px solid rgba(250,204,21,.18);
}

.summaryInfo{
 flex:1;
}

.summaryInfo h2{
 margin:0;
 font-size:16px;
}

.summaryInfo p{
 margin:6px 0 0;
 color:#a99db8;
 font-size:10px;
 line-height:1.7;
}

.bar{
 height:9px;
 margin-top:14px;
 border-radius:99px;
 background:#090511;
 overflow:hidden;
 border:1px solid rgba(255,255,255,.05);
}

.barFill{
 height:100%;
 width:0%;
 border-radius:99px;
 background:linear-gradient(90deg,#7c3aed,#c084fc);
 box-shadow:0 0 15px rgba(168,85,247,.55);
 transition:width .5s;
}

.grid{
 position:relative;
 z-index:4;
 width:calc(100% - 24px);
 max-width:600px;
 margin:auto;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.achievement{
 position:relative;
 padding:15px 10px 13px;
 border-radius:20px;
 background:rgba(24,14,49,.90);
 border:1px solid rgba(255,255,255,.08);
 box-shadow:0 10px 25px rgba(0,0,0,.20);
 overflow:hidden;
}

.achievement.unlocked{
 border-color:rgba(250,204,21,.25);
 background:
 radial-gradient(
  circle at 50% 0%,
  rgba(250,204,21,.10),
  transparent 55%
 ),
 rgba(30,18,52,.94);
}

.achievement.locked{
 opacity:.55;
}

.achievement::after{
 content:"";
 position:absolute;
 width:90px;
 height:90px;
 border-radius:50%;
 background:rgba(168,85,247,.10);
 filter:blur(22px);
 top:-50px;
 left:50%;
 transform:translateX(-50%);
 pointer-events:none;
}

.achievementIcon{
 position:relative;
 z-index:2;
 width:52px;
 height:52px;
 margin:auto;
 border-radius:17px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:29px;
 background:rgba(255,255,255,.05);
 border:1px solid rgba(255,255,255,.07);
}

.unlocked .achievementIcon{
 background:rgba(250,204,21,.10);
 border-color:rgba(250,204,21,.2);
}

.achievement h3{
 position:relative;
 z-index:2;
 margin:9px 0 5px;
 text-align:center;
 font-size:12px;
}

.achievement p{
 position:relative;
 z-index:2;
 min-height:32px;
 margin:0;
 color:#a99db8;
 text-align:center;
 font-size:9px;
 line-height:1.7;
}

.status{
 position:relative;
 z-index:2;
 margin-top:9px;
 text-align:center;
 font-size:9px;
 font-weight:bold;
}

.unlocked .status{
 color:#facc15;
}

.locked .status{
 color:#81768f;
}

.reward{
 position:relative;
 z-index:2;
 margin-top:5px;
 text-align:center;
 color:#8f84a4;
 font-size:8px;
}

.footer{
 position:relative;
 z-index:3;
 width:calc(100% - 24px);
 max-width:600px;
 margin:16px auto 0;
 padding:13px;
 border-radius:17px;
 background:rgba(255,255,255,.035);
 border:1px solid rgba(255,255,255,.06);
 text-align:center;
 color:#978ca5;
 font-size:9px;
 line-height:1.8;
}

.toast{
 position:fixed;
 z-index:100;
 left:50%;
 bottom:25px;
 transform:translate(-50%,30px);
 opacity:0;
 padding:11px 17px;
 border-radius:15px;
 background:rgba(12,7,26,.97);
 border:1px solid rgba(255,255,255,.1);
 box-shadow:0 12px 35px rgba(0,0,0,.45);
 font-size:11px;
 font-weight:bold;
 transition:.25s;
 white-space:nowrap;
}

.toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

@media(max-width:360px){

 .grid{
  gap:7px;
 }

 .achievement{
  padding:12px 7px;
 }

 .achievement h3{
  font-size:11px;
 }

 .achievement p{
  font-size:8px;
 }

}

@media(min-width:700px){

 .grid{
  grid-template-columns:repeat(4,1fr);
 }

}
</style>
</head>

<body>

<div id="app">

 <div class="stars" id="stars"></div>
 <div class="moon"></div>


 <header class="header">

  <button class="back" onclick="goHome()">⌂</button>

  <div class="title">
   <h1>🏆 دستاوردها</h1>
   <p>افتخارات ماجراجویی تو</p>
  </div>

  <div class="progressBox">
   <div class="progressNumber" id="progressNumber">۰/۰</div>
   <div class="progressText">باز شده</div>
  </div>

 </header>


 <section class="summary">

  <div class="summaryTop">

   <div class="trophy">
    🏆
   </div>

   <div class="summaryInfo">

    <h2>تالار افتخارات</h2>

    <p id="summaryText">
     دستاوردها را یکی‌یکی باز کن و
     نامت را در تالار قهرمانان ثبت کن!
    </p>

   </div>

  </div>

  <div class="bar">
   <div
    class="barFill"
    id="barFill"
   ></div>
  </div>

 </section>


 <main
  class="grid"
  id="achievementGrid"
 ></main>


 <div class="footer">
  ✨ بعضی دستاوردها با ادامه بازی و رسیدن
  به مراحل بالاتر به‌صورت خودکار باز می‌شوند.
 </div>

</div>


<div
 class="toast"
 id="toast"
></div>


<script>
"use strict";


/* =========================
   اعداد فارسی
========================= */

function faNumber(value){

 return String(value).replace(
  /\d/g,
  d=>"۰۱۲۳۴۵۶۷۸۹"[d]
 );

}


/* =========================
   اطلاعات بازیکن
========================= */

function getCompleted(){

 return Number(
  localStorage.getItem(
   "kalemebaz_completedLevels"
  )
 ) || 0;

}


function getCurrentLevel(){

 return Number(
  localStorage.getItem(
   "kalemebaz_currentLevel"
  )
 ) || 1;

}


function getXP(){

 return Number(
  localStorage.getItem(
   "kalemebaz_xp"
  )
 ) || 0;

}


function getCoins(){

 return Number(
  localStorage.getItem(
   "kalemebaz_coins"
  )
 ) || 0;

}


/* =========================
   دستاوردها
========================= */

const achievements = [

 {
  id:"first",
  icon:"🌱",
  title:"شروع ماجراجویی",
  desc:"اولین مرحله را کامل کن.",
  reward:"🪙 ۱۰ سکه",
  type:"completed",
  target:1
 },

 {
  id:"five",
  icon:"⭐",
  title:"شاگرد جادوگر",
  desc:"۵ مرحله را کامل کن.",
  reward:"🪙 ۲۰ سکه",
  type:"completed",
  target:5
 },

 {
  id:"ten",
  icon:"🗺️",
  title:"کاوشگر جنگل",
  desc:"۱۰ مرحله را کامل کن.",
  reward:"🪙 ۳۰ سکه",
  type:"completed",
  target:10
 },

 {
  id:"twentyfive",
  icon:"🏹",
  title:"ردیاب کلمات",
  desc:"۲۵ مرحله را کامل کن.",
  reward:"⭐ ۵۰ XP",
  type:"completed",
  target:25
 },

 {
  id:"fifty",
  icon:"🧙",
  title:"جادوگر تازه‌کار",
  desc:"۵۰ مرحله را کامل کن.",
  reward:"🪙 ۷۵ سکه",
  type:"completed",
  target:50
 },

 {
  id:"hundred",
  icon:"🏰",
  title:"قهرمان قلعه",
  desc:"۱۰۰ مرحله را کامل کن.",
  reward:"⭐ ۱۵۰ XP",
  type:"completed",
  target:100
 },

 {
  id:"twohundred",
  icon:"🔥",
  title:"شکارچی کلمات",
  desc:"۲۰۰ مرحله را کامل کن.",
  reward:"🪙 ۲۰۰ سکه",
  type:"completed",
  target:200
 },

 {
  id:"fivehundred",
  icon:"👑",
  title:"پادشاه کلمات",
  desc:"۵۰۰ مرحله را کامل کن.",
  reward:"⭐ ۵۰۰ XP",
  type:"completed",
  target:500
 },

 {
  id:"thousand",
  icon:"🌌",
  title:"افسانه کلمه‌باز",
  desc:"۱۰۰۰ مرحله را کامل کن.",
  reward:"🪙 ۱۰۰۰ سکه",
  type:"completed",
  target:1000
 },

 {
  id:"legend",
  icon:"💫",
  title:"قهرمان افسانه‌ای",
  desc:"تمام ۱۲۰۰ مرحله را کامل کن.",
  reward:"👑 عنوان ویژه",
  type:"completed",
  target:1200
 },

 {
  id:"xp100",
  icon:"⚡",
  title:"انرژی جادویی",
  desc:"به ۱۰۰ XP برس.",
  reward:"🪙 ۳۰ سکه",
  type:"xp",
  target:100
 },

 {
  id:"xp500",
  icon:"🔮",
  title:"قدرت جادو",
  desc:"به ۵۰۰ XP برس.",
  reward:"🪙 ۷۵ سکه",
  type:"xp",
  target:500
 },

 {
  id:"xp1000",
  icon:"🌟",
  title:"نیروی ستاره‌ها",
  desc:"به ۱۰۰۰ XP برس.",
  reward:"🪙 ۱۵۰ سکه",
  type:"xp",
  target:1000
 },

 {
  id:"coins500",
  icon:"💰",
  title:"خزانه‌دار",
  desc:"موجودی‌ات به ۵۰۰ سکه برسد.",
  reward:"⭐ ۱۰۰ XP",
  type:"coins",
  target:500
 },

 {
  id:"coins1000",
  icon:"💎",
  title:"گنجینه سلطنتی",
  desc:"موجودی‌ات به ۱۰۰۰ سکه برسد.",
  reward:"⭐ ۲۵۰ XP",
  type:"coins",
  target:1000
 }

];


/* =========================
   وضعیت دستاورد
========================= */

function isUnlocked(item){

 if(item.type === "completed"){

  return getCompleted() >= item.target;

 }

 if(item.type === "xp"){

  return getXP() >= item.target;

 }

 if(item.type === "coins"){

  return getCoins() >= item.target;

 }

 return false;

}


/* =========================
   مقدار پیشرفت
========================= */

function getValue(item){

 if(item.type === "completed"){
  return getCompleted();
 }

 if(item.type === "xp"){
  return getXP();
 }

 if(item.type === "coins"){
  return getCoins();
 }

 return 0;

}


/* =========================
   ساخت کارت‌ها
========================= */

function renderAchievements(){

 const grid =
  document.getElementById(
   "achievementGrid"
  );

 grid.innerHTML = "";


 let unlockedCount = 0;


 achievements.forEach(item=>{

  const unlocked =
   isUnlocked(item);

  if(unlocked){
   unlockedCount++;
  }


  const value =
   getValue(item);


  const article =
   document.createElement(
    "article"
   );

  article.className =
   "achievement " +
   (unlocked ? "unlocked" : "locked");


  let progressText;


  if(unlocked){

   progressText =
    "✓ باز شده";

  }else{

   progressText =
    faNumber(
     Math.min(value,item.target)
    ) +
    " / " +
    faNumber(item.target);

  }


  article.innerHTML = `

   <div class="achievementIcon">
    ${unlocked ? item.icon : "🔒"}
   </div>

   <h3>
    ${item.title}
   </h3>

   <p>
    ${item.desc}
   </p>

   <div class="status">
    ${progressText}
   </div>

   <div class="reward">
    پاداش: ${item.reward}
   </div>

  `;


  grid.appendChild(article);

 });


 updateSummary(
  unlockedCount
 );

}


/* =========================
   خلاصه
========================= */

function updateSummary(count){

 const total =
  achievements.length;


 const percent =
  Math.round(
   (count / total) * 100
  );


 document.getElementById(
  "progressNumber"
 ).textContent =
  faNumber(count) +
  "/" +
  faNumber(total);


 document.getElementById(
  "barFill"
 ).style.width =
  percent + "%";


 let text;


 if(count === 0){

  text =
   "ماجراجویی تازه شروع شده! اولین دستاوردت را باز کن.";

 }else if(
  count < Math.ceil(total/3)
 ){

  text =
   "عالیه! هنوز دستاوردهای زیادی منتظر تو هستند.";

 }else if(
  count < Math.ceil(total*2/3)
 ){

  text =
   "داری تبدیل به یک قهرمان واقعی می‌شوی!";

 }else if(
  count < total
 ){

  text =
   "تقریباً همه افتخارات را به دست آورده‌ای!";

 }else{

  text =
   "👑 افسانه‌ای شدی! تمام دستاوردها را باز کردی.";

 }


 document.getElementById(
  "summaryText"
 ).textContent =
  text;

}


/* =========================
   ستاره‌ها
========================= */

function createStars(){

 const box =
  document.getElementById(
   "stars"
  );

 box.innerHTML = "";


 for(let i=0;i<85;i++){

  const star =
   document.createElement(
    "div"
   );

  star.className =
   "star";

  star.style.left =
   Math.random()*100 + "%";

  star.style.top =
   Math.random()*100 + "%";

  const size =
   Math.random()*2 + 1;

  star.style.width =
   size + "px";

  star.style.height =
   size + "px";

  star.style.animationDelay =
   Math.random()*2 + "s";

  box.appendChild(
   star
  );

 }

}


/* =========================
   تنظیمات مشترک
========================= */

function applySettings(){

 let settings = {};

 try{

  settings =
   JSON.parse(
    localStorage.getItem(
     "kalemebaz_settings"
    ) || "{}"
   );

 }catch(error){

  settings = {};

 }


 if(
  settings.brightness !== undefined
 ){

  const brightness =
   Number(
    settings.brightness
   );

  if(
   Number.isFinite(brightness) &&
   brightness > 0
  ){

   document.body.style.filter =
    `brightness(${brightness}%)`;

  }

 }


 if(settings.stars === false){

  document.getElementById(
   "stars"
  ).style.display =
   "none";

 }

}


/* =========================
   خانه
========================= */

function goHome(){

 location.href =
  "index.html";

}


/* =========================
   شروع
========================= */

createStars();

renderAchievements();

applySettings();

</script>

</body>
</html>

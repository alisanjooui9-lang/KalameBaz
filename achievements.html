<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>کلمه‌باز | دستاوردها</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Tahoma,Arial,sans-serif;
  color:#fff;
  background:#080518;
}

body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 10%,rgba(140,75,255,.28),transparent 30%),
    linear-gradient(180deg,#12062e,#080518 65%,#04020b);
}

#stars{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 8px white;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.2}
  to{opacity:1}
}

.moon{
  position:fixed;
  top:35px;
  left:22px;
  width:110px;
  height:110px;
  border-radius:50%;
  background:#fff;
  opacity:.85;
  box-shadow:0 0 35px rgba(255,255,255,.55);
  z-index:0;
}

.moon:after{
  content:"";
  position:absolute;
  left:28px;
  top:-7px;
  width:110px;
  height:110px;
  border-radius:50%;
  background:#12062e;
}

.container{
  position:relative;
  z-index:2;
  width:min(94%,600px);
  margin:auto;
  padding:18px 0 45px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.topbar h1{
  margin:0;
  font-size:22px;
}

.back{
  border:0;
  color:white;
  background:rgba(255,255,255,.08);
  padding:10px 15px;
  border-radius:14px;
  font-size:14px;
}

.summary{
  padding:20px;
  border-radius:24px;
  background:linear-gradient(
    145deg,
    rgba(104,53,181,.48),
    rgba(20,9,49,.92)
  );
  border:1px solid rgba(201,159,255,.25);
  box-shadow:0 15px 45px rgba(0,0,0,.4);
}

.summary-title{
  color:#d8bfff;
  font-size:13px;
}

.summary-number{
  margin-top:8px;
  font-size:31px;
  font-weight:bold;
}

.summary-desc{
  margin-top:6px;
  color:#aaa0b9;
  font-size:11px;
}

.progress{
  margin-top:17px;
  height:10px;
  border-radius:20px;
  overflow:hidden;
  background:rgba(0,0,0,.4);
}

.progress-fill{
  height:100%;
  width:0%;
  border-radius:20px;
  background:linear-gradient(90deg,#7c42d5,#c18aff);
  box-shadow:0 0 14px rgba(184,115,255,.7);
  transition:1s;
}

.progress-text{
  margin-top:7px;
  text-align:left;
  color:#bcb0ca;
  font-size:10px;
}

.section-title{
  margin:25px 4px 12px;
  font-size:18px;
}

.achievement{
  position:relative;
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:10px;
  padding:15px;
  border-radius:20px;
  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.08);
  overflow:hidden;
}

.achievement.unlocked{
  border-color:rgba(192,139,255,.35);
  background:linear-gradient(
    135deg,
    rgba(105,55,175,.25),
    rgba(255,255,255,.05)
  );
}

.achievement.locked{
  opacity:.55;
}

.achievement-icon{
  flex:0 0 55px;
  width:55px;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:17px;
  font-size:28px;
  background:rgba(0,0,0,.28);
}

.unlocked .achievement-icon{
  box-shadow:0 0 20px rgba(169,100,255,.25);
}

.achievement-info{
  min-width:0;
  flex:1;
}

.achievement-name{
  font-size:14px;
  font-weight:bold;
}

.achievement-description{
  margin-top:5px;
  color:#9e94aa;
  font-size:10px;
  line-height:1.7;
}

.reward{
  margin-top:7px;
  color:#e0c8ff;
  font-size:10px;
}

.status{
  flex:0 0 auto;
  padding:7px 9px;
  border-radius:11px;
  font-size:9px;
  font-weight:bold;
  background:rgba(255,255,255,.08);
  color:#a59aac;
}

.unlocked .status{
  color:#fff;
  background:#7040b8;
}

.reward-box{
  margin-top:18px;
  padding:14px;
  border-radius:17px;
  text-align:center;
  color:#c8b6d9;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);
  font-size:11px;
  line-height:1.8;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(100px);
  z-index:50;
  min-width:250px;
  max-width:90%;
  padding:14px 18px;
  border-radius:16px;
  background:#180d2d;
  border:1px solid rgba(196,146,255,.35);
  text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.55);
  opacity:0;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:380px){
  .achievement{
    gap:9px;
    padding:12px;
  }

  .achievement-icon{
    flex-basis:48px;
    width:48px;
    height:48px;
    font-size:24px;
  }

  .status{
    padding:6px;
    font-size:8px;
  }
}
</style>
</head>

<body>

<div id="stars"></div>
<div class="moon"></div>

<div class="container">

  <div class="topbar">
    <button class="back" onclick="location.href='index.html'">
      ← خانه
    </button>

    <h1>🏆 دستاوردها</h1>
  </div>

  <section class="summary">

    <div class="summary-title">
      ✨ تالار افتخارات
    </div>

    <div class="summary-number" id="unlockedCount">
      0 / 15
    </div>

    <div class="summary-desc">
      با پیشرفت در سرزمین کلمات، دستاوردهای بیشتری باز کن.
    </div>

    <div class="progress">
      <div
        class="progress-fill"
        id="achievementProgress">
      </div>
    </div>

    <div
      class="progress-text"
      id="progressText">
      0٪
    </div>

  </section>

  <h2 class="section-title">
    🏅 دستاوردهای تو
  </h2>

  <div id="achievementList"></div>

  <div class="reward-box">
    🎁 پاداش هر دستاورد فقط یک بار به حساب بازیکن اضافه می‌شود.
    <br>
    اطلاعات پاداش‌ها نیز در حافظه بازی ذخیره می‌شوند.
  </div>

</div>

<div class="toast" id="toast"></div>

<script>

/* =====================================================
   ابزارهای ذخیره‌سازی
===================================================== */

function getNumber(key, fallback=0){

  const value =
    parseInt(
      localStorage.getItem(key),
      10
    );

  return Number.isFinite(value)
    ? value
    : fallback;
}


function setNumber(key,value){

  localStorage.setItem(
    key,
    String(Math.max(0,Math.floor(value)))
  );

}


/* =====================================================
   لیست دستاوردها
===================================================== */

const achievements = [

  {
    id:"level_1",
    icon:"🌱",
    name:"شروع ماجراجویی",
    description:"اولین مرحله را کامل کن.",
    reward:"🪙 25 سکه",
    check:()=>getNumber("kalemebaz_completedLevels") >= 1,
    give:()=>{
      addCoins(25);
    }
  },

  {
    id:"level_5",
    icon:"🔥",
    name:"شروع قدرتمند",
    description:"۵ مرحله را کامل کن.",
    reward:"🪙 50 سکه + ✨ 20 XP",
    check:()=>getNumber("kalemebaz_completedLevels") >= 5,
    give:()=>{
      addCoins(50);
      addXP(20);
    }
  },

  {
    id:"level_10",
    icon:"⚔️",
    name:"جنگجوی کلمات",
    description:"۱۰ مرحله را کامل کن.",
    reward:"🪙 75 سکه + ✨ 30 XP",
    check:()=>getNumber("kalemebaz_completedLevels") >= 10,
    give:()=>{
      addCoins(75);
      addXP(30);
    }
  },

  {
    id:"level_25",
    icon:"🗺️",
    name:"کاوشگر",
    description:"۲۵ مرحله را کامل کن.",
    reward:"🪙 100 سکه + ✨ 50 XP",
    check:()=>getNumber("kalemebaz_completedLevels") >= 25,
    give:()=>{
      addCoins(100);
      addXP(50);
    }
  },

  {
    id:"level_50",
    icon:"🏰",
    name:"دروازه قلعه",
    description:"۵۰ مرحله را کامل کن.",
    reward:"🪙 150 سکه + 🔤 1 طلسم حرف",
    check:()=>getNumber("kalemebaz_completedLevels") >= 50,
    give:()=>{
      addCoins(150);
      addItem("kalemebaz_hintLetters",1);
    }
  },

  {
    id:"level_100",
    icon:"🧙",
    name:"جادوگر کلمات",
    description:"۱۰۰ مرحله را کامل کن.",
    reward:"🪙 200 سکه + ✨ 100 XP",
    check:()=>getNumber("kalemebaz_completedLevels") >= 100,
    give:()=>{
      addCoins(200);
      addXP(100);
    }
  },

  {
    id:"level_200",
    icon:"💎",
    name:"استاد جادویی",
    description:"۲۰۰ مرحله را کامل کن.",
    reward:"🪙 300 سکه + 🧹 1 پاک‌کن جادویی",
    check:()=>getNumber("kalemebaz_completedLevels") >= 200,
    give:()=>{
      addCoins(300);
      addItem("kalemebaz_removeLetters",1);
    }
  },

  {
    id:"level_500",
    icon:"👑",
    name:"قهرمان قلعه",
    description:"۵۰۰ مرحله را کامل کن.",
    reward:"🪙 500 سکه + 💡 1 جواب جادویی",
    check:()=>getNumber("kalemebaz_completedLevels") >= 500,
    give:()=>{
      addCoins(500);
      addItem("kalemebaz_solveWords",1);
    }
  },

  {
    id:"level_1000",
    icon:"🌌",
    name:"افسانه سرزمین کلمات",
    description:"۱۰۰۰ مرحله را کامل کن.",
    reward:"🪙 1000 سکه + ✨ 250 XP",
    check:()=>getNumber("kalemebaz_completedLevels") >= 1000,
    give:()=>{
      addCoins(1000);
      addXP(250);
    }
  },

  {
    id:"level_1200",
    icon:"👑",
    name:"افسانه بزرگ",
    description:"تمام ۱۲۰۰ مرحله را کامل کن.",
    reward:"🪙 2000 سکه + 🧪 3 معجون جادویی",
    check:()=>getNumber("kalemebaz_completedLevels") >= 1200,
    give:()=>{
      addCoins(2000);
      addItem("kalemebaz_magicPotions",3);
    }
  },

  {
    id:"xp_100",
    icon:"⭐",
    name:"جرقه تجربه",
    description:"به ۱۰۰ XP برس.",
    reward:"🪙 75 سکه",
    check:()=>getNumber("kalemebaz_xp") >= 100,
    give:()=>{
      addCoins(75);
    }
  },

  {
    id:"xp_500",
    icon:"✨",
    name:"انرژی جادویی",
    description:"به ۵۰۰ XP برس.",
    reward:"🪙 150 سکه",
    check:()=>getNumber("kalemebaz_xp") >= 500,
    give:()=>{
      addCoins(150);
    }
  },

  {
    id:"xp_1000",
    icon:"🔮",
    name:"هسته جادو",
    description:"به ۱۰۰۰ XP برس.",
    reward:"🧪 1 معجون جادویی",
    check:()=>getNumber("kalemebaz_xp") >= 1000,
    give:()=>{
      addItem("kalemebaz_magicPotions",1);
    }
  },

  {
    id:"coins_500",
    icon:"🪙",
    name:"گنج‌یاب",
    description:"موجودی سکه‌هایت به ۵۰۰ برسد.",
    reward:"🪙 100 سکه",
    check:()=>getNumber("kalemebaz_coins",100) >= 500,
    give:()=>{
      addCoins(100);
    }
  },

  {
    id:"coins_1000",
    icon:"💰",
    name:"خزانه‌دار",
    description:"موجودی سکه‌هایت به ۱۰۰۰ برسد.",
    reward:"🪙 250 سکه",
    check:()=>getNumber("kalemebaz_coins",100) >= 1000,
    give:()=>{
      addCoins(250);
    }
  }

];


/* =====================================================
   پاداش‌های دریافت‌شده
===================================================== */

function getClaimed(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          "kalemebaz_claimedAchievements"
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch(e){

    return [];

  }

}


function saveClaimed(list){

  localStorage.setItem(
    "kalemebaz_claimedAchievements",
    JSON.stringify(list)
  );

}


/* =====================================================
   سکه
===================================================== */

function addCoins(amount){

  const coins =
    getNumber("kalemebaz_coins",100);

  setNumber(
    "kalemebaz_coins",
    coins + amount
  );

}


/* =====================================================
   XP
===================================================== */

function addXP(amount){

  const xp =
    getNumber("kalemebaz_xp",0);

  setNumber(
    "kalemebaz_xp",
    xp + amount
  );

}


/* =====================================================
   آیتم‌ها
===================================================== */

function addItem(key,amount){

  const count =
    getNumber(key,0);

  setNumber(
    key,
    count + amount
  );

}


/* =====================================================
   بررسی و پرداخت پاداش
===================================================== */

function processAchievements(){

  let claimed =
    getClaimed();

  const newlyUnlocked = [];

  achievements.forEach(achievement=>{

    const unlocked =
      achievement.check();

    const alreadyClaimed =
      claimed.includes(
        achievement.id
      );

    /*
      اگر باز شده ولی قبلاً پاداش نگرفته،
      پاداش را بده.
    */

    if(unlocked && !alreadyClaimed){

      achievement.give();

      claimed.push(
        achievement.id
      );

      newlyUnlocked.push(
        achievement
      );

    }

  });

  saveClaimed(claimed);

  return newlyUnlocked;

}


/* =====================================================
   نمایش دستاوردها
===================================================== */

function render(){

  const list =
    document.getElementById(
      "achievementList"
    );

  list.innerHTML = "";

  const claimed =
    getClaimed();

  let unlockedCount = 0;

  achievements.forEach(achievement=>{

    const unlocked =
      achievement.check();

    const received =
      claimed.includes(
        achievement.id
      );

    if(unlocked){
      unlockedCount++;
    }

    const card =
      document.createElement("div");

    card.className =
      "achievement " +
      (unlocked ? "unlocked" : "locked");

    card.innerHTML = `

      <div class="achievement-icon">
        ${achievement.icon}
      </div>

      <div class="achievement-info">

        <div class="achievement-name">
          ${achievement.name}
        </div>

        <div class="achievement-description">
          ${achievement.description}
        </div>

        <div class="reward">
          🎁 ${achievement.reward}
        </div>

      </div>

      <div class="status">
        ${
          received
          ? "دریافت شد"
          : unlocked
          ? "باز شد"
          : "قفل"
        }
      </div>

    `;

    list.appendChild(card);

  });

  const total =
    achievements.length;

  const percent =
    Math.round(
      (unlockedCount / total) * 100
    );

  document.getElementById(
    "unlockedCount"
  ).textContent =
    unlockedCount +
    " / " +
    total;

  document.getElementById(
    "achievementProgress"
  ).style.width =
    percent + "%";

  document.getElementById(
    "progressText"
  ).textContent =
    percent + "٪";

}


/* =====================================================
   ستاره‌ها
===================================================== */

function createStars(){

  const box =
    document.getElementById("stars");

  for(let i=0;i<90;i++){

    const star =
      document.createElement("div");

    star.className = "star";

    star.style.left =
      Math.random()*100 + "%";

    star.style.top =
      Math.random()*100 + "%";

    star.style.animationDelay =
      Math.random()*3 + "s";

    const size =
      Math.random()*2 + 1;

    star.style.width =
      size + "px";

    star.style.height =
      size + "px";

    box.appendChild(star);

  }

}


/* =====================================================
   پیام
===================================================== */

function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(()=>{

      toast.classList.remove("show");

    },3500);

}


/* =====================================================
   تنظیمات مشترک
===================================================== */

function applySettings(){

  try{

    const settings =
      JSON.parse(
        localStorage.getItem(
          "kalemebaz_settings"
        ) || "{}"
      );

    const brightness =
      Number(
        settings.brightness || 100
      );

    document.body.style.filter =
      `brightness(${brightness}%)`;

    if(settings.stars === false){

      document.getElementById(
        "stars"
      ).style.display = "none";

    }

    if(settings.theme === "blue"){

      document.body.style.background =
        "radial-gradient(circle at 50% 10%,rgba(40,110,255,.3),transparent 30%),linear-gradient(180deg,#06152e,#050817,#02040b)";

    }

    if(settings.theme === "forest"){

      document.body.style.background =
        "radial-gradient(circle at 50% 10%,rgba(30,150,90,.28),transparent 30%),linear-gradient(180deg,#061e18,#06100e,#020706)";

    }

  }catch(e){}

}


/* =====================================================
   شروع صفحه
===================================================== */

createStars();

applySettings();

/*
  مهم:
  اینجا پاداش‌ها بررسی می‌شوند.
  هر پاداش فقط یک بار ثبت می‌شود.
*/

const newlyUnlocked =
  processAchievements();

render();


/* نمایش پاداش جدید */

if(newlyUnlocked.length > 0){

  setTimeout(()=>{

    const first =
      newlyUnlocked[0];

    showToast(
      "🎉 دستاورد «" +
      first.name +
      "» باز شد! پاداش دریافت شد."
    );

  },500);

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>پروفایل | کلمه‌باز</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% 0%,rgba(130,80,255,.25),transparent 30%),
        linear-gradient(160deg,#110a28,#070512 75%);
}

button{
    font-family:inherit;
    color:#fff;
    border:0;
}

.app{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:15px 13px 35px;
}

.top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.back{
    width:44px;
    height:44px;
    border-radius:14px;
    background:rgba(255,255,255,.08);
    font-size:20px;
}

.title{
    flex:1;
    text-align:center;
}

.title h1{
    margin:0;
    font-size:21px;
}

.title small{
    color:#9891ae;
    font-size:9px;
}

.profileCard{
    text-align:center;
    padding:25px 18px;
    border-radius:26px;
    background:
        radial-gradient(circle at 50% 0%,rgba(155,100,255,.25),transparent 60%),
        rgba(255,255,255,.06);
    border:1px solid rgba(190,150,255,.2);
}

.avatar{
    width:90px;
    height:90px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:linear-gradient(145deg,#8754ff,#321b6b);
    border:3px solid rgba(255,255,255,.2);
    box-shadow:0 0 35px rgba(125,70,255,.35);
    font-size:45px;
}

.name{
    margin:13px 0 4px;
    font-size:20px;
}

.rank{
    color:#b7add0;
    font-size:11px;
}

.levelBox{
    margin-top:18px;
    padding:13px;
    border-radius:17px;
    background:rgba(0,0,0,.18);
}

.levelTop{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    color:#b8b0ca;
    margin-bottom:7px;
}

.bar{
    height:9px;
    border-radius:99px;
    overflow:hidden;
    background:rgba(255,255,255,.09);
}

.fill{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#9b63ff,#39d8ff);
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:12px;
}

.stat{
    padding:14px 5px;
    text-align:center;
    border-radius:17px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.08);
}

.stat span{
    display:block;
    font-size:21px;
    margin-bottom:5px;
}

.stat b{
    display:block;
    font-size:13px;
}

.stat small{
    display:block;
    margin-top:4px;
    color:#858099;
    font-size:8px;
}

.section{
    margin-top:17px;
}

.section h2{
    font-size:14px;
    margin:0 0 9px;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.card{
    min-height:76px;
    padding:13px;
    border-radius:17px;
    text-align:right;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
}

.card span{
    display:block;
    font-size:25px;
    margin-bottom:5px;
}

.card b{
    font-size:11px;
}

.card small{
    display:block;
    margin-top:4px;
    color:#8e88a4;
    font-size:8px;
}

.achievements{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.achievement{
    min-height:85px;
    padding:10px 5px;
    text-align:center;
    border-radius:15px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.07);
}

.achievement span{
    display:block;
    font-size:25px;
    margin-bottom:5px;
}

.achievement b{
    font-size:9px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#5f5874;
    font-size:9px;
    line-height:2;
}

.danger{
    width:100%;
    min-height:44px;
    margin-top:9px;
    border-radius:13px;
    background:rgba(255,70,90,.09);
    border:1px solid rgba(255,70,90,.15);
    font-size:10px;
}
</style>
</head>

<body>

<div class="app">

    <div class="top">

        <button class="back" onclick="goHome()">‹</button>

        <div class="title">
            <h1>👤 پروفایل</h1>
            <small>ماجراجوی سرزمین کلمات</small>
        </div>

        <div style="width:44px"></div>

    </div>

    <section class="profileCard">

        <div class="avatar" id="avatar">🧙</div>

        <h2 class="name" id="playerName">
            بازیکن نمونه
        </h2>

        <div class="rank" id="rank">
            بازیکن جدید
        </div>

        <div class="levelBox">

            <div class="levelTop">
                <span>پیشرفت بازی</span>
                <span id="levelText">۱ / ۱۲۰۰</span>
            </div>

            <div class="bar">
                <div class="fill" id="progress"></div>
            </div>

        </div>

        <div class="stats">

            <div class="stat">
                <span>🪙</span>
                <b id="coins">0</b>
                <small>سکه</small>
            </div>

            <div class="stat">
                <span>⭐</span>
                <b id="xp">0</b>
                <small>XP</small>
            </div>

            <div class="stat">
                <span>🏆</span>
                <b id="completed">0</b>
                <small>مرحله کامل</small>
            </div>

        </div>

    </section>

    <section class="section">

        <h2>✨ دسترسی سریع</h2>

        <div class="menu">

            <button class="card" onclick="openAchievements()">
                <span>🏆</span>
                <b>دستاوردها</b>
                <small>جایزه‌های قابل دریافت</small>
            </button>

            <button class="card" onclick="openShop()">
                <span>🛒</span>
                <b>فروشگاه</b>
                <small>ابزارهای جادویی</small>
            </button>

            <button class="card" onclick="continueGame()">
                <span>🎮</span>
                <b>ادامه بازی</b>
                <small>رفتن به مرحله فعلی</small>
            </button>

            <button class="card" onclick="goHome()">
                <span>🏠</span>
                <b>صفحه اصلی</b>
                <small>بازگشت به خانه</small>
            </button>

        </div>

    </section>

    <section class="section">

        <h2>🌟 افتخارات</h2>

        <div class="achievements">

            <div class="achievement">
                <span>🌱</span>
                <b>شروع ماجراجویی</b>
            </div>

            <div class="achievement">
                <span>🔥</span>
                <b>۱۰ مرحله</b>
            </div>

            <div class="achievement">
                <span>⚔️</span>
                <b>۱۰۰ مرحله</b>
            </div>

            <div class="achievement">
                <span>👑</span>
                <b>۵۰۰ مرحله</b>
            </div>

            <div class="achievement">
                <span>💎</span>
                <b>۱۰۰۰ مرحله</b>
            </div>

            <div class="achievement">
                <span>🔮</span>
                <b>افسانه ۱۲۰۰</b>
            </div>

        </div>

    </section>

    <section class="section">

        <button class="danger" onclick="resetProfile()">
            ♻️ پاک کردن نام و آواتار پروفایل
        </button>

    </section>

    <div class="footer">
        کلمه‌باز © Ghost Studio<br>
        سرزمین جادویی کلمات
    </div>

</div>

<script>

const TOTAL_LEVELS = 1200;

/* اطلاعات بازیکن */

let playerName =
    localStorage.getItem(
        "kalemebaz_profileName"
    ) || "بازیکن نمونه";

let avatar =
    localStorage.getItem(
        "kalemebaz_avatar"
    ) || "🧙";

let currentLevel =
    parseInt(
        localStorage.getItem(
            "kalemebaz_currentLevel"
        ) || "1"
    );

let completed =
    parseInt(
        localStorage.getItem(
            "kalemebaz_completedLevels"
        ) || "0"
    );

let coins =
    parseInt(
        localStorage.getItem(
            "kalemebaz_coins"
        ) || "100"
    );

let xp =
    parseInt(
        localStorage.getItem(
            "kalemebaz_xp"
        ) || "0"
    );

/* جلوگیری از مقادیر نامعتبر */

currentLevel =
    Math.max(
        1,
        Math.min(
            TOTAL_LEVELS,
            currentLevel
        )
    );

completed =
    Math.max(
        0,
        Math.min(
            TOTAL_LEVELS,
            completed
        )
    );

/* نمایش */

document.getElementById(
    "playerName"
).textContent = playerName;

document.getElementById(
    "avatar"
).textContent = avatar;

document.getElementById(
    "coins"
).textContent = coins;

document.getElementById(
    "xp"
).textContent = xp;

document.getElementById(
    "completed"
).textContent = completed;

document.getElementById(
    "levelText"
).textContent =
    currentLevel +
    " / " +
    TOTAL_LEVELS;

/* رتبه */

function getRank(level){

    if(level >= 1200)
        return "👑 افسانه کلمه‌باز";

    if(level >= 1000)
        return "🔥 استاد افسانه‌ای";

    if(level >= 800)
        return "⚔️ جنگجوی کلمات";

    if(level >= 500)
        return "🔮 جادوگر کلمات";

    if(level >= 300)
        return "💎 استاد کلمات";

    if(level >= 100)
        return "🌟 ماجراجوی حرفه‌ای";

    if(level >= 25)
        return "✨ ماجراجو";

    if(level >= 10)
        return "🌱 یادگیرنده";

    return "🪄 بازیکن جدید";
}

document.getElementById(
    "rank"
).textContent =
    getRank(currentLevel);

/* نوار پیشرفت */

const percent =
    ((currentLevel - 1) /
    (TOTAL_LEVELS - 1)) * 100;

document.getElementById(
    "progress"
).style.width =
    Math.max(
        0,
        Math.min(
            100,
            percent
        )
    ) + "%";

/* صفحات */

function goHome(){

    location.href =
        "index.html";

}

function continueGame(){

    location.href =
        "game.html?level=" +
        currentLevel;

}

function openShop(){

    location.href =
        "shop.html";

}

function openAchievements(){

    location.href =
        "achievements.html";

}

/* پاک کردن فقط اطلاعات پروفایل */

function resetProfile(){

    const ok =
        confirm(
            "نام و آواتار پروفایل پاک شود؟"
        );

    if(!ok)
        return;

    localStorage.removeItem(
        "kalemebaz_profileName"
    );

    localStorage.removeItem(
        "kalemebaz_avatar"
    );

    location.reload();

}

</script>

</body>
</html>

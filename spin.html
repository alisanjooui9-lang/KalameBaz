<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پاداش روزانه | کلمه‌باز</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 10%, #273b72 0%, transparent 35%),
        linear-gradient(180deg, #070b20 0%, #101735 55%, #070a18 100%);
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      opacity: .8;
      box-shadow: 0 0 8px #fff;
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(950px, 94%);
      margin: auto;
      padding: 18px 0 35px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .back {
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.12);
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
    }

    .coins {
      background: rgba(255,196,55,.12);
      border: 1px solid rgba(255,196,55,.3);
      color: #ffd75a;
      padding: 10px 15px;
      border-radius: 14px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 20px 10px 25px;
    }

    .hero-icon {
      font-size: 62px;
      filter: drop-shadow(0 0 15px rgba(255,214,77,.5));
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 7vw, 42px);
    }

    .subtitle {
      color: #bfc9e9;
      margin: 10px auto 0;
      line-height: 1.8;
      max-width: 650px;
      font-size: 14px;
    }

    .status {
      margin: 18px auto 25px;
      max-width: 600px;
      padding: 15px;
      border-radius: 18px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      text-align: center;
    }

    .status-title {
      color: #aebbe2;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .day-number {
      font-size: 28px;
      font-weight: bold;
      color: #ffd75a;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .day {
      position: relative;
      padding: 15px;
      min-height: 145px;
      border-radius: 20px;
      background: rgba(255,255,255,.065);
      border: 1px solid rgba(255,255,255,.1);
      transition: .2s;
      overflow: hidden;
    }

    .day.current {
      border-color: #ffd75a;
      box-shadow: 0 0 22px rgba(255,215,90,.14);
      background: rgba(255,215,90,.07);
    }

    .day.special {
      border-color: rgba(176,128,255,.55);
      background: rgba(126,76,190,.12);
    }

    .day.big {
      border-color: rgba(255,177,54,.7);
      background: rgba(255,150,40,.11);
    }

    .day.final {
      grid-column: 1 / -1;
      min-height: 190px;
      border-color: #ffd75a;
      background:
        radial-gradient(circle at 50% 30%, rgba(255,215,90,.16), transparent 60%),
        rgba(255,255,255,.07);
      box-shadow: 0 0 35px rgba(255,215,90,.12);
    }

    .day.locked {
      opacity: .42;
    }

    .day.claimed {
      opacity: .68;
    }

    .day-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .day-title {
      font-weight: bold;
      color: #fff;
    }

    .badge {
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 10px;
      background: rgba(255,255,255,.09);
      color: #bfc9e9;
    }

    .reward {
      line-height: 1.9;
      color: #e7ebfa;
      font-size: 13px;
      min-height: 48px;
    }

    .reward strong {
      color: #ffd75a;
    }

    .claim {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 11px;
      margin-top: 8px;
      color: #10152b;
      background: linear-gradient(135deg, #ffe27a, #ffbd38);
      font-weight: bold;
      cursor: pointer;
    }

    .claim:disabled {
      cursor: not-allowed;
      background: rgba(255,255,255,.09);
      color: #8d96b5;
    }

    .final .claim {
      font-size: 16px;
      padding: 14px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 120px);
      width: min(90%, 430px);
      padding: 14px 18px;
      border-radius: 16px;
      background: #171d3a;
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      text-align: center;
      z-index: 20;
      transition: .3s;
    }

    .toast.show {
      transform: translate(-50%, 0);
    }

    @media (min-width: 650px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .day.final {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 390px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .day.final {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="container">

  <div class="topbar">
    <a class="back" href="index.html">← خانه</a>
    <div class="coins">🪙 <span id="coins">0</span></div>
  </div>

  <section class="hero">
    <div class="hero-icon">🎁</div>
    <h1>پاداش روزانه</h1>
    <div class="subtitle">
      هر روز وارد شو و جایزه همان روز را دریافت کن.
      پاداش‌های ویژه در روزهای ۷، ۱۴، ۲۰ و ۳۰ منتظر تو هستند!
    </div>
  </section>

  <div class="status">
    <div class="status-title">روز فعلی</div>
    <div class="day-number" id="currentDayText">روز ۱ از ۳۰</div>
  </div>

  <div class="grid" id="rewardGrid"></div>

</div>

<div class="toast" id="toast"></div>

<script>
  const TOTAL_DAYS = 30;

  const REWARDS = {
    1:  { coins: 100 },
    2:  { coins: 100 },
    3:  { coins: 100 },
    4:  { coins: 100 },
    5:  { coins: 100 },
    6:  { coins: 100 },

    7:  { coins: 500, hintLetters: 1 },

    8:  { coins: 100 },
    9:  { coins: 100 },
    10: { coins: 100 },
    11: { coins: 100 },
    12: { coins: 100 },
    13: { coins: 100 },

    14: { coins: 1000, hintLetters: 2, removeLetters: 1 },

    15: { coins: 100 },
    16: { coins: 100 },
    17: { coins: 100 },
    18: { coins: 100 },
    19: { coins: 100 },

    20: { coins: 2000, removeLetters: 2, solveWords: 1 },

    21: { coins: 100 },
    22: { coins: 100 },
    23: { coins: 100 },
    24: { coins: 100 },
    25: { coins: 100 },
    26: { coins: 100 },
    27: { coins: 100 },
    28: { coins: 100 },
    29: { coins: 100 },

    30: {
      coins: 10000,
      hintLetters: 5,
      removeLetters: 5,
      solveWords: 3,
      magicPotions: 3,
      xp: 500
    }
  };

  const DAY_KEY = "kalemebaz_dailyRewardDay";
  const DATE_KEY = "kalemebaz_dailyRewardLastDate";
  const CLAIMED_KEY = "kalemebaz_dailyRewardClaimed";

  function getNumber(key, defaultValue = 0) {
    const value = Number(localStorage.getItem(key));
    return Number.isFinite(value) ? value : defaultValue;
  }

  function setNumber(key, value) {
    localStorage.setItem(key, String(value));
  }

  function getCurrentDay() {
    let day = getNumber(DAY_KEY, 1);

    if (day < 1) day = 1;
    if (day > TOTAL_DAYS + 1) day = TOTAL_DAYS + 1;

    return day;
  }

  function getToday() {
    const d = new Date();

    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");

    return `${y}-${m}-${day}`;
  }

  function alreadyClaimedToday() {
    return localStorage.getItem(DATE_KEY) === getToday();
  }

  function getCoins() {
    return getNumber("kalemebaz_coins", 100);
  }

  function addCoins(amount) {
    setNumber("kalemebaz_coins", getCoins() + amount);
  }

  function addItem(key, amount) {
    setNumber(key, getNumber(key, 0) + amount);
  }

  function addXP(amount) {
    setNumber("kalemebaz_xp", getNumber("kalemebaz_xp", 0) + amount);
  }

  function rewardText(reward) {
    const parts = [];

    if (reward.coins) {
      parts.push(`🪙 <strong>${reward.coins.toLocaleString("fa-IR")}</strong> سکه`);
    }

    if (reward.hintLetters) {
      parts.push(`💡 ${reward.hintLetters} طلسم`);
    }

    if (reward.removeLetters) {
      parts.push(`🧹 ${reward.removeLetters} پاک‌کن`);
    }

    if (reward.solveWords) {
      parts.push(`✨ ${reward.solveWords} جواب`);
    }

    if (reward.magicPotions) {
      parts.push(`🧪 ${reward.magicPotions} معجون جادویی`);
    }

    if (reward.xp) {
      parts.push(`⭐ ${reward.xp} XP`);
    }

    return parts.join("<br>");
  }

  function getDayClass(day, currentDay) {
    let classes = ["day"];

    if (day === currentDay) classes.push("current");
    if (day < currentDay) classes.push("claimed");
    if (day > currentDay) classes.push("locked");

    if (day === 7 || day === 14) {
      classes.push("special");
    }

    if (day === 20) {
      classes.push("big");
    }

    if (day === 30) {
      classes.push("final");
    }

    return classes.join(" ");
  }

  function render() {
    const currentDay = getCurrentDay();
    const claimedToday = alreadyClaimedToday();

    document.getElementById("coins").textContent =
      getCoins().toLocaleString("fa-IR");

    if (currentDay <= TOTAL_DAYS) {
      document.getElementById("currentDayText").textContent =
        `روز ${currentDay.toLocaleString("fa-IR")} از ${TOTAL_DAYS}`;
    } else {
      document.getElementById("currentDayText").textContent =
        "🎉 هر ۳۰ روز کامل شد!";
    }

    const grid = document.getElementById("rewardGrid");
    grid.innerHTML = "";

    for (let day = 1; day <= TOTAL_DAYS; day++) {
      const reward = REWARDS[day];

      const card = document.createElement("div");
      card.className = getDayClass(day, currentDay);

      let badge = "🔒 قفل";

      if (day < currentDay) {
        badge = "✓ دریافت شد";
      } else if (day === currentDay) {
        badge = claimedToday ? "✓ امروز دریافت شد" : "🎁 آماده";
      }

      const button = document.createElement("button");
      button.className = "claim";

      if (day < currentDay) {
        button.textContent = "دریافت شده ✓";
        button.disabled = true;
      } else if (day > currentDay) {
        button.textContent = "🔒 قفل";
        button.disabled = true;
      } else if (claimedToday) {
        button.textContent = "✓ امروز دریافت شد";
        button.disabled = true;
      } else {
        button.textContent = "🎁 دریافت پاداش";
        button.disabled = false;
        button.onclick = claimReward;
      }

      card.innerHTML = `
        <div class="day-head">
          <div class="day-title">روز ${day.toLocaleString("fa-IR")}</div>
          <div class="badge">${badge}</div>
        </div>

        <div class="reward">
          ${rewardText(reward)}
        </div>
      `;

      card.appendChild(button);
      grid.appendChild(card);
    }
  }

  function claimReward() {
    const currentDay = getCurrentDay();

    if (currentDay > TOTAL_DAYS) {
      showToast("🎉 تمام ۳۰ روز را کامل کرده‌ای!");
      return;
    }

    if (alreadyClaimedToday()) {
      showToast("⏰ پاداش امروز را قبلاً دریافت کرده‌ای.");
      return;
    }

    const reward = REWARDS[currentDay];

    if (!reward) {
      showToast("خطایی در پاداش این روز رخ داد.");
      return;
    }

    if (reward.coins) {
      addCoins(reward.coins);
    }

    if (reward.hintLetters) {
      addItem("kalemebaz_hintLetters", reward.hintLetters);
    }

    if (reward.removeLetters) {
      addItem("kalemebaz_removeLetters", reward.removeLetters);
    }

    if (reward.solveWords) {
      addItem("kalemebaz_solveWords", reward.solveWords);
    }

    if (reward.magicPotions) {
      addItem("kalemebaz_magicPotions", reward.magicPotions);
    }

    if (reward.xp) {
      addXP(reward.xp);
    }

    localStorage.setItem(DATE_KEY, getToday());

    if (currentDay < TOTAL_DAYS) {
      setNumber(DAY_KEY, currentDay + 1);
    } else {
      setNumber(DAY_KEY, TOTAL_DAYS + 1);
    }

    localStorage.setItem(
      CLAIMED_KEY + "_" + currentDay,
      getToday()
    );

    if (currentDay === 30) {
      showToast("👑 پاداش افسانه‌ای روز ۳۰ دریافت شد!");
    } else if (currentDay === 20) {
      showToast("🔥 پاداش بزرگ روز ۲۰ دریافت شد!");
    } else if (currentDay === 14) {
      showToast("💜 پاداش ویژه روز ۱۴ دریافت شد!");
    } else if (currentDay === 7) {
      showToast("⭐ پاداش ویژه روز ۷ دریافت شد!");
    } else {
      showToast("🎁 پاداش امروز با موفقیت دریافت شد!");
    }

    render();
  }

  function showToast(message) {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2600);
  }

  function createStars() {
    const box = document.getElementById("stars");

    for (let i = 0; i < 80; i++) {
      const star = document.createElement("div");
      star.className = "star";

      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";

      const size = 1 + Math.random() * 3;
      star.style.width = size + "px";
      star.style.height = size + "px";

      star.style.opacity = 0.25 + Math.random() * 0.75;

      box.appendChild(star);
    }
  }

  createStars();
  render();
</script>

</body>
</html>
